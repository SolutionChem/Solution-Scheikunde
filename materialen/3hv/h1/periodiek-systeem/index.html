<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactief periodiek systeem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #11264a; --navy2: #163a63; --navy3: #2c5687;
    --licht: #eef4fb; --licht2: #dbe8f5; --rand: #c9d8ea;
    --tekst: #14213a; --zacht: #4a5a72;
    /* hoofdsoorten (zoals in het boek) */
    --metaal: #f8e39b; --nietmetaal: #f0948a; --metalloide: #5aaee0;
    /* groepen */
    --alkali: #f4a261; --aardalkali: #9fd07a; --transitie: #cfa0dd; --posttransitie: #86cfc8;
    --lanthanide: #f59cc3; --actinide: #c9a27c; --halogeen: #5fc488; --edelgas: #a6b0e6;
    --kop: "Oswald", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, "Helvetica Neue", Arial, sans-serif; color: var(--tekst);
    background: var(--licht); line-height: 1.45; font-size: 15px;
    -webkit-font-smoothing: antialiased; padding: 14px;
  }
  button { font: inherit; cursor: pointer; color: inherit; }

  /* ---------- periodiek systeem ---------- */
  /* De breedte hangt af van de hoogte van het venster, zodat periodiek systeem
     en uitlegblok samen in beeld passen (niet smaller dan 990 px). */
  .ps { container: ps / inline-size; background: #fff; border-radius: 10px;
        box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 10px 12px 14px;
        max-width: max(990px, calc((100vh - 300px) * 1.85)); margin: 0 auto; }
  .rooster {
    display: grid; grid-template-columns: .55fr repeat(18, minmax(0, 1fr));
    gap: .22cqw;
  }
  .gnr, .pnr { font-family: var(--kop); font-weight: 600; color: var(--navy); text-align: center; }
  .gnr { font-size: 1.35cqw; align-self: end; padding-bottom: .3cqw; }
  .pnr { font-size: 1.5cqw; display: flex; align-items: center; justify-content: center; }
  .tussen { grid-column: 1 / -1; height: 1.3cqw; }

  .el {
    position: relative; aspect-ratio: 1; min-width: 0; margin: 0;
    border: 1px solid #1d2433; border-radius: .25cqw; padding: .2cqw .32cqw .15cqw;
    background: var(--bg); color: #111; text-align: left; line-height: 1.05;
    display: grid; grid-template-rows: auto 1fr auto auto; overflow: hidden;
    transition: transform .12s, box-shadow .12s, opacity .2s;
  }
  .el .m, .el .z { font-size: .8cqw; font-variant-numeric: tabular-nums; }
  .el .s { font-size: 2.05cqw; font-weight: 700; text-align: center; align-self: center; }
  .el .n { font-size: .6cqw; text-align: center; white-space: nowrap; overflow: hidden; letter-spacing: -.01em; }
  .el:hover, .el:focus-visible { transform: scale(1.12); z-index: 2; box-shadow: 0 3px 10px rgba(0,0,0,.3); outline: none; }
  .el.actief { z-index: 3; outline: 3px solid var(--navy); outline-offset: 1px; }
  .el.gat { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .2cqw; }
  .el.gat .s { font-size: .95cqw; }
  .el.gat .n { font-size: .6cqw; }
  .rooster.filter .el:not(.aan) { opacity: .18; }

  /* ---------- informatieblok (onder het periodiek systeem, overlapt niets) ---------- */
  .info { grid-column: 1 / -1; grid-row: 12; margin-top: 10px; }
  .info-binnen {
    background: var(--licht); border: 1px solid var(--rand); border-radius: 8px;
    padding: 10px 18px 11px; font-size: clamp(15px, 1.6cqw, 17px); line-height: 1.45; min-height: 14.4em;
  }
  .info-kop { display: flex; align-items: center; gap: .8em; margin-bottom: .4em; flex-wrap: wrap; }
  .mini { width: 3.1em; height: 3.1em; flex: 0 0 auto; border: 1px solid #1d2433; border-radius: 3px; background: var(--bg);
          display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; color: #111; }
  .mini b { font-size: 1.4em; }
  .mini small { font-size: .75em; margin-top: .15em; }
  .info h2 { margin: 0; font-family: var(--kop); font-weight: 600; font-size: 1.45em; color: var(--navy); letter-spacing: .02em; line-height: 1.1; }
  .labels { display: flex; flex-wrap: wrap; gap: .3em; margin-top: .2em; }
  .label { font-size: .85em; padding: .12em .55em; border-radius: 99px; background: #fff; border: 1px solid var(--rand); white-space: nowrap; }
  .label .stip { display: inline-block; width: .75em; height: .75em; border-radius: 2px; margin-right: .35em; vertical-align: -.05em; border: 1px solid rgba(0,0,0,.4); background: var(--bg); }
  .fase { margin-left: auto; display: flex; align-items: center; gap: .45em; background: var(--navy2); color: #fff;
          border-radius: 8px; padding: .3em .7em; font-size: .9em; }
  .fase svg { width: 1.5em; height: 1.5em; flex: 0 0 auto; }
  .fase b { display: block; font-family: var(--kop); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 1.05em; }
  .fase span { display: block; font-size: .82em; opacity: .85; }
  .kolommen { display: grid; grid-template-columns: 1fr 1fr; gap: .4em 1.2em; }
  .kolommen h3 { margin: 0 0 .15em; font-family: var(--kop); font-weight: 500; font-size: .85em; letter-spacing: .1em;
                 text-transform: uppercase; color: var(--navy3); }
  .kolommen p { margin: 0; }
  .opm { margin: .35em 0 0; font-size: .9em; color: var(--zacht); }

  @container ps (max-width: 960px) {
    .info-binnen { min-height: 0; padding: 12px 14px; }
  }
  @container ps (max-width: 900px) {
    .el .n, .el.gat .n { display: none; }
    .el .s { font-size: 2.3cqw; }
    .el .m, .el .z { font-size: .95cqw; }
  }
  @container ps (max-width: 560px) {
    .el { display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 2px; }
    .el .m, .el .z { display: none; }
    .el .s { font-size: 2.75cqw; }
    .el.gat .s { font-size: 1.6cqw; }
    .gnr { font-size: 2.1cqw; }
    .pnr { font-size: 2.4cqw; }
  }
  @media (max-width: 560px) {
    body { padding: 8px; }
    .ps { padding: 8px 6px 10px; }
    .kolommen { grid-template-columns: 1fr; }
    .fase { margin-left: 0; }
  }

  /* ---------- legenda ---------- */
  /* in het lege vak bovenin, net als de legenda in het boek */
  .legenda-vak { grid-column: 4 / 14; grid-row: 2 / 5; display: flex; align-items: center; justify-content: center;
                 padding-bottom: .6cqw; }
  .legenda {
    position: relative; border: 1px solid var(--rand); border-radius: 8px; padding: .9em 1em .55em;
    display: grid; grid-template-columns: auto auto; grid-template-areas: "m n" "m x";
    gap: .35em 2em; font-size: 1.2cqw; line-height: 1.2;
  }
  .kader-titel { position: absolute; top: 0; left: .8em; transform: translateY(-50%); background: #fff; padding: 0 .45em;
                 font-family: var(--kop); font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
                 font-size: .85em; color: var(--zacht); }
  .legenda-groep[data-vak="m"] { grid-area: m; }
  .legenda-groep[data-vak="n"] { grid-area: n; }
  .legenda-groep[data-vak="x"] { grid-area: x; }
  .legenda-groep .items { display: grid; gap: .1em .8em; }
  .legenda-groep[data-vak="m"] .items { grid-template-columns: auto auto; grid-auto-flow: column; grid-template-rows: repeat(3, auto); }
  .leg, .leg-titel { display: inline-flex; align-items: center; gap: .5em; padding: .15em .5em .15em .25em; border-radius: 6px;
         border: 0; background: transparent; text-align: left; white-space: nowrap; }
  .leg-titel { font-family: var(--kop); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--navy); margin-bottom: .1em; }
  .leg-titel.stil { cursor: default; }
  .leg:hover, .leg:focus-visible, .leg-titel:not(.stil):hover, .leg-titel:focus-visible { background: var(--licht2); outline: none; }
  .leg.vast, .leg-titel.vast { background: var(--navy2); color: #fff; }
  .vlak { width: 1.25em; height: 1.25em; border: 1px solid #1d2433; border-radius: 2px; background: var(--bg); flex: 0 0 auto; }
  @container ps (max-width: 960px) {
    .legenda-vak { grid-column: 1 / -1; grid-row: 13; margin-top: 22px; padding: 0; justify-content: flex-start; }
    .legenda { font-size: 14px; width: 100%; grid-template-columns: auto auto; justify-content: start;
               grid-template-areas: "m m" "n x"; }
  }
  @container ps (max-width: 560px) {
    .legenda { grid-template-columns: 1fr; grid-template-areas: "m" "n" "x"; }
  }
  @container ps (max-width: 400px) {
    .legenda-groep[data-vak="m"] .items { grid-template-columns: 1fr; grid-auto-flow: row; grid-template-rows: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .el { transition: none; }
    .el:hover, .el:focus-visible { transform: none; }
  }
</style>
</head>
<body>
<div class="ps">
  <div class="rooster" id="rooster">
    <div class="legenda-vak"><div class="legenda" id="legenda" role="group" aria-labelledby="kader-titel"><div class="kader-titel" id="kader-titel">Legenda</div></div></div>
    <div class="info" id="info" aria-live="polite"><div class="info-binnen" id="info-binnen"></div></div>
  </div>
</div>

<script>
/* ---------- soorten elementen ----------
   basis = de kleur uit het boek (metaal, niet-metaal, metalloïde);
   eigen = de kleur van de groep (andere helft van het vakje). */
const SOORTEN = {
  alkali:        { naam: "Alkalimetalen",         enkel: "Alkalimetaal",         basis: "metaal",     eigen: "alkali" },
  aardalkali:    { naam: "Aardalkalimetalen",     enkel: "Aardalkalimetaal",     basis: "metaal",     eigen: "aardalkali" },
  transitie:     { naam: "Transitiemetalen",      enkel: "Transitiemetaal",      basis: "metaal",     eigen: "transitie" },
  posttransitie: { naam: "Post-transitiemetalen", enkel: "Post-transitiemetaal", basis: "metaal",     eigen: "posttransitie" },
  lanthanide:    { naam: "Lanthaniden",           enkel: "Lanthanide",           basis: "metaal",     eigen: "lanthanide" },
  actinide:      { naam: "Actinoïden",            enkel: "Actinoïde",            basis: "metaal",     eigen: "actinide" },
  nietmetaal:    { naam: "Overige niet-metalen",  enkel: "Niet-metaal",          basis: "nietmetaal", eigen: null },
  halogeen:      { naam: "Halogenen",             enkel: "Halogeen",             basis: "nietmetaal", eigen: "halogeen" },
  /* astaat en tennessine: halogeen, maar in het boek een metalloïde (niet apart in de legenda) */
  halogeenmetalloide: { naam: "Halogenen",        enkel: "Halogeen",             basis: "metalloide", eigen: "halogeen" },
  edelgas:       { naam: "Edelgassen",            enkel: "Edelgas",              basis: "nietmetaal", eigen: "edelgas" },
  metalloide:    { naam: "Metalloïden",           enkel: "Metalloïde",           basis: "metalloide", eigen: null }
};
const BASIS_NAAM = { metaal: "Metaal", nietmetaal: "Niet-metaal", metalloide: "Metalloïde" };

function soortVan(z) {
  if ([3, 11, 19, 37, 55, 87].includes(z)) return "alkali";
  if ([4, 12, 20, 38, 56, 88].includes(z)) return "aardalkali";
  if (z >= 57 && z <= 71) return "lanthanide";
  if (z >= 89 && z <= 103) return "actinide";
  if ([85, 117].includes(z)) return "halogeenmetalloide";
  if ([5, 14, 32, 33, 51, 52, 84].includes(z)) return "metalloide";
  if ([9, 17, 35, 53].includes(z)) return "halogeen";
  if ([2, 10, 18, 36, 54, 86, 118].includes(z)) return "edelgas";
  if ([1, 6, 7, 8, 15, 16, 34].includes(z)) return "nietmetaal";
  if ([13, 31, 49, 50, 81, 82, 83, 113, 114, 115, 116].includes(z)) return "posttransitie";
  return "transitie";
}
function achtergrond(soort) {
  const s = SOORTEN[soort];
  if (!s.eigen) return `var(--${s.basis})`;
  return `linear-gradient(90deg, var(--${s.basis}) 80%, var(--${s.eigen}) 80%)`; // 4/5 basiskleur, 1/5 groepskleur rechts
}

/* ---------- gegevens per element ----------
   [symbool, naam, atoommassa (zoals in de Binas), fase bij 20 °C, voorkomen/winning, toepassing, opmerking bij de fase]
   fase: "vast", "vloeibaar", "gas" of "onbekend". */
const KUNSTMATIG = "Dit element komt niet in de natuur voor. Er zijn maar een paar atomen van gemaakt, in een deeltjesversneller.";
const GEEN = "Er zijn geen toepassingen, want de atomen zijn radioactief en vallen heel snel uit elkaar. Het element wordt alleen voor onderzoek gemaakt.";
const ONBEKEND = "Er zijn nooit genoeg atomen tegelijk gemaakt om dat te weten.";
const zwaar = naar => [KUNSTMATIG + " Het is genoemd naar " + naar + ".", GEEN, ONBEKEND];

const E = [
  ["H","Waterstof","1,008","gas","Komt op aarde bijna niet als los element voor, maar zit gebonden in water en aardgas. Waterstof wordt vooral gemaakt uit aardgas, of door water met elektriciteit te ontleden. In het heelal is het het meest voorkomende element: sterren bestaan er grotendeels uit.","Waterstof is een grondstof voor kunstmest (via ammoniak). Het wordt ook gebruikt als brandstof voor waterstofauto's en -bussen."],
  ["He","Helium","4,003","gas","Helium ontstaat diep in de aarde bij radioactief verval en hoopt zich op in aardgasvelden. Daar wordt het uit het aardgas gewonnen. In de lucht zit bijna geen helium.","Helium is lichter dan lucht en brandt niet, en is daarom geschikt om ballonnen en luchtschepen mee te vullen. Vloeibaar helium koelt de magneten in MRI-scanners."],
  ["Li","Lithium","6,941","vast","Lithium komt niet puur voor, omdat het snel reageert met water en lucht. Het zit in gesteenten en in zoutmeren, bijvoorbeeld in Chili en Argentinië.","Lithium wordt vooral gebruikt in oplaadbare batterijen (lithium-ionaccu's), zoals die in telefoons, laptops en elektrische auto's."],
  ["Be","Beryllium","9,012","vast","Beryllium komt niet puur voor, maar zit in het mineraal beril. Smaragd is een groene vorm van beril.","Beryllium is een licht en stijf metaal en wordt gebruikt voor onderdelen van satellieten en ruimtetelescopen. Het stof ervan is wel giftig."],
  ["B","Boor","10,81","vast","Boor komt niet puur voor, maar zit in boraatmineralen zoals borax. Die vind je in uitgedroogde zoutmeren, bijvoorbeeld in Turkije en de VS.","Boor zit in hittebestendig glas (borosilicaatglas), zoals ovenschalen en het glaswerk in het lab."],
  ["C","Koolstof","12,01","vast","Koolstof komt puur voor als diamant en als grafiet. Verder zit het in steenkool, aardolie, aardgas en koolstofdioxide, en in alle levende wezens.","Grafiet zit in potloden, en diamant in sieraden en boren. IJzer met een klein beetje koolstof erin is staal."],
  ["N","Stikstof","14,01","gas","Stikstof komt puur voor: lucht bestaat voor 78% uit stikstof. Het wordt gewonnen door lucht af te koelen tot die vloeibaar is en de stoffen daarna te scheiden.","Stikstof is een grondstof voor kunstmest (via ammoniak). Met vloeibare stikstof (−196 °C) kun je dingen heel snel bevriezen. Zakken chips worden ermee gevuld, zodat de chips langer goed blijven."],
  ["O","Zuurstof","16,00","gas","Zuurstof komt puur voor: lucht bestaat voor 21% uit zuurstof, dat door planten wordt gemaakt (fotosynthese). Het wordt gewonnen uit vloeibare lucht. Zuurstof zit ook in water en in de meeste gesteenten.","In ziekenhuizen krijgen patiënten soms extra zuurstof. Zuurstof wordt ook gebruikt bij het maken van staal en bij lassen."],
  ["F","Fluor","19,00","gas","Fluor komt nooit puur voor, omdat het het meest reactieve element is. Het zit onder andere in het mineraal vloeispaat (fluoriet).","Fluoride zit in tandpasta en helpt tegen gaatjes. Ook teflon, de antiaanbaklaag in pannen, bevat fluor."],
  ["Ne","Neon","20,18","gas","Neon komt puur voor in de lucht, maar er zit maar heel weinig van in. Het wordt gewonnen uit vloeibare lucht.","Neon wordt gebruikt in neonreclame: het geeft rood-oranje licht als er stroom door het gas gaat."],
  ["Na","Natrium","22,99","vast","Natrium komt niet puur voor, omdat het heftig reageert met water. Het zit in keukenzout (natriumchloride), in zeewater en in zoutlagen in de bodem. Natrium wordt gemaakt met elektrolyse van gesmolten zout.","Natrium zit in natriumlampen, de oranje straatverlichting. Natriumverbindingen zoals keukenzout, soda en bakpoeder gebruik je in huis."],
  ["Mg","Magnesium","24,31","vast","Magnesium komt niet puur voor, maar zit opgelost in zeewater en in gesteenten zoals dolomiet.","Magnesium wordt gebruikt in lichte legeringen voor fietsen, auto-onderdelen en laptops. Het brandt met fel wit licht, en zit daarom in vuurwerk en sterretjes."],
  ["Al","Aluminium","26,98","vast","Aluminium komt niet puur voor, maar het is wel het meest voorkomende metaal in de aardkorst. Het wordt met elektrolyse gewonnen uit het erts bauxiet, en dat kost veel elektriciteit.","Aluminium is licht en roest niet. Daarom worden er blikjes, aluminiumfolie, vliegtuigen, fietsen en raamkozijnen van gemaakt."],
  ["Si","Silicium","28,09","vast","Silicium komt niet puur voor, maar zit in zand (siliciumdioxide) en in bijna alle gesteenten. Na zuurstof is het het meest voorkomende element in de aardkorst.","Silicium is de grondstof voor computerchips en zonnepanelen. Van zand (siliciumdioxide) wordt glas gemaakt."],
  ["P","Fosfor","30,97","vast","Fosfor komt niet puur voor. Het zit in fosfaaterts, dat vooral in Marokko en China wordt gewonnen, en ook in je botten, tanden en DNA.","Fosfaat is een belangrijk onderdeel van kunstmest. Rode fosfor zit in het strijkvlak van een luciferdoosje."],
  ["S","Zwavel","32,06","vast","Zwavel komt puur voor bij vulkanen. Het zit ook in aardolie en aardgas; daar wordt het uitgehaald, zodat er bij verbranden minder zure regen ontstaat.","Zwavel is de grondstof voor zwavelzuur, de stof die de chemische industrie het meest maakt. Het wordt ook gebruikt om het rubber van autobanden sterk te maken."],
  ["Cl","Chloor","35,45","gas","Chloor komt niet puur voor, maar zit in keukenzout (natriumchloride) in zeewater. Het wordt gemaakt met elektrolyse van zout water.","Met chloor worden zwemwater en drinkwater gedesinfecteerd. Het is ook een grondstof voor de kunststof pvc, waar bijvoorbeeld buizen van worden gemaakt."],
  ["Ar","Argon","39,95","gas","Argon komt puur voor in de lucht, die voor bijna 1% uit argon bestaat. Het wordt gewonnen uit vloeibare lucht.","Argon wordt gebruikt als beschermgas bij lassen. Het zit ook als vulgas tussen de ruiten van dubbel glas en in gloeilampen."],
  ["K","Kalium","39,10","vast","Kalium komt niet puur voor, omdat het heftig reageert met water. Het zit in kaliumzouten in de bodem, bijvoorbeeld in Canada en Rusland, en in planten.","Kaliumzouten worden gebruikt in kunstmest. Je lichaam heeft kalium nodig voor je zenuwen en spieren; er zit veel van in bananen."],
  ["Ca","Calcium","40,08","vast","Calcium komt niet puur voor. Het zit in kalksteen, krijt, marmer en gips, en ook in schelpen, botten en tanden.","Calciumverbindingen zitten in cement, kalk en schoolbordkrijt. Uit je voeding heb je calcium nodig voor sterke botten."],
  ["Sc","Scandium","44,96","vast","Scandium komt niet puur voor. Het zit in kleine beetjes verspreid over veel mineralen en is daardoor moeilijk te winnen.","Met scandium maak je lichte en sterke aluminiumlegeringen, bijvoorbeeld voor fietsframes. Het zit ook in de felle lampen van stadions."],
  ["Ti","Titaan","47,87","vast","Titaan komt niet puur voor, maar zit in de mineralen rutiel en ilmeniet (titaanoxiden).","Titaan is sterk, licht en roest niet, en wordt daarom gebruikt voor kunstheupen, vliegtuigen en brillenmonturen. Titaandioxide is de witte kleurstof in verf en zonnebrand."],
  ["V","Vanadium","50,94","vast","Vanadium komt niet puur voor. Het wordt gewonnen uit ertsen, vooral in China, Rusland en Zuid-Afrika.","Vanadium maakt staal sterker. Dat zie je bij gereedschap: op steeksleutels staat vaak chroom-vanadium."],
  ["Cr","Chroom","52,00","vast","Chroom komt niet puur voor. Het wordt gewonnen uit het erts chromiet.","Chroom zit in roestvrij staal (rvs). Kranen en fietsonderdelen krijgen vaak een glanzend laagje chroom."],
  ["Mn","Mangaan","54,94","vast","Mangaan komt niet puur voor, maar zit in ertsen zoals bruinsteen (mangaandioxide).","Mangaan maakt staal harder en sterker. Mangaandioxide zit in gewone batterijen."],
  ["Fe","IJzer","55,85","vast","IJzer komt bijna niet puur voor, alleen in meteorieten. Het wordt in een hoogoven gewonnen uit ijzererts, zoals bij Tata Steel in IJmuiden.","Van staal worden gebouwen, bruggen, auto's en schepen gemaakt. IJzer is het meest gebruikte metaal ter wereld."],
  ["Co","Kobalt","58,93","vast","Kobalt komt niet puur voor. Het zit samen met koper en nikkel in ertsen, vooral in Congo.","Kobalt wordt gebruikt in lithium-ionaccu's. Kobaltblauw geeft een blauwe kleur aan glas, verf en aardewerk."],
  ["Ni","Nikkel","58,69","vast","Nikkel komt niet puur voor, behalve in meteorieten. Het wordt gewonnen uit ertsen, bijvoorbeeld in Indonesië en Canada.","Nikkel zit in roestvrij staal en in accu's. Ook de munten van 1 en 2 euro bevatten nikkel."],
  ["Cu","Koper","63,55","vast","Koper komt soms puur voor, als klompjes in gesteente. Meestal wordt het gewonnen uit kopererts, bijvoorbeeld in Chili en Peru.","Koper geleidt stroom en warmte heel goed. Daarom worden er elektriciteitsdraden en waterleidingen van gemaakt."],

/* ---------- plek in het rooster ---------- */
function plek(z) {
  const starts = [1, 3, 11, 19, 37, 55, 87, 119];
  let p = 1; while (z >= starts[p]) p++;
  const i = z - starts[p - 1];
  let g;
  if (p === 1) g = z === 1 ? 1 : 18;
  else if (p <= 3) g = i < 2 ? i + 1 : i + 11;
  else if (p <= 5) g = i + 1;
  else if (i < 2) g = i + 1;
  else if (i < 17) return { periode: p, groep: null, rij: p === 6 ? 10 : 11, kol: i + 2 }; // lanthaniden/actinoïden
  else g = i - 13;
  return { periode: p, groep: g, rij: p + 1, kol: g + 1 };
}

const rooster = document.getElementById("rooster");
const infoBinnen = document.getElementById("info-binnen");
let actiefKnop = null;

function maak(tag, cls, ouder, html) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html != null) el.innerHTML = html;
  (ouder || rooster).appendChild(el);
  return el;
}

  const d = maak("div", "gnr", null, g); d.style.gridColumn = g + 1; d.style.gridRow = 1;
}
for (let p = 1; p <= 7; p++) {
  const d = maak("div", "pnr", null, p); d.style.gridColumn = 1; d.style.gridRow = p + 1;
}

// elementen
E.forEach((d, idx) => {
  const z = idx + 1, [sym, naam, massa] = d, soort = soortVan(z), pos = plek(z);
  const b = maak("button", "el");
  b.type = "button";
  b.dataset.soort = soort;
  b.style.setProperty("--bg", achtergrond(soort));
  b.style.gridRow = pos.rij; b.style.gridColumn = pos.kol;
  b.setAttribute("aria-label", `${naam}, atoomnummer ${z}`);
  b.innerHTML = `<span class="m">${massa}</span><span class="s">${sym}</span><span class="z">${z}</span><span class="n">${naam}</span>`;
  koppel(b, () => toonElement(z, b));
});

// lege plekken in groep 3 (periode 6 en 7) krijgen de kleur van de lanthaniden/actinoïden
[["lanthanide", 7, "57–71"], ["actinide", 8, "89–103"]].forEach(([soort, rij, bereik]) => {
  const b = maak("button", "el gat");
  b.type = "button";
  b.dataset.soort = soort;
  b.style.setProperty("--bg", achtergrond(soort));
  b.style.gridRow = rij; b.style.gridColumn = 4;
  b.setAttribute("aria-label", `${SOORTEN[soort].naam}, atoomnummer ${bereik}`);
  b.innerHTML = `<span class="s">${bereik}</span><span class="n">${SOORTEN[soort].naam}</span>`;
  koppel(b, () => toonGat(soort, b), () => licht(soort), () => licht(null));
});

function koppel(b, toon, aan, uit) {
  b.addEventListener("mouseenter", () => { toon(); if (aan) aan(); });
  b.addEventListener("focus", () => { toon(); if (aan) aan(); });
  b.addEventListener("click", () => { toon(); if (aan) aan(); });
  if (uit) { b.addEventListener("mouseleave", uit); b.addEventListener("blur", uit); }
}

function zetActief(b) {
  if (actiefKnop) actiefKnop.classList.remove("actief");
  actiefKnop = b; b.classList.add("actief");
}

/* ---------- informatieblok ---------- */
const FASE_ICOON = {
  vast: '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="6" cy="6" r="3"/><circle cx="12" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="12" cy="12" r="3"/><circle cx="18" cy="12" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="12" cy="18" r="3"/><circle cx="18" cy="18" r="3"/></svg>',
  vloeibaar: '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="15" r="3"/><circle cx="11" cy="17" r="3"/><circle cx="17" cy="15" r="3"/><circle cx="8" cy="10" r="3"/><circle cx="15" cy="9" r="3"/><circle cx="20" cy="20" r="2.4"/><path d="M1 21h22v2H1z" opacity=".6"/></svg>',
  gas: '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="5" r="2.6"/><circle cx="18" cy="7" r="2.6"/><circle cx="10" cy="14" r="2.6"/><circle cx="20" cy="19" r="2.6"/><circle cx="4" cy="20" r="2.6"/></svg>',
  onbekend: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#fff" stroke-width="2"/><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Arial">?</text></svg>'
};
const FASE_NAAM = { vast: "Vast", vloeibaar: "Vloeibaar", gas: "Gas", onbekend: "Onbekend" };

function toonElement(z, b) {
  zetActief(b);
  const [sym, naam, massa, fase, voorkomen, toepassing, opm] = E[z - 1];
  const soort = soortVan(z), s = SOORTEN[soort], pos = plek(z);
  const waar = pos.groep ? `Groep ${pos.groep} · periode ${pos.periode}` : `Periode ${pos.periode} · ${s.naam.toLowerCase()}`;
  const soortLabel = s.eigen ? `${BASIS_NAAM[s.basis]} · ${s.enkel.toLowerCase()}` : s.enkel;
  infoBinnen.innerHTML = `
    <div class="info-kop">
      <div class="mini" style="--bg:${achtergrond(soort)}"><b>${sym}</b><small>${z}</small></div>
      <div>
        <h2>${naam}</h2>
        <div class="labels">
          <span class="label" style="--bg:${achtergrond(soort)}"><span class="stip"></span>${soortLabel}</span>
          <span class="label">${waar}</span>
          <span class="label">Atoommassa ${massa} u</span>
        </div>
      </div>
      <div class="fase" title="Fase bij kamertemperatuur (20 °C)">${FASE_ICOON[fase]}
        <div><b>${FASE_NAAM[fase]}</b><span>bij kamertemperatuur</span></div>
      </div>
    </div>
    <div class="kolommen">
      <section><h3>Voorkomen en winning</h3><p>${voorkomen}</p></section>
      <section><h3>Toepassing</h3><p>${toepassing}</p></section>
    </div>
    ${opm ? `<p class="opm"><b>Fase:</b> ${opm}</p>` : ""}`;
}

const GAT_TEKST = {
  lanthanide: {
    titel: "Lanthaniden (57 t/m 71)",
    a: ["Waarom staan ze onderaan?", "De lanthaniden horen eigenlijk op deze plek in periode 6. Als je ze ertussen zet, wordt het periodiek systeem heel breed. Daarom staan ze in een losse rij onderaan."],
    b: ["Wat zijn het?", "Metalen die scheikundig sterk op elkaar lijken en samen in dezelfde ertsen voorkomen, vooral in China. Ze heten ook wel zeldzame aardmetalen. Je vindt ze in magneten, leds en accu's."]
  },
  actinide: {
    titel: "Actinoïden (89 t/m 103)",
    a: ["Waarom staan ze onderaan?", "De actinoïden horen eigenlijk op deze plek in periode 7. Net als de lanthaniden staan ze in een losse rij onderaan, zodat het periodiek systeem niet te breed wordt."],
    b: ["Wat zijn het?", "Metalen die allemaal radioactief zijn. Alleen thorium en uraan komen veel in de natuur voor. De meeste andere worden in kernreactoren of deeltjesversnellers gemaakt."]
  }
};
function toonGat(soort, b) {
  zetActief(b);
  const t = GAT_TEKST[soort];
  infoBinnen.innerHTML = `
    <div class="info-kop">
      <div class="mini" style="--bg:${achtergrond(soort)}"><b style="font-size:.95em">${soort === "lanthanide" ? "57–71" : "89–103"}</b></div>
      <div><h2>${t.titel}</h2>
        <div class="labels"><span class="label" style="--bg:${achtergrond(soort)}"><span class="stip"></span>Metaal · ${SOORTEN[soort].enkel.toLowerCase()}</span></div>
      </div>
    </div>
    <div class="kolommen">
      <section><h3>${t.a[0]}</h3><p>${t.a[1]}</p></section>
      <section><h3>${t.b[0]}</h3><p>${t.b[1]}</p></section>
    </div>`;
}

function toonStart() {
  infoBinnen.innerHTML = `
    <div class="info-kop"><div><h2>Het periodiek systeem</h2></div></div>
    <div class="kolommen">
      <section><h3>Zo werkt het</h3><p>Beweeg met de muis over een element, of tik erop. Hier verschijnt dan de fase bij kamertemperatuur, waar het element voorkomt en waarvoor het wordt gebruikt.</p></section>
      <section><h3>Legenda</h3><p>Beweeg over een soort in de legenda (of tik erop) om die groep op te lichten. Met de kopjes Metalen en Niet-metalen licht je ze allemaal tegelijk op.</p></section>
    </div>`;
}
toonStart();

/* ---------- legenda: groepen oplichten ---------- */
/* [titel, filter voor de hele groep (of null), kleur van het kopje, soorten, vak in de legenda] */
const LEGENDA = [
  ["Metalen", "metaal", "var(--metaal)", ["alkali", "aardalkali", "transitie", "posttransitie", "lanthanide", "actinide"], "m"],
  ["Niet-metalen", "nietmetaal-alle", "var(--nietmetaal)", ["nietmetaal", "halogeen", "edelgas"], "n"],
  ["Metalloïden", "metalloide", "var(--metalloide)", [], "x"]
];
const legenda = document.getElementById("legenda");
let vastFilter = null;

function past(soort, filter) {
  if (filter === "metaal") return SOORTEN[soort].basis === "metaal";
  if (filter === "nietmetaal-alle") return SOORTEN[soort].basis === "nietmetaal";
  if (filter === "metalloide") return SOORTEN[soort].basis === "metalloide";
  if (filter === "halogeen") return SOORTEN[soort].eigen === "halogeen";
  return soort === filter;
}
function licht(filter) {
  const f = filter || vastFilter;
  rooster.classList.toggle("filter", !!f);
  rooster.querySelectorAll(".el").forEach(el => el.classList.toggle("aan", !!f && past(el.dataset.soort, f)));
}

function legKnop(ouder, cls, html, sleutel) {
  const b = maak("button", cls, ouder, html);
  b.type = "button";
  b.setAttribute("aria-pressed", "false");
  b.addEventListener("mouseenter", () => licht(sleutel));
  b.addEventListener("focus", () => licht(sleutel));
  b.addEventListener("mouseleave", () => licht(null));
  b.addEventListener("blur", () => licht(null));
  b.addEventListener("click", () => {
    const aan = vastFilter !== sleutel;
    vastFilter = aan ? sleutel : null;
    legenda.querySelectorAll("button").forEach(l => { l.classList.remove("vast"); l.setAttribute("aria-pressed", "false"); });
    if (aan) { b.classList.add("vast"); b.setAttribute("aria-pressed", "true"); }
    licht(aan ? sleutel : null);
  });
}

LEGENDA.forEach(([titel, sleutel, kleur, soorten, vak]) => {
  const groep = maak("div", "legenda-groep", legenda);
  groep.dataset.vak = vak;
  legKnop(groep, "leg-titel", `<span class="vlak" style="--bg:${kleur}"></span>${titel}`, sleutel);
  if (!soorten.length) return;
  const items = maak("div", "items", groep);
  soorten.forEach(soort => legKnop(items, "leg", `<span class="vlak" style="--bg:${achtergrond(soort)}"></span>${SOORTEN[soort].naam}`, soort));
});
</script>
</body>
</html>
