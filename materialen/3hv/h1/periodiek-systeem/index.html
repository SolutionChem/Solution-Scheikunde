<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactief periodiek systeem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #11264a; --navy2: #163a63; --navy3: #2c5687;
    --licht: #eef4fb; --licht2: #dbe8f5; --rand: #c9d8ea;
    --tekst: #14213a; --zacht: #4a5a72;
    /* hoofdsoorten (zoals in het boek) */
    --metaal: #f8e39b; --nietmetaal: #f0948a; --metalloide: #5aaee0;
    /* groepen */
    --alkali: #f4a261; --aardalkali: #9fd07a; --transitie: #cfa0dd; --posttransitie: #86cfc8;
    --lanthanide: #f59cc3; --actinide: #c9a27c; --halogeen: #dde86a; --edelgas: #a6b0e6;
    --kop: "Oswald", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: Inter, "Helvetica Neue", Arial, sans-serif; color: var(--tekst);
    background: var(--licht); line-height: 1.45; font-size: 15px;
    -webkit-font-smoothing: antialiased; padding: 14px;
  }
  button { font: inherit; cursor: pointer; color: inherit; }

  /* ---------- periodiek systeem ---------- */
  .ps { container: ps / inline-size; background: #fff; border-radius: 10px;
        box-shadow: 0 1px 3px rgba(0,0,0,.1); padding: 10px 12px 14px; }
  .rooster {
    display: grid; grid-template-columns: .55fr repeat(18, minmax(0, 1fr));
    gap: .22cqw;
  }
  .gnr, .pnr { font-family: var(--kop); font-weight: 600; color: var(--navy); text-align: center; }
  .gnr { font-size: 1.35cqw; align-self: end; padding-bottom: .3cqw; }
  .pnr { font-size: 1.5cqw; display: flex; align-items: center; justify-content: center; }
  .tussen { grid-column: 1 / -1; height: 1.3cqw; }

  .el {
    position: relative; aspect-ratio: 1; min-width: 0; margin: 0;
    border: 1px solid #1d2433; border-radius: .25cqw; padding: .2cqw .32cqw .15cqw;
    background: var(--bg); color: #111; text-align: left; line-height: 1.05;
    display: grid; grid-template-rows: auto 1fr auto auto; overflow: hidden;
    transition: transform .12s, box-shadow .12s, opacity .2s;
  }
  .el .m, .el .z { font-size: .8cqw; font-variant-numeric: tabular-nums; }
  .el .s { font-size: 2.05cqw; font-weight: 700; text-align: center; align-self: center; }
  .el .n { font-size: .6cqw; text-align: center; white-space: nowrap; overflow: hidden; letter-spacing: -.01em; }
  .el:hover, .el:focus-visible { transform: scale(1.12); z-index: 2; box-shadow: 0 3px 10px rgba(0,0,0,.3); outline: none; }
  .el.actief { z-index: 3; outline: 3px solid var(--navy); outline-offset: 1px; }
  .el.gat { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .2cqw; }
  .el.gat .s { font-size: .95cqw; }
  .el.gat .n { font-size: .6cqw; }
  .rooster.filter .el:not(.aan) { opacity: .18; }

  /* ---------- informatieblok (in het lege vak, overlapt niets) ---------- */
  .info { grid-column: 4 / 14; grid-row: 2 / 5; position: relative; margin: 0 .7cqw 1.2cqw; }
  .info-binnen {
    position: absolute; inset: 0; overflow: auto; background: var(--licht);
    border: 1px solid var(--rand); border-radius: 8px; padding: .65cqw .95cqw;
    font-size: clamp(10px, 1.04cqw, 14px); line-height: 1.33;
  }
  .info-kop { display: flex; align-items: center; gap: .8em; margin-bottom: .4em; flex-wrap: wrap; }
  .mini { width: 3.1em; height: 3.1em; flex: 0 0 auto; border: 1px solid #1d2433; border-radius: 3px; background: var(--bg);
          display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; color: #111; }
  .mini b { font-size: 1.4em; }
  .mini small { font-size: .75em; margin-top: .15em; }
  .info h2 { margin: 0; font-family: var(--kop); font-weight: 600; font-size: 1.45em; color: var(--navy); letter-spacing: .02em; line-height: 1.1; }
  .labels { display: flex; flex-wrap: wrap; gap: .3em; margin-top: .2em; }
  .label { font-size: .85em; padding: .12em .55em; border-radius: 99px; background: #fff; border: 1px solid var(--rand); white-space: nowrap; }
  .label .stip { display: inline-block; width: .75em; height: .75em; border-radius: 2px; margin-right: .35em; vertical-align: -.05em; border: 1px solid rgba(0,0,0,.4); background: var(--bg); }
  .fase { margin-left: auto; display: flex; align-items: center; gap: .45em; background: var(--navy2); color: #fff;
          border-radius: 8px; padding: .3em .7em; font-size: .9em; }
  .fase svg { width: 1.5em; height: 1.5em; flex: 0 0 auto; }
  .fase b { display: block; font-family: var(--kop); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 1.05em; }
  .fase span { display: block; font-size: .82em; opacity: .85; }
  .kolommen { display: grid; grid-template-columns: 1fr 1fr; gap: .4em 1.2em; }
  .kolommen h3 { margin: 0 0 .15em; font-family: var(--kop); font-weight: 500; font-size: .85em; letter-spacing: .1em;
                 text-transform: uppercase; color: var(--navy3); }
  .kolommen p { margin: 0; }
  .opm { margin: .35em 0 0; font-size: .9em; color: var(--zacht); }

  @container ps (max-width: 960px) {
    .info { grid-column: 1 / -1; grid-row: 12; margin: 12px 0 0; }
    .info-binnen { position: static; font-size: 14px; padding: 12px 14px; }
  }
  @container ps (max-width: 900px) {
    .el .n, .el.gat .n { display: none; }
    .el .s { font-size: 2.3cqw; }
    .el .m, .el .z { font-size: .95cqw; }
  }
  @container ps (max-width: 560px) {
    .el { display: flex; align-items: center; justify-content: center; padding: 0; border-radius: 2px; }
    .el .m, .el .z { display: none; }
    .el .s { font-size: 2.75cqw; }
    .el.gat .s { font-size: 1.6cqw; }
    .gnr { font-size: 2.1cqw; }
    .pnr { font-size: 2.4cqw; }
  }
  @media (max-width: 560px) {
    body { padding: 8px; }
    .ps { padding: 8px 6px 10px; }
    .kolommen { grid-template-columns: 1fr; }
    .fase { margin-left: 0; }
  }

  /* ---------- legenda ---------- */
  .legenda { display: flex; flex-wrap: wrap; gap: 10px 26px; margin-top: 14px; }
  .legenda-groep h3 { margin: 0 0 6px; font-family: var(--kop); font-weight: 500; font-size: .8rem; letter-spacing: .12em;
                      text-transform: uppercase; color: var(--zacht); }
  .legenda-groep div { display: flex; flex-wrap: wrap; gap: 6px; }
  .leg { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 5px; border-radius: 8px;
         border: 1px solid var(--rand); background: #fff; font-size: .88rem; }
  .leg:hover, .leg:focus-visible { border-color: var(--navy3); }
  .leg.hoofd { font-weight: 600; }
  .leg.vast { background: var(--navy2); color: #fff; border-color: var(--navy2); }
  .vlak { width: 20px; height: 20px; border: 1px solid #1d2433; border-radius: 2px; background: var(--bg); flex: 0 0 auto; }
  .hint { font-size: .85rem; color: var(--zacht); margin: 10px 0 0; }

  @media (prefers-reduced-motion: reduce) {
    .el { transition: none; }
    .el:hover, .el:focus-visible { transform: none; }
  }
</style>
</head>
<body>
<div class="ps">
  <div class="rooster" id="rooster">
    <div class="info" id="info" aria-live="polite"><div class="info-binnen" id="info-binnen"></div></div>
  </div>
  <div class="legenda" id="legenda"></div>
  <p class="hint">Beweeg over een kleur in de legenda (of tik erop) om die groep op te lichten.</p>
</div>

<script>
/* ---------- soorten elementen ----------
   basis = de kleur uit het boek (metaal, niet-metaal, metalloïde);
   eigen = de kleur van de groep (andere helft van het vakje). */
const SOORTEN = {
  alkali:        { naam: "Alkalimetalen",         enkel: "Alkalimetaal",         basis: "metaal",     eigen: "alkali" },
  aardalkali:    { naam: "Aardalkalimetalen",     enkel: "Aardalkalimetaal",     basis: "metaal",     eigen: "aardalkali" },
  transitie:     { naam: "Transitiemetalen",      enkel: "Transitiemetaal",      basis: "metaal",     eigen: "transitie" },
  posttransitie: { naam: "Post-transitiemetalen", enkel: "Post-transitiemetaal", basis: "metaal",     eigen: "posttransitie" },
  lanthanide:    { naam: "Lanthaniden",           enkel: "Lanthanide",           basis: "metaal",     eigen: "lanthanide" },
  actinide:      { naam: "Actinoïden",            enkel: "Actinoïde",            basis: "metaal",     eigen: "actinide" },
  nietmetaal:    { naam: "Overige niet-metalen",  enkel: "Niet-metaal",          basis: "nietmetaal", eigen: null },
  halogeen:      { naam: "Halogenen",             enkel: "Halogeen",             basis: "nietmetaal", eigen: "halogeen" },
  edelgas:       { naam: "Edelgassen",            enkel: "Edelgas",              basis: "nietmetaal", eigen: "edelgas" },
  metalloide:    { naam: "Metalloïden",           enkel: "Metalloïde",           basis: "metalloide", eigen: null }
};
const BASIS_NAAM = { metaal: "Metaal", nietmetaal: "Niet-metaal", metalloide: "Metalloïde" };

function soortVan(z) {
  if ([3, 11, 19, 37, 55, 87].includes(z)) return "alkali";
  if ([4, 12, 20, 38, 56, 88].includes(z)) return "aardalkali";
  if (z >= 57 && z <= 71) return "lanthanide";
  if (z >= 89 && z <= 103) return "actinide";
  if ([5, 14, 32, 33, 51, 52, 84, 85, 117].includes(z)) return "metalloide";
  if ([9, 17, 35, 53].includes(z)) return "halogeen";
  if ([2, 10, 18, 36, 54, 86, 118].includes(z)) return "edelgas";
  if ([1, 6, 7, 8, 15, 16, 34].includes(z)) return "nietmetaal";
  if ([13, 31, 49, 50, 81, 82, 83, 113, 114, 115, 116].includes(z)) return "posttransitie";
  return "transitie";
}
function achtergrond(soort) {
  const s = SOORTEN[soort];
  if (!s.eigen) return `var(--${s.basis})`;
  return `linear-gradient(135deg, var(--${s.basis}) 50%, var(--${s.eigen}) 50%)`;
}

/* ---------- gegevens per element ----------
   [symbool, naam, atoommassa (zoals in de Binas), fase bij 20 °C, voorkomen/winning, toepassing, opmerking bij de fase]
   fase: "vast", "vloeibaar", "gas" of "onbekend". */
const KUNSTMATIG = "Komt niet in de natuur voor. Er zijn maar een paar atomen van gemaakt, in een deeltjesversneller.";
const GEEN = "Geen: de atomen zijn radioactief en vallen snel uit elkaar. Alleen voor onderzoek.";
const ONBEKEND = "Er zijn nooit genoeg atomen tegelijk gemaakt om dat te weten.";
const zwaar = naar => [KUNSTMATIG + " Genoemd naar " + naar + ".", GEEN, ONBEKEND];

const E = [
  ["H","Waterstof","1,008","gas","Komt op aarde bijna niet als los element voor, maar zit gebonden in water en aardgas. Wordt vooral gemaakt uit aardgas, of door water te ontleden met elektriciteit. In het heelal het meest voorkomende element (sterren).","Grondstof voor kunstmest (via ammoniak). Ook brandstof voor waterstofauto's en -bussen."],
  ["He","Helium","4,003","gas","Ontstaat diep in de aarde bij radioactief verval en hoopt zich op in aardgasvelden. Wordt uit aardgas gewonnen. In de lucht zit bijna niets.","Vullen van ballonnen en luchtschepen (lichter dan lucht, brandt niet). Koelen van de magneten in MRI-scanners."],
  ["Li","Lithium","6,941","vast","Komt niet puur voor, want het reageert snel met water en lucht. Zit in gesteenten en in zoutmeren, bijvoorbeeld in Chili en Argentinië.","Oplaadbare batterijen (lithium-ionaccu's) in telefoons, laptops en elektrische auto's."],
  ["Be","Beryllium","9,012","vast","Komt niet puur voor. Zit in het mineraal beril; smaragd is een groene vorm van beril.","Licht en stijf metaal voor onderdelen van satellieten en ruimtetelescopen. Het stof is giftig."],
  ["B","Boor","10,81","vast","Komt niet puur voor. Zit in boraat-mineralen zoals borax, die je vindt in uitgedroogde zoutmeren (Turkije, VS).","Hittebestendig glas (borosilicaatglas), zoals ovenschalen en glaswerk in het lab."],
  ["C","Koolstof","12,01","vast","Komt puur voor als diamant en grafiet. Verder zit koolstof in steenkool, aardolie, aardgas, koolstofdioxide en in alle levende wezens.","Grafiet in potloden, diamant in sieraden en boren. IJzer met een beetje koolstof is staal."],
  ["N","Stikstof","14,01","gas","Komt puur voor: lucht bestaat voor 78% uit stikstof. Wordt gewonnen door lucht af te koelen tot het vloeibaar is en daarna te scheiden.","Grondstof voor kunstmest (via ammoniak). Vloeibare stikstof (−196 °C) om dingen snel te bevriezen. Vulgas in zakken chips."],
  ["O","Zuurstof","16,00","gas","Komt puur voor: lucht bestaat voor 21% uit zuurstof, gemaakt door planten (fotosynthese). Wordt gewonnen uit vloeibare lucht. Zit ook in water en in de meeste gesteenten.","Zuurstof voor patiënten in ziekenhuizen. Bij het maken van staal en bij lassen."],
  ["F","Fluor","19,00","gas","Komt nooit puur voor: het is het meest reactieve element. Zit in het mineraal vloeispaat (fluoriet).","Fluoride in tandpasta (tegen gaatjes). Teflon, de antiaanbaklaag in pannen."],
  ["Ne","Neon","20,18","gas","Komt puur voor in de lucht, maar maar heel weinig. Wordt gewonnen uit vloeibare lucht.","Neonreclame: neon geeft rood-oranje licht als er stroom door gaat."],
  ["Na","Natrium","22,99","vast","Komt niet puur voor, want het reageert heftig met water. Zit in keukenzout (natriumchloride) in zeewater en in zoutlagen in de bodem. Wordt gemaakt met elektrolyse van gesmolten zout.","Natriumlampen (oranje straatverlichting). Natriumverbindingen zoals keukenzout, soda en bakpoeder."],
  ["Mg","Magnesium","24,31","vast","Komt niet puur voor. Zit opgelost in zeewater en in gesteenten zoals dolomiet.","Lichte legeringen voor fietsen, auto-onderdelen en laptops. Fel wit licht in vuurwerk en sterretjes."],
  ["Al","Aluminium","26,98","vast","Komt niet puur voor. Het meest voorkomende metaal in de aardkorst. Wordt met elektrolyse gewonnen uit het erts bauxiet; dat kost veel elektriciteit.","Blikjes, aluminiumfolie, vliegtuigen, fietsen en raamkozijnen: licht en roest niet."],
  ["Si","Silicium","28,09","vast","Komt niet puur voor. Zit in zand (siliciumdioxide) en in bijna alle gesteenten: na zuurstof het meest voorkomende element in de aardkorst.","Computerchips en zonnepanelen. Van zand (siliciumdioxide) wordt glas gemaakt."],
  ["P","Fosfor","30,97","vast","Komt niet puur voor. Zit in fosfaaterts (Marokko, China) en ook in je botten, tanden en DNA.","Fosfaat in kunstmest. Rode fosfor in het strijkvlak van luciferdoosjes."],
  ["S","Zwavel","32,06","vast","Komt puur voor bij vulkanen. Zit ook in aardolie en aardgas; daar wordt het uitgehaald, zodat er bij verbranden minder zure regen ontstaat.","Grondstof voor zwavelzuur, de meest gemaakte chemische stof. Ook om rubber van autobanden sterk te maken."],
  ["Cl","Chloor","35,45","gas","Komt niet puur voor. Zit in keukenzout (natriumchloride) in zeewater. Wordt gemaakt met elektrolyse van zout water.","Desinfecteren van zwemwater en drinkwater. Grondstof voor de kunststof pvc (buizen)."],
  ["Ar","Argon","39,95","gas","Komt puur voor in de lucht (bijna 1%). Wordt gewonnen uit vloeibare lucht.","Beschermgas bij lassen. Vulgas tussen de ruiten van dubbel glas en in gloeilampen."],
  ["K","Kalium","39,10","vast","Komt niet puur voor, want het reageert heftig met water. Zit in kaliumzouten in de bodem (Canada, Rusland) en in planten.","Kaliumzouten in kunstmest. Kalium is nodig voor je zenuwen en spieren (zit veel in bananen)."],
  ["Ca","Calcium","40,08","vast","Komt niet puur voor. Zit in kalksteen, krijt, marmer en gips, en in schelpen, botten en tanden.","Calciumverbindingen in cement, kalk en schoolbordkrijt. Calcium in je voeding voor sterke botten."],
  ["Sc","Scandium","44,96","vast","Komt niet puur voor. Zit in kleine beetjes verspreid in veel mineralen en is daardoor moeilijk te winnen.","Lichte, sterke aluminium-scandiumlegeringen, bijvoorbeeld voor fietsframes. Felle lampen in stadions."],
  ["Ti","Titaan","47,87","vast","Komt niet puur voor. Zit in de mineralen rutiel en ilmeniet (titaanoxiden).","Sterk, licht en roest niet: kunstheupen, vliegtuigen en brillenmonturen. Titaandioxide is de witte kleurstof in verf en zonnebrand."],
  ["V","Vanadium","50,94","vast","Komt niet puur voor. Zit in ertsen, vooral in China, Rusland en Zuid-Afrika.","Maakt staal sterker, bijvoorbeeld voor gereedschap (chroom-vanadium op steeksleutels)."],
  ["Cr","Chroom","52,00","vast","Komt niet puur voor. Wordt gewonnen uit het erts chromiet.","Roestvrij staal (rvs). Glanzende chroomlaag op kranen en fietsonderdelen."],
  ["Mn","Mangaan","54,94","vast","Komt niet puur voor. Zit in ertsen zoals bruinsteen (mangaandioxide).","Maakt staal harder en sterker. Mangaandioxide zit in gewone batterijen."],
  ["Fe","IJzer","55,85","vast","Komt bijna niet puur voor (alleen in meteorieten). Wordt in een hoogoven gewonnen uit ijzererts, zoals bij Tata Steel in IJmuiden.","Staal voor gebouwen, bruggen, auto's en schepen. Het meest gebruikte metaal ter wereld."],
  ["Co","Kobalt","58,93","vast","Komt niet puur voor. Zit in ertsen samen met koper en nikkel, vooral in Congo.","Lithium-ionaccu's. Kobaltblauw: blauwe kleur in glas, verf en aardewerk."],
  ["Ni","Nikkel","58,69","vast","Komt niet puur voor (behalve in meteorieten). Wordt gewonnen uit ertsen, bijvoorbeeld in Indonesië en Canada.","Roestvrij staal en accu's. De munten van 1 en 2 euro bevatten nikkel."],
  ["Cu","Koper","63,55","vast","Komt soms puur voor als klompjes in gesteente. Meestal wordt het gewonnen uit kopererts (Chili, Peru).","Elektriciteitsdraden en waterleidingen: koper geleidt stroom en warmte heel goed."],
  ["Zn","Zink","65,38","vast","Komt niet puur voor. Wordt gewonnen uit het erts zinkblende.","Verzinken: een laagje zink beschermt staal tegen roest (dakgoten, vangrails). Messing is koper met zink."],
  ["Ga","Gallium","69,72","vast","Komt niet puur voor. Wordt gewonnen als bijproduct bij het maken van aluminium en zink.","Leds en chips (galliumnitride en galliumarsenide), bijvoorbeeld in snelladers.","Smelt al bij 30 °C: in je hand wordt het vloeibaar."],
  ["Ge","Germanium","72,64","vast","Komt niet puur voor. Wordt gewonnen als bijproduct bij het maken van zink en uit steenkoolas.","Glasvezelkabels voor internet. Lenzen voor warmtecamera's."],
  ["As","Arseen","74,92","vast","Komt soms puur voor, maar meestal in ertsen samen met koper, lood en goud. Wordt gewonnen als bijproduct.","Vroeger bekend als gif. Nu in chips (galliumarsenide) en in sommige soorten glas. Zeer giftig."],
  ["Se","Seleen","78,96","vast","Komt niet puur voor. Wordt gewonnen als bijproduct bij het maken van koper.","Kleurt glas rood, of maakt groenig glas juist kleurloos. Je lichaam heeft een heel klein beetje seleen nodig."],
  ["Br","Broom","79,90","vloeibaar","Komt niet puur voor. Zit als bromide in zeewater en in zoutmeren, zoals de Dode Zee.","Brandvertragers in kunststof (bijvoorbeeld in elektronica). Desinfecteren van bubbelbaden.","Eén van de twee elementen die vloeibaar zijn bij kamertemperatuur (de andere is kwik)."],
  ["Kr","Krypton","83,80","gas","Komt puur voor in de lucht, maar heel weinig. Wordt gewonnen uit vloeibare lucht.","Vulgas in dubbel glas (isoleert goed) en in sommige lampen en flitsers."],
  ["Rb","Rubidium","85,47","vast","Komt niet puur voor. Zit in kleine hoeveelheden in mineralen; wordt gewonnen als bijproduct van lithium.","Weinig toepassingen: vooral in atoomklokken en wetenschappelijk onderzoek."],
  ["Sr","Strontium","87,62","vast","Komt niet puur voor. Zit in de mineralen celestien en strontianiet.","Strontiumzouten geven de felrode kleur in vuurwerk en noodfakkels."],
  ["Y","Yttrium","88,91","vast","Komt niet puur voor. Zit samen met de lanthaniden in dezelfde mineralen. Genoemd naar het Zweedse dorp Ytterby.","Leds en lasers (YAG-laser), bijvoorbeeld bij ooglaseren en bij de tandarts."],
  ["Zr","Zirkonium","91,22","vast","Komt niet puur voor. Zit in het mineraal zirkoon, dat je in zand vindt.","Buizen om de splijtstof in kerncentrales. Zirkonia: nepdiamant en witte tandkronen."],
  ["Nb","Niobium","92,91","vast","Komt niet puur voor. Wordt gewonnen uit het erts pyrochloor, vooral in Brazilië.","Sterk staal voor pijpleidingen. Supergeleidende magneten in MRI-scanners."],
  ["Mo","Molybdeen","95,94","vast","Komt niet puur voor. Wordt gewonnen uit het erts molybdeniet.","Maakt staal heel sterk en hittebestendig, bijvoorbeeld voor boren en motoronderdelen."],

/* ---------- plek in het rooster ---------- */
function plek(z) {
  const starts = [1, 3, 11, 19, 37, 55, 87, 119];
  let p = 1; while (z >= starts[p]) p++;
  const i = z - starts[p - 1];
  let g;
  if (p === 1) g = z === 1 ? 1 : 18;
  else if (p <= 3) g = i < 2 ? i + 1 : i + 11;
  else if (p <= 5) g = i + 1;
  else if (i < 2) g = i + 1;
  else if (i < 17) return { periode: p, groep: null, rij: p === 6 ? 10 : 11, kol: i + 2 }; // lanthaniden/actinoïden
  else g = i - 13;
  return { periode: p, groep: g, rij: p + 1, kol: g + 1 };
}

function maak(tag, cls, ouder, html) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (html != null) el.innerHTML = html;
  (ouder || rooster).appendChild(el);
  return el;
}

function koppel(b, toon, aan, uit) {
  b.addEventListener("mouseenter", () => { toon(); if (aan) aan(); });
  b.addEventListener("focus", () => { toon(); if (aan) aan(); });
  b.addEventListener("click", () => { toon(); if (aan) aan(); });
  if (uit) { b.addEventListener("mouseleave", uit); b.addEventListener("blur", uit); }
}

function zetActief(b) {
  if (actiefKnop) actiefKnop.classList.remove("actief");
  actiefKnop = b; b.classList.add("actief");
}

  infoBinnen.innerHTML = `
    <div class="info-kop">
      <div class="mini" style="--bg:${achtergrond(soort)}"><b style="font-size:.95em">${soort === "lanthanide" ? "57–71" : "89–103"}</b></div>
      <div><h2>${t.titel}</h2>
        <div class="labels"><span class="label" style="--bg:${achtergrond(soort)}"><span class="stip"></span>Metaal · ${SOORTEN[soort].enkel.toLowerCase()}</span></div>
      </div>
    </div>
    <div class="kolommen">
      <section><h3>${t.a[0]}</h3><p>${t.a[1]}</p></section>
      <section><h3>${t.b[0]}</h3><p>${t.b[1]}</p></section>
    </div>`;
}

function toonStart() {
  infoBinnen.innerHTML = `
    <div class="info-kop"><div><h2>Het periodiek systeem</h2></div></div>
    <div class="kolommen">
      <section><h3>Zo werkt het</h3><p>Beweeg met de muis over een element, of tik erop. Hier verschijnt dan de fase bij kamertemperatuur, waar het element voorkomt en waarvoor het wordt gebruikt.</p></section>
      <section><h3>In elk vakje</h3><p>Linksboven de atoommassa, in het midden het symbool, daaronder het atoomnummer en de naam. De kleuren vind je in de legenda onder het periodiek systeem.</p></section>
    </div>`;
}
toonStart();

/* ---------- legenda: groepen oplichten ---------- */
const LEGENDA = [
  ["Metalen", [["metaal", "Metalen (alle)", true], "alkali", "aardalkali", "transitie", "posttransitie", "lanthanide", "actinide"]],
  ["Niet-metalen", [["nietmetaal-alle", "Niet-metalen (alle)", true], "nietmetaal", "halogeen", "edelgas"]],
  ["Metalloïden", ["metalloide"]]
];
const legenda = document.getElementById("legenda");
let vastFilter = null;

function past(soort, filter) {
  if (filter === "metaal") return SOORTEN[soort].basis === "metaal";
  if (filter === "nietmetaal-alle") return SOORTEN[soort].basis === "nietmetaal";
  return soort === filter;
}
function licht(filter) {
  const f = filter || vastFilter;
  rooster.classList.toggle("filter", !!f);
  rooster.querySelectorAll(".el").forEach(el => el.classList.toggle("aan", !!f && past(el.dataset.soort, f)));
}

LEGENDA.forEach(([titel, items]) => {
  const groep = maak("div", "legenda-groep", legenda, `<h3>${titel}</h3>`);
  const rij = maak("div", "", groep);
  items.forEach(item => {
    let sleutel, tekst, hoofd = false, bg;
    if (Array.isArray(item)) {
      [sleutel, tekst, hoofd] = item;
      bg = sleutel === "metaal" ? "var(--metaal)" : "var(--nietmetaal)";
    } else {
      sleutel = item; tekst = SOORTEN[item].naam; bg = achtergrond(item);
    }
    const b = maak("button", "leg" + (hoofd ? " hoofd" : ""), rij, `<span class="vlak" style="--bg:${bg}"></span>${tekst}`);
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("mouseenter", () => licht(sleutel));
    b.addEventListener("focus", () => licht(sleutel));
    b.addEventListener("mouseleave", () => licht(null));
    b.addEventListener("blur", () => licht(null));
    b.addEventListener("click", () => {
      const aan = vastFilter !== sleutel;
      vastFilter = aan ? sleutel : null;
      legenda.querySelectorAll(".leg").forEach(l => { l.classList.remove("vast"); l.setAttribute("aria-pressed", "false"); });
      if (aan) { b.classList.add("vast"); b.setAttribute("aria-pressed", "true"); }
      licht(aan ? sleutel : null);
    });
  });
});
</script>
</body>
</html>
