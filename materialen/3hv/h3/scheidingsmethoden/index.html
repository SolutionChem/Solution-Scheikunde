<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheidingsmethoden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #11264a; --navy2: #163a63; --navy3: #2c5687;
    --licht: #eef4fb; --licht2: #dbe8f5; --rand: #c9d8ea;
    --tekst: #14213a; --zacht: #4a5a72;
    --plus: #3fa55b; --min: #e0574a; --metaal: #f8e39b; --elektron: #e8890c;
    --kop: "Oswald", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Inter, "Helvetica Neue", Arial, sans-serif; color: var(--tekst); background: var(--licht);
         line-height: 1.45; font-size: 15px; -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; background: var(--navy); overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: 0 0 auto; border: 0; background: transparent; color: #cfdcef; padding: 9px 14px 10px; border-radius: 8px 8px 0 0;
                 font-family: var(--kop); letter-spacing: .08em; text-transform: uppercase; font-size: .9rem; }
  .tabs button:hover { color: #fff; background: rgba(255,255,255,.08); }
  .tabs button[aria-selected="true"] { background: var(--licht); color: var(--navy); }

  .delen { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 10px 12px 0; }
  .delen button { border: 1px solid var(--rand); background: #fff; border-radius: 99px; padding: 6px 14px; font-weight: 600; font-size: .9rem; color: var(--navy2); }
  .delen button[aria-pressed="true"] { background: var(--navy2); border-color: var(--navy2); color: #fff; }
  .delen .pauze { margin-left: auto; border-radius: 8px; }

  .scherm { padding: 10px 12px 12px; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
  .kaart { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(11,26,51,.1); padding: 12px 14px; min-width: 0; }
  .kaart h2 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--zacht); font-weight: 600; }
  .paneel { display: flex; flex-direction: column; gap: 10px; }
  .podium { padding: 6px; }
  #tek { width: 100%; height: clamp(300px, calc(100vh - 130px), 640px); display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }

  .knoppen { display: flex; gap: 6px; flex-wrap: wrap; }
  .knoppen + .knoppen { margin-top: 8px; }
  .knoppen button { flex: 1 1 auto; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--rand); background: #fff; font-weight: 600; font-size: .9rem; }
  .knoppen button.hoofd { background: var(--navy2); color: #fff; border-color: var(--navy2); }
  .knoppen button[aria-pressed="true"] { background: var(--navy2); color: #fff; border-color: var(--navy2); }
  .knoppen button:disabled { opacity: .45; cursor: default; }
  select { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--rand); background: #fff; }
  label.schuif { display: block; font-size: .9rem; margin-top: 4px; }
  label.schuif input { width: 100%; accent-color: var(--navy2); }
  label.optie { display: flex; gap: 8px; align-items: center; font-size: .9rem; margin-top: 8px; cursor: pointer; }
  label.optie input { width: 17px; height: 17px; accent-color: var(--navy2); }
  .stoflijst { display: grid; gap: 3px; }
  .stoflijst button { display: flex; justify-content: space-between; gap: 8px; text-align: left; padding: 2px 10px; border-radius: 7px;
                      border: 1px solid var(--rand); background: #fff; font-size: .88rem; }
  .stoflijst button span:last-child { font-weight: 700; color: var(--navy); white-space: nowrap; }
  .stoflijst button[aria-pressed="true"] { border-color: var(--navy2); box-shadow: inset 0 0 0 1px var(--navy2); background: var(--licht); }

  .schakelaar { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; cursor: pointer; font-weight: 600; font-size: .9rem; position: relative; }
  .schakelaar input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .schakelaar .baan { width: 42px; height: 24px; border-radius: 99px; background: #b8c4d4; position: relative; transition: background .15s; flex: 0 0 auto; }
  .schakelaar .baan::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .schakelaar input:checked + .baan { background: #c27c0e; }
  .schakelaar input:checked + .baan::after { left: 21px; }
  .schakelaar input:focus-visible + .baan { outline: 3px solid #9cc3f0; outline-offset: 2px; }
  .uitleg p { margin: 0 0 7px; font-size: .9rem; line-height: 1.4; }
  .uitleg p:last-child { margin-bottom: 0; }
  .uitleg p.nieuw { animation: in .6s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .uitleg b { color: var(--navy); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: -2px 0 10px; }
  .chips span { font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--licht2); color: var(--navy2); }
  .legenda { display: grid; gap: 5px; font-size: .86rem; margin-top: 8px; }
  .legenda div { display: flex; align-items: center; gap: 8px; }
  .legenda i { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; border: 1.5px solid rgba(0,0,0,.3); }
  .legenda i.lijn { border-radius: 0; height: 0; border: 0; border-top: 3px dashed; width: 20px; }

  svg text { font-family: Inter, Arial, sans-serif; }
  .ion-t { font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .lab { font-size: 17px; font-weight: 600; fill: var(--navy2); }
  .lab-z { font-size: 15px; fill: var(--zacht); }
  .groot { font-size: 26px; font-weight: 700; fill: var(--navy); }
  .delta { font-size: 19px; font-weight: 700; font-style: italic; text-anchor: middle; dominant-baseline: central; }

  /* vergelijken */
  .vergelijk { max-width: 1100px; margin: 0 auto; }
  .vergelijk .rij { display: grid; grid-template-columns: 190px repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
  .vergelijk .kop { font-family: var(--kop); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--navy2);
                    border-radius: 8px; padding: 8px 12px; font-size: .95rem; }
  .vergelijk .eig { background: var(--navy2); color: #fff; border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: .92rem; }
  .vergelijk .cel { background: #fff; border-radius: 8px; padding: 9px 12px; font-size: .88rem; box-shadow: 0 1px 2px rgba(11,26,51,.08); }
  .vergelijk .cel b { display: block; color: var(--navy); font-size: .95rem; margin-bottom: 2px; }
  .vergelijk .cel a { color: var(--navy3); font-weight: 600; font-size: .82rem; text-decoration: none; display: inline-block; margin-top: 3px; cursor: pointer; }
  .vergelijk .cel a:hover { text-decoration: underline; }
  .vergelijk .cel .cat { display: none; font-family: var(--kop); letter-spacing: .06em; text-transform: uppercase; font-size: .78rem; color: var(--zacht); }

  /* spel (zelfde opzet als de spellen van Bouw een atoom en Bouw een molecuul) */
  .spel { max-width: 860px; margin: 0 auto; }
  .spelbalk { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: #fff; border-radius: 10px; padding: 8px 14px; margin-bottom: 10px;
              box-shadow: 0 1px 3px rgba(11,26,51,.1); font-size: .92rem; }
  .spelbalk strong { color: var(--navy); }
  .voortgang { display: flex; gap: 5px; }
  .voortgang i { width: 22px; height: 6px; border-radius: 3px; background: var(--licht2); }
  .voortgang i.af { background: var(--navy3); }
  .voortgang i.nu { background: var(--navy); outline: 2px solid #9cc3f0; }
  .pogingslabel { font-size: .8rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--licht2); color: var(--navy2); }
  .pogingslabel.verd { background: #f6e7cc; color: #7a4d06; }
  .spelbalk .stop { margin-left: auto; border: 1px solid var(--rand); background: #fff; color: var(--zacht); border-radius: 8px; padding: 4px 12px; font-size: .85rem; }
  .start-spel { max-width: 640px; margin: 18px auto; padding: 22px 26px; }
  .start-spel h2 { font-family: var(--kop); font-size: 1.4rem; letter-spacing: .04em; color: var(--navy); text-transform: none; margin: 0 0 10px; }
  .start-spel ul { margin: 6px 0 14px; padding-left: 20px; }
  .start-spel .schakelaar { margin: 14px 0 18px; }
  .groot-knop { font-size: 1.05rem; font-weight: 600; padding: 10px 28px; border-radius: 8px; border: 0; background: var(--navy2); color: #fff; }
  .groot-knop.licht { background: #fff; color: var(--navy2); border: 1px solid var(--rand); }
  .vraagvak { padding: 16px 18px; }
  .opdracht { font-size: 1.08rem; font-weight: 600; color: var(--navy); margin: 0 0 12px; }
  .verd-label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: #f6e7cc; color: #7a4d06; padding: 2px 8px; border-radius: 99px; vertical-align: 2px; }
  .kaartplek { display: flex; justify-content: center; margin-bottom: 14px; min-height: 150px; }
  .stofkaart { width: min(100%, 420px); background: #fffdf5; border: 2px solid var(--navy3); border-radius: 12px; padding: 12px 16px; cursor: grab;
               touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 3px 8px rgba(11,26,51,.15); position: relative; z-index: 2; }
  .stofkaart.sleep { cursor: grabbing; box-shadow: 0 10px 24px rgba(11,26,51,.3); transition: none; opacity: .92; }
  .stofkaart:not(.sleep) { transition: transform .25s; }
  .stofkaart.weg { opacity: .55; cursor: default; }
  .stofkaart h3 { margin: 0 0 6px; font-family: var(--kop); letter-spacing: .06em; color: var(--navy); font-size: 1.15rem; }
  .stofkaart ul { margin: 0; padding-left: 18px; }
  .stofkaart li { margin: 3px 0; }
  .bakken { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .bak { border: 2px dashed var(--navy3); border-radius: 12px; padding: 16px 10px; text-align: center; background: var(--licht); cursor: pointer; transition: background .15s; }
  .bak .bak-titel { display: block; font-family: var(--kop); letter-spacing: .06em; text-transform: uppercase; color: var(--navy); font-size: 1.05rem; }
  .bak .bak-sub { display: block; font-size: .8rem; color: var(--zacht); }
  .bak.boven { background: var(--licht2); border-style: solid; }
  .bak.goed { background: #e9f7ef; border: 2px solid #1f8a4c; }
  .bak.fout { background: #fdecea; border: 2px solid #c0392b; }
  .bak.uit { cursor: default; opacity: .7; }
  .opties { display: grid; gap: 8px; margin-bottom: 12px; }
  .opties button { text-align: left; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--rand); background: #fff; font-size: .95rem; }
  .opties button:hover:not(:disabled) { border-color: var(--navy3); }
  .opties button.goed { background: #e9f7ef; border-color: #1f8a4c; font-weight: 600; }
  .opties button.fout { background: #fdecea; border-color: #c0392b; }
  .opties button:disabled { cursor: default; }
  .feedback { padding: 10px 12px; border-radius: 8px; font-size: .93rem; background: var(--licht); margin-bottom: 10px; }
  .feedback.goed { background: #e9f7ef; border-left: 5px solid #1f8a4c; }
  .feedback.fout { background: #fdecea; border-left: 5px solid #c0392b; }
  .feedback p { margin: 0 0 6px; } .feedback p:last-child { margin: 0; }
  .feedback ul { margin: 0; padding-left: 18px; }
  .resultaat { max-width: 720px; margin: 18px auto; padding: 24px 26px; text-align: center; }
  .resultaat h2 { font-family: var(--kop); font-size: 1.4rem; color: var(--navy); text-transform: none; letter-spacing: .04em; }
  .resultaat .totaal { font-size: 3rem; font-weight: 700; color: var(--navy); line-height: 1.1; margin: 8px 0 2px; }
  .resultaat .sterren { font-size: 1.8rem; letter-spacing: .15em; color: #e0a800; }
  .resultaat ol { list-style: none; padding: 0; margin: 18px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .resultaat li { border: 1px solid var(--rand); border-radius: 10px; padding: 8px 14px 6px; min-width: 112px; font-size: .88rem; }
  .resultaat li .f { font-family: var(--kop); font-size: 1.3rem; color: var(--navy); }
  .resultaat li .pnt { font-size: .85rem; font-weight: 600; }
  .resultaat li .pnt.vol { color: #1f8a4c; } .resultaat li .pnt.half { color: #b77b00; } .resultaat li .pnt.nul { color: #c0392b; }
  .resultaat .rij { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }


  /* scheidingsmethoden */
  .kopje { font-family: var(--kop); font-size: 15px; letter-spacing: .14em; fill: var(--zacht); text-anchor: middle; }
  .lab-k { font-size: 13px; fill: var(--zacht); }
  .lab-m { font-size: 14px; font-weight: 600; fill: var(--navy2); paint-order: stroke; stroke: #fbfdff; stroke-width: 4px; stroke-linejoin: round; }
  .voorbeeld { font-size: .9rem; margin: 0 0 8px; }
  .voorbeeld b { color: var(--navy); }
  .legenda .ico { width: 26px; height: 26px; flex: 0 0 auto; }

  /* overzicht */
  .vergelijk .rij { grid-template-columns: 150px 170px minmax(0, 1.4fr) minmax(0, 1.2fr); }
  .vergelijk .eig a { color: #fff; }

  /* spel: scheid het mengsel */
  .mengsel { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
  .mengsel .bekerico { flex: 0 0 auto; width: 92px; height: 92px; }
  .mengsel h3 { margin: 0 0 2px; font-family: var(--kop); letter-spacing: .05em; color: var(--navy); font-size: 1.15rem; }
  .mengsel p { margin: 2px 0; font-size: .92rem; }
  .mengsel .stap { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--zacht); }
  .mengsel .gegevens { font-size: .86rem; color: var(--zacht); }
  .mengsel .gegevens b { color: var(--navy2); }
  .mengsel .doel { background: var(--licht); border-radius: 8px; padding: 6px 10px; margin-top: 6px; }
  .methoden { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
  .methoden button { padding: 9px 6px; border-radius: 8px; border: 1px solid var(--rand); background: #fff; font-weight: 600; color: var(--navy2); }
  .methoden button:hover:not(:disabled) { border-color: var(--navy3); background: var(--licht); }
  .methoden button.goed { background: #e9f7ef; border-color: #1f8a4c; color: #145c33; }
  .methoden button.fout { background: #fdecea; border-color: #c0392b; color: #8e2a20; }
  .methoden button:disabled { cursor: default; }
  .methoden button:disabled:not(.goed):not(.fout) { opacity: .45; }
  .plaats-vraag { font-weight: 600; color: var(--navy); margin: 4px 0 8px; }
  .bakje { display: flex; flex-wrap: wrap; gap: 8px; min-height: 58px; padding: 8px; border-radius: 10px; background: var(--licht); margin-bottom: 10px; }
  .bakje:empty::after { content: "Alle deeltjes staan op een plek. Klik op Controleer."; color: var(--zacht); font-size: .88rem; align-self: center; }
  .zones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .zone { border: 2px dashed var(--navy3); border-radius: 12px; padding: 8px 10px 10px; background: #fff; min-height: 112px; transition: background .15s; }
  .zone.boven { background: var(--licht2); border-style: solid; }
  .zone .z-titel { display: block; font-family: var(--kop); letter-spacing: .05em; text-transform: uppercase; color: var(--navy); font-size: .98rem; }
  .zone .z-sub { display: block; font-size: .8rem; color: var(--zacht); margin-bottom: 6px; }
  .zone .z-in { display: flex; flex-wrap: wrap; gap: 6px; }
  .dkaart { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border-radius: 10px; border: 2px solid var(--navy3); background: #fffdf5;
            font-size: .88rem; font-weight: 600; color: var(--navy); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; position: relative; z-index: 2; }
  .dkaart svg { width: 34px; height: 34px; flex: 0 0 auto; }
  .dkaart.sleep { cursor: grabbing; box-shadow: 0 10px 24px rgba(11,26,51,.3); opacity: .92; z-index: 5; }
  .dkaart.gekozen { outline: 3px solid #9cc3f0; }
  .dkaart.goed { border-color: #1f8a4c; background: #e9f7ef; cursor: default; }
  .dkaart.fout { border-color: #c0392b; background: #fdecea; }
  .dkaart.klaar { cursor: default; }

  @media (max-width: 760px) {
    .app { display: flex; flex-direction: column; align-items: stretch; }
    .paneel { display: contents; }
    .kaart.bed { order: 1; }
    .podium { order: 2; }
    .kaart.uit { order: 3; }
    #tek { height: auto; aspect-ratio: 900 / 570; }
    .scherm { padding: 8px; }
    .vergelijk .rij { grid-template-columns: 1fr; }
    .vergelijk .rij.koprij { display: none; }
    .vergelijk .cel .cat { display: block; }
    .methoden { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .zones { grid-template-columns: 1fr; gap: 8px; }
    .zone { min-height: 84px; }
    .mengsel .bekerico { width: 64px; height: 64px; }
  }
</style>
</head>
<body>
<!-- kleurverlopen voor alle tekeningen (ook de icoontjes in het spel) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gO" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ff9a8c"/><stop offset="1" stop-color="#cf3a2e"/></radialGradient>
    <radialGradient id="gH" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3dae3"/></radialGradient>
    <radialGradient id="gC" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#7a828d"/><stop offset="1" stop-color="#262a30"/></radialGradient>
    <radialGradient id="gVlam" cx="50%" cy="80%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f6a623"/><stop offset="1" stop-color="#e0574a" stop-opacity=".2"/></radialGradient>
    <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c5687"/></marker>
  </defs>
</svg>
<nav class="tabs" role="tablist" aria-label="Onderdeel">
  <button role="tab" data-cat="methode" aria-selected="true">Scheidingsmethoden</button>
  <button role="tab" data-cat="overzicht" aria-selected="false">Overzicht</button>
  <button role="tab" data-cat="spel" aria-selected="false">Spel</button>
</nav>
<div class="delen" id="delen"></div>

<main class="scherm">
  <section class="app" id="app">
    <div class="kaart podium"><svg id="tek" viewBox="0 0 900 570" role="img"></svg></div>
    <div class="paneel">
      <div class="kaart bed">
        <h2 id="bed-titel">Scheidingsmethode</h2>
        <div id="bediening"></div>
      </div>
      <div class="kaart uit">
        <h2>Wat zie je?</h2>
        <div class="uitleg" id="uitleg" aria-live="polite"></div>
      </div>
    </div>
  </section>
  <section class="vergelijk" id="vergelijk" hidden></section>
  <section class="spel" id="spel" hidden></section>
</main>

<script>
"use strict";
/* =====================================================================
   Scheidingsmethoden (§3.4)
   Zeven scheidingsmethoden, elk met een voorbeeld op macroniveau (links)
   en een model op microniveau (rechts), een overzicht en een spel.
   URL: ?tab=methode|overzicht|spel  &deel=<id van de methode>
   ===================================================================== */
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const tek = $("tek");
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const tussen = (t, a, b) => ease((t - a) / (b - a));
const rnd = (a, b) => a + Math.random() * (b - a);
const mix = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function maak(tag, attrs, ouder, tekst) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (tekst != null) el.textContent = tekst;
  if (ouder) ouder.appendChild(el);
  return el;
}

/* ---------- deeltjes (modellen, niet op schaal) ---------- */
const AT = { O: ["url(#gO)", "#9b2a20"], H: ["url(#gH)", "#8a97a8"], C: ["url(#gC)", "#15181c"] };
const MOL = {
  water: [["H", -9.5, 7, 7], ["H", 9.5, 7, 7], ["O", 0, -2, 11]],
  ethanol: [["H", -24, -2, 6], ["H", -19, 13, 6], ["H", -13, -9, 6], ["H", -3, -15, 6], ["H", 9, -14, 6], ["H", 26, -3, 5.5],
            ["C", -14, 3, 9.5], ["C", 2, -4, 9.5], ["O", 17, 3, 9.5]]
};
const ZAND = [[-22, -6], [-14, -20], [4, -23], [19, -13], [23, 4], [13, 20], [-6, 22], [-20, 12]];
/* soort → tekening; r = straal voor botsingen */
const SOORT = {
  water:   { r: 11, ico: 18, teken(g) { molecuul(g, "water", 1); } },
  ethanol: { r: 17, ico: 26, teken(g) { molecuul(g, "ethanol", .8); } },
  plus:    { r: 11, teken(g) { ionTeken(g, 11, "#3fa55b", "#23733a", "Na⁺"); } },
  min:     { r: 15, teken(g) { ionTeken(g, 15, "#e0574a", "#9b2a20", "Cl⁻"); } },
  zand:    { r: 22, teken(g) {
    maak("path", { d: "M" + ZAND.map(([x, y]) => `${x},${y}`).join("L") + "Z", fill: "#d2ab72", stroke: "#8a6a3c", "stroke-width": 2, "stroke-linejoin": "round" }, g);
    for (const [x, y] of [[-8, -6], [6, 4], [-3, 10], [10, -10]]) maak("circle", { cx: x, cy: y, r: 2.2, fill: "#a07b45" }, g);
  } },
  kleur:   { r: 14, teken(g) { tros(g, "#8e44ad", "#5b2370"); } },
  smaak:   { r: 14, teken(g) { tros(g, "#b8661e", "#6e3a0c"); } },
  cel:     { r: 23, teken(g) {
    maak("ellipse", { rx: 25, ry: 15, fill: "#c0392b", stroke: "#7d1f16", "stroke-width": 2 }, g);
    maak("ellipse", { rx: 13, ry: 6, fill: "#e06b5c" }, g);
  } },
  vet:     { r: 20, teken(g) {
    maak("circle", { r: 20, fill: "#fbe9a6", stroke: "#c9a640", "stroke-width": 2 }, g);
    maak("circle", { cx: -6, cy: -7, r: 5, fill: "#fff", opacity: .8 }, g);
  } },
  klei:    { r: 13, teken(g) { maak("path", { d: "M-12,-4 L-5,-12 L8,-10 L13,1 L6,11 L-8,10 Z", fill: "#a89a86", stroke: "#6b5f4e", "stroke-width": 1.5 }, g); } },
  gist:    { r: 17, teken(g) { maak("ellipse", { rx: 17, ry: 13, fill: "#f1dfa8", stroke: "#a88d2c", "stroke-width": 2 }, g);
                               maak("circle", { cx: 4, cy: -2, r: 4, fill: "#c9a640" }, g); } },
  suiker:  { r: 15, teken(g) { for (const [x, y] of [[-6, 0], [7, 0]]) maak("path", { d: `M${x - 7},${y} L${x - 3.5},${y - 6} L${x + 3.5},${y - 6} L${x + 7},${y} L${x + 3.5},${y + 6} L${x - 3.5},${y + 6} Z`, fill: "#fbf7ec", stroke: "#8a7f66", "stroke-width": 1.6 }, g); } },
  vezel:   { r: 15, teken(g) { maak("circle", { r: 15, fill: "#ece6d6", stroke: "#b4aa90", "stroke-width": 2 }, g); } },
  kool:    { r: 12, teken(g) { maak("circle", { r: 12, fill: "#3c4248", stroke: "#1b1e22", "stroke-width": 1.5 }, g); } },
  blad:    { r: 19, teken(g) { maak("rect", { x: -18, y: -18, width: 36, height: 36, rx: 7, fill: "#5f9440", stroke: "#3c6626", "stroke-width": 2 }, g);
                               maak("circle", { r: 6, fill: "#3c6626", opacity: .55 }, g); } },
  koffiedik: { r: 19, teken(g) { maak("path", { d: "M-18,-8 L-8,-19 L12,-16 L19,2 L9,18 L-12,16 Z", fill: "#6b4423", stroke: "#3b2410", "stroke-width": 2 }, g); } },
  zout:    { r: 18, ico: 22, teken(g) {          // icoon: één Na⁺ en één Cl⁻ samen
    const a = maak("g", { transform: "translate(-9 4)" }, g); ionTeken(a, 9, "#3fa55b", "#23733a", "+");
    const b = maak("g", { transform: "translate(9 -4)" }, g); ionTeken(b, 11, "#e0574a", "#9b2a20", "−");
  } }
};
function molecuul(g, soort, s) {
  const b = maak("g", { transform: `scale(${s})` }, g);
  for (const [el, x, y, r] of MOL[soort]) maak("circle", { cx: x, cy: y, r, fill: AT[el][0], stroke: AT[el][1], "stroke-width": 1 }, b);
}
function ionTeken(g, r, vul, rand, label) {
  maak("circle", { r, fill: vul, stroke: rand, "stroke-width": 2 }, g);
  maak("text", { "text-anchor": "middle", "dominant-baseline": "central", fill: "#fff", "font-weight": 700, "font-size": Math.max(9, r * .78) }, g, label);
}
function tros(g, vul, rand) {                    // een groot molecuul (kleurstof, smaakstof)
  for (const [x, y, r] of [[-7, -5, 7], [6, -7, 6.5], [8, 6, 7], [-5, 8, 6.5], [0, 0, 6]])
    maak("circle", { cx: x, cy: y, r, fill: vul, stroke: rand, "stroke-width": 1.2 }, g);
}
function deeltje(ouder, soort, x = 0, y = 0) {
  const g = maak("g", {}, ouder);
  SOORT[soort].teken(g);
  const p = { g, soort, r: SOORT[soort].r, x, y, vx: 0, vy: 0, zw: 0, hoek: rnd(-3, 3), vh: rnd(-.6, .6) };
  zet(p); return p;
}
function zet(p) { p.g.setAttribute("transform", `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${(p.hoek * 57.3).toFixed(0)})`); }
function weg(D, p) { p.g.remove(); const i = D.indexOf(p); if (i >= 0) D.splice(i, 1); }
/* klein svg-icoon (legenda, spel) */
function icoon(soort, cls = "ico") {
  const r = SOORT[soort].ico || SOORT[soort].r + 3;
  return `<svg class="${cls}" viewBox="${-r} ${-r} ${2 * r} ${2 * r}" aria-hidden="true">${(() => {
    const g = document.createElementNS(NS, "g"); SOORT[soort].teken(g); return g.innerHTML; })()}</svg>`;
}

/* ---------- beweging op microniveau ----------
   D: bewegende deeltjes, S: vaste deeltjes (filtervezels, kool, blad).
   p.zw = zwaartekracht, p.vast = zit vast, p.uit = vliegt weg als gas (botst niet). */
const ZWAAR = { zand: 1, cel: 1, vet: 1 };          // korrels en cellen ruilen niet van plek met moleculen
function fysica(D, S, vak, dt, o = {}) {
  if (dt <= 0) return;
  const K = o.ruis ?? 2200, demp = Math.exp(-4 * dt);
  const ruil = (a, b, duur) => {
    const kant = Math.random() < .5 ? 1 : -1;
    a.wissel = { x0: a.x, y0: a.y, x1: b.x, y1: b.y, t: 0, kant, r: a.r + b.r, duur };
    b.wissel = { x0: b.x, y0: b.y, x1: a.x, y1: a.y, t: 0, kant, r: a.r + b.r, duur };
  };
  const los = p => !p.vast && !p.uit && !p.wissel && !p.spook;
  if (o.wissel) {                                   // in een vloeistof schuiven buren langs elkaar heen
    D.wacht = (D.wacht || 0) - dt;
    while (D.wacht <= 0) {
      D.wacht += 1 / o.wissel;
      const vrij = D.filter(p => los(p) && !ZWAAR[p.soort]);
      // opgeloste deeltjes (o.meng) mengen zich vaker: ze verspreiden zich tussen de moleculen (diffusie)
      const meng = o.meng ? vrij.filter(p => p.soort === o.meng) : [];
      const a = meng.length && Math.random() < .6 ? meng[Math.floor(Math.random() * meng.length)] : vrij[Math.floor(Math.random() * vrij.length)];
      const buren = a ? vrij.filter(b => b !== a && (b.x - a.x) ** 2 + (b.y - a.y) ** 2 < ((a.r + b.r) * 1.4) ** 2) : [];
      if (buren.length) ruil(a, buren[Math.floor(Math.random() * buren.length)], .9);
    }
  }
  // zware korrels en cellen zakken: de vloeistof eronder stroomt erlangs omhoog (ruilen met een molecuul eronder)
  if (o.zakken) for (const p of D) {
    if (!ZWAAR[p.soort] || p.zw < 100 || !los(p)) continue;
    p.zt = (p.zt ?? rnd(0, .3)) - dt;
    if (p.zt > 0) continue;
    p.zt = 55 / p.zw * rnd(.7, 1.3);
    let best = null, bs = .35;
    for (const b of D) {
      if (ZWAAR[b.soort] || !los(b)) continue;
      const dx = b.x - p.x, dy = b.y - p.y; if (dy <= 0) continue;
      const d = Math.hypot(dx, dy); if (d > (p.r + b.r) * 1.35) continue;
      if (dy / d > bs) { bs = dy / d; best = b; }
    }
    if (best) ruil(p, best, .35);
  }
  for (const p of D) {
    p.hoek += p.vh * dt;
    if (p.wissel) {
      const w = p.wissel; w.t += dt;
      const f = Math.min(1, w.t / (w.duur || .9)), e = ease(f), dx = w.x1 - w.x0, dy = w.y1 - w.y0, l = Math.hypot(dx, dy) || 1;
      const boog = Math.sin(Math.PI * f) * w.r * .5 * w.kant;
      p.x = w.x0 + dx * e - dy / l * boog; p.y = w.y0 + dy * e + dx / l * boog; p.vx = p.vy = 0;
      if (f >= 1) p.wissel = null;
      continue;
    }
    if (p.vast) continue;
    if (p.uit) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx += (Math.random() - .5) * 300 * dt; continue; }
    p.vx += ((Math.random() - .5) * 2 * K + (p.ax || 0)) * dt;
    p.vy += ((Math.random() - .5) * 2 * K + p.zw + (p.ay || 0)) * dt;
    p.vx *= demp; p.vy *= demp;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let it = 0; it < 2; it++) {
    for (let i = 0; i < D.length; i++) {
      const a = D[i]; if (a.uit) continue;
      const av = a.vast || !!a.wissel;
      for (let j = i + 1; j < D.length; j++) {
        const b = D[j]; if (b.uit) continue;
        const bv = b.vast || !!b.wissel;
        if (av && bv) continue;
        const dmin = (a.r + b.r) * 1.04;
        const dx = b.x - a.x, dy = b.y - a.y;
        if (Math.abs(dx) > dmin || Math.abs(dy) > dmin) continue;
        const d2 = dx * dx + dy * dy; if (d2 >= dmin * dmin) continue;
        const d = Math.sqrt(d2) || .01, nx = dx / d, ny = dy / d, ov = dmin - d;
        const wa = av ? 0 : (a.zw > b.zw + 50 ? .3 : 1), wb = bv ? 0 : (b.zw > a.zw + 50 ? .3 : 1), s = wa + wb || 1;
        a.x -= nx * ov * wa / s; a.y -= ny * ov * wa / s; b.x += nx * ov * wb / s; b.y += ny * ov * wb / s;
      }
    }
    for (const p of D) {
      if (p.vast || p.uit || p.wissel || p.spook) continue;
      for (const s of S) {
        const dmin = p.r + s.r, dx = p.x - s.x, dy = p.y - s.y;
        if (Math.abs(dx) > dmin || Math.abs(dy) > dmin) continue;
        const d2 = dx * dx + dy * dy; if (d2 >= dmin * dmin) continue;
        const d = Math.sqrt(d2) || .01;
        p.x = s.x + dx / d * dmin; p.y = s.y + dy / d * dmin;
        const vn = (p.vx * dx + p.vy * dy) / d; if (vn < 0) { p.vx -= vn * dx / d; p.vy -= vn * dy / d; }
      }
    }
    for (const p of D) {
      if (p.vast || p.uit || p.wissel) continue;
      const v = p.vak || vak;
      if (p.x < v.x0 + p.r) { p.x = v.x0 + p.r; p.vx = Math.abs(p.vx) * .3; }
      if (p.x > v.x1 - p.r) { p.x = v.x1 - p.r; p.vx = -Math.abs(p.vx) * .3; }
      if (!o.rond) {
        if (p.y < v.y0 + p.r) { p.y = v.y0 + p.r; p.vy = Math.abs(p.vy) * .3; }
        if (p.y > v.y1 - p.r) { p.y = v.y1 - p.r; p.vy = -Math.abs(p.vy) * .3; }
      }
    }
  }
}
/* vul een gebied met deeltjes in een rooster (dicht op elkaar, zoals in een vloeistof) */
function vul(ouder, D, gebied, afst, kies) {
  let rij = 0;
  for (let y = gebied.y1 - afst / 2; y > gebied.y0 + afst / 2 - 1; y -= afst * .88, rij++) {
    for (let x = gebied.x0 + afst / 2 + (rij % 2) * afst / 2; x < gebied.x1 - afst / 2 + 1; x += afst) {
      const soort = kies(x, y); if (!soort) continue;
      const p = deeltje(ouder, soort, x + rnd(-2, 2), y + rnd(-2, 2));
      D.push(p);
    }
  }
}

/* ---------- tekening: macro links, micro rechts ---------- */
const MK = { x0: 470, y0: 50, x1: 880, y1: 530 };      // micro-kader
function nieuweTekening() { tek.innerHTML = ""; return maak("g", {}, tek); }
function kader(spot, kleur = "#fbfdff", K = MK, n = 0) {   // K = vlak op microniveau (er kunnen er meer zijn)
  if (!n) {
    maak("text", { x: 225, y: 34, class: "kopje" }, tek, "MACRONIVEAU");
    maak("text", { x: 675, y: 34, class: "kopje" }, tek, "MICRONIVEAU");
    maak("text", { x: 675, y: 556, class: "lab-k", "text-anchor": "middle" }, tek, "een model: zo stel je je de deeltjes voor (niet op schaal)");
  }
  const s = spot.r;
  maak("path", { d: `M${spot.x + s},${spot.y - s} L${K.x0},${K.y0} M${spot.x + s},${spot.y + s} L${K.x0},${K.y1}`, stroke: "#2c5687", "stroke-width": 1.5, "stroke-dasharray": "5 5", fill: "none", opacity: .7 }, tek);
  maak("rect", { x: spot.x - s, y: spot.y - s, width: 2 * s, height: 2 * s, rx: 4, fill: "none", stroke: "#2c5687", "stroke-width": 2.5 }, tek);
  const cp = maak("clipPath", { id: "clipM" + n }, tek);
  maak("rect", { x: K.x0, y: K.y0, width: K.x1 - K.x0, height: K.y1 - K.y0, rx: 12 }, cp);
  maak("rect", { x: K.x0, y: K.y0, width: K.x1 - K.x0, height: K.y1 - K.y0, rx: 12, fill: kleur }, tek);
  const g = maak("g", { "clip-path": `url(#clipM${n})` }, tek);
  const boven = maak("g", {}, tek);
  maak("rect", { x: K.x0, y: K.y0, width: K.x1 - K.x0, height: K.y1 - K.y0, rx: 12, fill: "none", stroke: "#2c5687", "stroke-width": 3 }, boven);
  return { g, boven };
}
function label(ouder, x, y, tekst, anker = "start", cls = "lab-k") { return maak("text", { x, y, class: cls, "text-anchor": anker }, ouder, tekst); }
function lijntje(ouder, x1, y1, x2, y2) { return maak("line", { x1, y1, x2, y2, stroke: "#4a5a72", "stroke-width": 1.2 }, ouder); }
function beker(g, x, y, w, h) {
  maak("path", { d: `M${x - 6},${y} L${x},${y + 4} L${x},${y + h - 8} Q${x},${y + h} ${x + 8},${y + h} L${x + w - 8},${y + h} Q${x + w},${y + h} ${x + w},${y + h - 8} L${x + w},${y + 4} L${x + w + 6},${y}`,
    fill: "none", stroke: "#2c5687", "stroke-width": 3.5, "stroke-linejoin": "round" }, g);
}
function brander(g, x, y) {                     // brander met vlam; de vlam (terug) flakkert in stap()
  maak("rect", { x: x - 22, y: y + 70, width: 44, height: 10, rx: 3, fill: "#5b6b7c" }, g);
  maak("rect", { x: x - 7, y: y + 18, width: 14, height: 54, fill: "#8796a6", stroke: "#4a5a72", "stroke-width": 1.5 }, g);
  const vlam = maak("path", { d: `M${x},${y - 30} C${x + 14},${y - 8} ${x + 12},${y + 10} ${x},${y + 18} C${x - 12},${y + 10} ${x - 14},${y - 8} ${x},${y - 30} Z`, fill: "url(#gVlam)", opacity: 0 }, g);
  return vlam;
}
function flakker(vlam, aan, x, y) {
  vlam.setAttribute("opacity", aan ? .95 : 0);
  if (aan) vlam.setAttribute("transform", `translate(${x} ${y + 18}) scale(${(1 + .08 * Math.sin(performance.now() / 70)).toFixed(3)}) translate(${-x} ${-y - 18})`);
}
function druppels(o, ouder, x, y0, yEind, aan, dt) {   // vallende druppels; o.dr = lijst
  o.dr = o.dr || []; o.drT = (o.drT || 0) - dt;
  if (aan && o.drT <= 0) { o.drT = .28; o.dr.push({ y: y0, el: maak("ellipse", { cx: x, cy: y0, rx: 3, ry: 4.5, fill: "#8fc0ea" }, ouder) }); }
  for (const d of o.dr.slice()) {
    d.y += 260 * dt; d.el.setAttribute("cy", d.y.toFixed(1));
    if (d.y > yEind) { d.el.remove(); o.dr.splice(o.dr.indexOf(d), 1); }
  }
}

/* ---------- uitleg ---------- */
let uitlegOud = "";
function zetUitleg(paragrafen) {                 // nieuwe alinea's worden aangevuld, de oude blijven staan
  const html = paragrafen.map(p => `<p>${p}</p>`).join("");
  if (html === uitlegOud) return;
  const oud = uitlegOud; uitlegOud = html;
  $("uitleg").innerHTML = html;
  if (oud && html.startsWith(oud.slice(0, -4))) {
    const ps = $("uitleg").querySelectorAll("p"); if (ps.length) ps[ps.length - 1].classList.add("nieuw");
  }
}

   Elke methode: titel, verschil (de stofeigenschap), voorbeeld, duur (s),

/* ---------- Filtreren: zand uit water ---------- */
const mFiltreren = {
  id: "filtreren", titel: "Filtreren", verschil: "deeltjesgrootte", voorbeeld: "zand uit water halen met een filter", duur: 27,
  legenda: [["water", "watermolecuul"], ["zand", "zandkorrel (bestaat zelf uit heel veel deeltjes)"], ["vezel", "vezel van het filtreerpapier"]],
  teksten: [
    [0, `Zand en water vormen samen een <b>suspensie</b>. Je giet die door een trechter met filtreerpapier.`],
    [1.5, `Het filtreerpapier is een netwerk van vezels met kleine gaatjes. Watermoleculen zijn veel kleiner dan de gaatjes: ze gaan erdoorheen.`],
    [8, `Een zandkorrel bestaat uit heel veel deeltjes en is veel groter dan de gaatjes. De korrels blijven op het papier liggen: het <b>residu</b>. Wat erdoor gaat, heet het <b>filtraat</b>.`],
    [14.5, `Filtreren berust op een verschil in <b>deeltjesgrootte</b>. Moleculen en ionen van een opgeloste stof zijn klein en gaan wél door het filter.`],
    [21, `<b>Waarom filtreren?</b> Zo haal je een vaste stof die niet is opgelost uit een vloeistof, zoals zand uit water of koffiedik uit koffie. Het filtraat is helder.`]
  ],
  bouw() {
    const g = nieuweTekening();
    this.filtraat = maak("rect", { x: 142, width: 136, fill: "#cfe3f7" }, g);
    beker(g, 140, 360, 140, 140);
    this.vl = maak("path", { fill: "#b89466", opacity: .8 }, g);
    this.zl = maak("path", { fill: "#a77d45" }, g);
    maak("path", { d: "M106,148 L203,283 L217,283 L314,148", fill: "none", stroke: "#e2dac4", "stroke-width": 5, "stroke-linejoin": "round" }, g);
    maak("path", { d: "M100,146 L200,284 L200,388 M320,146 L220,284 L220,388", fill: "none", stroke: "#2c5687", "stroke-width": 3.5, "stroke-linejoin": "round" }, g);
    this.dg = maak("g", {}, g);
    label(g, 210, 128, "zand en water", "middle", "lab");
    label(g, 318, 196, "trechter met"); label(g, 318, 212, "filtreerpapier");
    this.lRes = label(g, 236, 300, "residu: zand", "start", "lab"); this.lFil = label(g, 290, 470, "filtraat: water", "start", "lab");
    this.dr = [];
    const M = kader({ x: 210, y: 266, r: 15 });
    this.S = [];
    for (let x = MK.x0 + 27; x < MK.x1; x += 54) { const v = deeltje(M.g, "vezel", x, 262); v.r = 13; this.S.push(v); }
    this.D = [];
    const zand = [[520, 120], [610, 180], [700, 100], [790, 170], [840, 90], [560, 215]];
    vul(M.g, this.D, { x0: MK.x0, y0: 70, x1: MK.x1, y1: 246 }, 22.5, (x, y) => zand.some(([a, b]) => Math.hypot(x - a, y - b) < 32) ? null : "water");
    for (const [x, y] of zand) { const p = deeltje(M.g, "zand", x, y); p.vh *= .3; this.D.push(p); }
    this.mRes = label(M.boven, 480, 74, "boven het filter", "start", "lab-m");
    this.mFil = label(M.boven, 480, MK.y1 - 10, "filtraat", "start", "lab-m");
    label(M.boven, 870, 296, "filtreerpapier", "end", "lab-m");
  },
  stap(dt) {
    const t = this.t, aan = t > 0;
    for (const p of this.D) p.zw = p.soort === "zand" ? (aan ? 700 : 0) : (aan ? 420 : 260);
    fysica(this.D, this.S, { x0: MK.x0, y0: 30, x1: MK.x1, y1: aan ? MK.y1 : 246 }, dt, { ruis: 2000, wissel: 3 });
    this.D.forEach(zet);

/* verdampen: deeltjes aan het oppervlak laten los met een kans per seconde (kans[soort]) */
function verdamp(D, dt, kans, top = MK.y0) {      // geeft de deeltjes terug die het beeld uit zijn gevlogen
  const vloei = D.filter(p => !p.uit && !p.vast), weg_ = [];
  if (!vloei.length) return weg_;
  const ys = vloei.map(p => p.y).sort((a, b) => a - b), opp = ys[Math.min(ys.length - 1, 4)];
  for (const p of vloei) {
    const k = kans[p.soort] || 0;
    if (k && p.y < opp + 24 && Math.random() < k * dt) { p.uit = true; p.wissel = null; p.vy = -rnd(70, 120); p.vx = rnd(-40, 40); }
  }
  for (const p of D.slice()) if (p.uit && p.y < top - 40) { weg(D, p); weg_.push(p); }
  return weg_;
}

    const s = ds[i % ds.length], r = SOORT[s].r, sc = 13 / r;
    const g = document.createElementNS(NS, "g"); SOORT[s].teken(g);
    h += `<g transform="translate(${x} ${y}) scale(${sc.toFixed(2)})">${g.innerHTML}</g>`;
  });
  return h + `</svg>`;
}

const spel = { vragen: [], i: 0, punten: [], poging: 1, klaar: false };
let vorigeMengsels = [];
function kiesRonde() {
  // 5 stappen per ronde; zo veel mogelijk verschillende methoden, minstens één mengsel met 4 en één met 3 stoffen
  for (let p = 0; p < 400; p++) {
    const kand = mix(p < 200 ? MENGSELS.filter(m => !vorigeMengsels.includes(m.id)) : MENGSELS);
    const lijst = [], gebruikt = {}; let over = 5;
    while (over > 0) {
      const passend = kand.filter(m => m.stappen.length <= over && !lijst.includes(m));
      if (!passend.length) break;
      const score = m => m.stappen.reduce((s, st) => s + (gebruikt[st.m] ? -1.5 : 1), 0) / m.stappen.length + Math.random() * 3;
      const m = passend.map(m => [score(m), m]).sort((a, b) => b[0] - a[0])[0][1];
      lijst.push(m); over -= m.stappen.length; m.stappen.forEach(st => gebruikt[st.m] = (gebruikt[st.m] || 0) + 1);
    }
    const n = m => Object.keys(m.stappen[0].in).length;
    if (over === 0 && Object.values(gebruikt).every(n => n <= 2) && lijst.some(m => n(m) >= 4) && lijst.some(m => n(m) === 3)) { vorigeMengsels = lijst.map(m => m.id); return lijst; }
  }
  return [MENGSELS.find(m => m.id === "huiswijn"), MENGSELS.find(m => m.id === "strooizout")];
}
function spelStart() {
  $("spel").innerHTML = `<div class="kaart start-spel">
    <h2>Spel: scheid het mengsel</h2>
    <p>Je krijgt <b>5 vragen</b>. Bij elke vraag zie je een mengsel en een doel. Kies eerst de goede <b>scheidingsmethode</b>. Zet daarna de <b>deeltjes</b> op de plek waar ze na het scheiden terechtkomen (slepen, of tikken op een deeltje en dan op een vak). Sommige mengsels scheid je in meer stappen.</p>
    <ul><li>Je mag twee keer controleren: een verkeerde methode of verkeerd geplaatste deeltjes kosten een poging.</li>
      <li>In één keer goed: <b>2 punten</b>. Goed bij de tweede keer: <b>1 punt</b>.</li>
      <li>Twee keer fout: 0 punten, en je ziet het goede antwoord met uitleg.</li></ul>
    <button class="groot-knop" id="s-start">▶ Start</button></div>`;
  $("s-start").addEventListener("click", nieuwSpel);
}
function nieuwSpel() {
  spel.vragen = [];
  for (const mg of kiesRonde()) mg.stappen.forEach((st, si) => spel.vragen.push({ mg, st, si }));
  spel.i = 0; spel.punten = []; toonVraag();
}
function spelBalk() {
  const score = spel.punten.reduce((a, b) => a + b, 0);
  return `<div class="spelbalk"><strong>Vraag ${spel.i + 1} van ${spel.vragen.length}</strong>
    <div class="voortgang">${spel.vragen.map((_, j) => `<i class="${j < spel.i ? "af" : j === spel.i ? "nu" : ""}"></i>`).join("")}</div>
    <span>Score: <strong>${score}</strong></span>
    <span class="pogingslabel">Poging ${spel.poging} van 2 · goed = ${spel.poging === 1 ? 2 : 1} ${spel.poging === 1 ? "punten" : "punt"}</span>
    <button class="stop" id="s-stop">Stoppen</button></div>`;
}
function werkBalk() { $("s-balk").innerHTML = spelBalk(); $("s-stop").addEventListener("click", spelStart); }
function feedback(soort, html) { const f = $("s-fb"); f.hidden = false; f.className = "feedback " + soort; f.innerHTML = html; }
function afronden(pnt) {
  spel.punten.push(pnt); spel.klaar = true; werkBalk();
  document.querySelectorAll(".dkaart").forEach(k => k.classList.add("klaar"));
  if ($("s-bakje") && !$("s-bakje").children.length) $("s-bakje").hidden = true;
  $("s-verder").hidden = false; $("s-verder").focus({ preventScroll: true });
}

function toonVraag() {
  spel.poging = 1; spel.klaar = false;
  const { mg, st, si } = spel.vragen[spel.i], ds = Object.keys(st.in);
  const vorige = si > 0 ? mg.stappen[si - 1] : null;
  $("spel").innerHTML = `<div id="s-balk"></div><div class="kaart vraagvak">
    <div class="mengsel">${bekerIcoon(ds)}<div>
      <span class="stap">${mg.stappen.length > 1 ? `Stap ${si + 1} van ${mg.stappen.length}` : "Mengsel"}</span>
      <h3>${mg.naam}</h3>
      <p>${vorige ? `Na het ${NAAM[vorige.m].toLowerCase()}: ${vorige.verderTekst[0].toLowerCase() + vorige.verderTekst.slice(1)}` : mg.wat}${st.extra ? ` Je voegt ${st.extra.map(d => dNaam(mg, d).replace("moleculen", "")).join(" en ")} toe.` : ""}</p>
      <p>In het mengsel: ${ds.map(d => dNaam(mg, d)).join(", ")}.</p>
      ${mg.gegevens ? `<p class="gegevens"><b>Gegevens:</b> ${mg.gegevens.join(" · ")}</p>` : ""}
      <p class="doel"><b>Doel:</b> ${st.doel}</p></div></div>
    <p class="opdracht" id="s-opdr">Welke scheidingsmethode kies je?</p>
    <div class="methoden" id="s-meth">${METHODEN.map(m => `<button data-m="${m.id}">${m.titel}</button>`).join("")}</div>
    <div id="s-plaats" hidden></div>
    <div class="feedback" id="s-fb" hidden></div>
    <div class="knoppen"><button class="hoofd" id="s-verder" hidden>${spel.i < spel.vragen.length - 1 ? "Volgende vraag →" : "Bekijk je score →"}</button></div></div>`;
  werkBalk();
  $("s-verder").addEventListener("click", () => { spel.i++; spel.i < spel.vragen.length ? toonVraag() : eindScherm(); });
  $("s-meth").querySelectorAll("button").forEach(b => b.addEventListener("click", () => kiesMethode(b)));
}

function kiesMethode(b) {
  if (spel.klaar || b.disabled) return;
  const { mg, st } = spel.vragen[spel.i], m = b.dataset.m;
  const alle = $("s-meth").querySelectorAll("button");
  if (m === st.m) {
    b.classList.add("goed"); alle.forEach(x => x.disabled = true);
    // nog niet de hele uitleg: die verklapt waar de deeltjes heen gaan (die volgt na het plaatsen)
    feedback("goed", `<p><b>Goed: ${NAAM[m].toLowerCase()}!</b> Deze methode berust op een verschil in <b>${METHODEN.find(x => x.id === m).verschil}</b>. Zet nu de deeltjes op de goede plek.</p>`);
    toonPlaatsen(false);
  } else {
    b.classList.add("fout"); b.disabled = true;
    const { si } = spel.vragen[spel.i];
    const later = mg.stappen.slice(si + 1).some(x => x.m === m);      // methode van een volgende stap: niets verklappen
    const waarom = later ? `Dat past niet bij het doel van deze stap. Lees het doel nog eens: wat moet er nú uit het mengsel?`
      : (st.fout && st.fout[m]) || `${FOUT_ALG[m]} Past dat bij dit mengsel en dit doel?`;
    if (spel.poging === 1) {
      feedback("fout", `<p><b>${NAAM[m]} past hier niet.</b> ${waarom}</p><p>${later ? "" : "Kijk naar het doel: welk verschil in stofeigenschap tussen de deeltjes kun je gebruiken? "}Probeer het nog een keer.</p>`);
      spel.poging = 2; werkBalk();
    } else {
      alle.forEach(x => { x.disabled = true; if (x.dataset.m === st.m) x.classList.add("goed"); });
      feedback("fout", `<p><b>${NAAM[m]} past hier ook niet.</b> ${waarom}</p><p>Het goede antwoord is <b>${NAAM[st.m].toLowerCase()}</b>. ${st.goed}</p>` + plaatsUitleg(mg, st));
      toonPlaatsen(true);
      afronden(0);
    }
  }
}
function plaatsUitleg(mg, st) {
  const z = ZONES[st.m];
  return `<ul>${Object.keys(st.in).map(d => `<li><b>${dNaam(mg, d)}</b> → ${z[st.in[d]][0].toLowerCase()}: ${st.u[d]}</li>`).join("")}</ul>`;
}
function kaartHtml(mg, d) { return `<div class="dkaart" data-d="${d}" tabindex="0" role="button">${icoon(d, "")}<span>${dNaam(mg, d)}</span></div>`; }

function toonPlaatsen(opgelost) {
  const { mg, st } = spel.vragen[spel.i], z = ZONES[st.m], ds = mix(Object.keys(st.in));
  const p = $("s-plaats"); p.hidden = false;
  $("s-opdr").hidden = true;
  $("s-meth").querySelectorAll("button").forEach(b => b.hidden = !b.classList.contains("goed") && !b.classList.contains("fout"));
  p.innerHTML = `<p class="plaats-vraag">Je gaat ${NAAM[st.m].toLowerCase()}. Waar komen de deeltjes terecht? Sleep ze naar het goede vak.</p>
    <div class="bakje" id="s-bakje">${opgelost ? "" : ds.map(d => kaartHtml(mg, d)).join("")}</div>
    <div class="zones">${z.map(([t, s], i) => `<div class="zone" data-z="${i}" role="button" tabindex="0"><span class="z-titel">${t}</span><span class="z-sub">${s}</span><div class="z-in">${opgelost ? ds.filter(d => st.in[d] === i).map(d => kaartHtml(mg, d)).join("") : ""}</div></div>`).join("")}</div>
    <div class="knoppen"${opgelost ? " hidden" : ""}><button class="hoofd" id="s-contr" disabled>Controleer</button></div>`;
  if (opgelost) { p.querySelectorAll(".dkaart").forEach(k => k.classList.add("goed", "klaar")); return; }
  koppelSlepen();
  $("s-contr").addEventListener("click", controleer);
}

function koppelSlepen() {
  let gekozen = null;
  const bakje = $("s-bakje"), knop = $("s-contr");
  const bijwerken = () => { knop.disabled = bakje.children.length > 0; };
  const leg = (kaart, doel) => {
    (doel.classList.contains("zone") ? doel.querySelector(".z-in") : doel).appendChild(kaart);
    kaart.classList.remove("fout", "gekozen"); gekozen = null; bijwerken();
  };
  const onder = (x, y, kaart) => {
    kaart.style.pointerEvents = "none";
    const el = document.elementFromPoint(x, y); kaart.style.pointerEvents = "";
    return el && (el.closest(".zone") || el.closest(".bakje"));
  };
  document.querySelectorAll("#s-plaats .dkaart").forEach(kaart => {
    let s = null;
    kaart.addEventListener("pointerdown", e => {
      if (spel.klaar || kaart.classList.contains("goed")) return;
      e.preventDefault();
      s = { x: e.clientX, y: e.clientY, bewogen: false }; kaart.setPointerCapture(e.pointerId);
    });
    kaart.addEventListener("pointermove", e => {
      if (!s) return;
      const dx = e.clientX - s.x, dy = e.clientY - s.y;
      if (!s.bewogen && Math.hypot(dx, dy) < 6) return;
      if (!s.bewogen) { s.bewogen = true; kaart.classList.add("sleep"); const kb = kaart.getBoundingClientRect(); kaart.style.transformOrigin = `${s.x - kb.left}px ${s.y - kb.top}px`; }
      kaart.style.transform = `translate(${dx}px, ${dy}px) scale(.6)`;
      const z = onder(e.clientX, e.clientY, kaart);
      document.querySelectorAll(".zone").forEach(x => x.classList.toggle("boven", x === z));
    });
    const los = e => {
      if (!s) return;
      const bewogen = s.bewogen; s = null;
      kaart.classList.remove("sleep"); kaart.style.transform = "";
      document.querySelectorAll(".zone").forEach(x => x.classList.remove("boven"));
      if (bewogen) { const z = onder(e.clientX, e.clientY, kaart); if (z) leg(kaart, z); }
      else {                                       // tikken: kies dit deeltje, tik daarna op een vak
        document.querySelectorAll(".dkaart.gekozen").forEach(k => k !== kaart && k.classList.remove("gekozen"));
        kaart.classList.toggle("gekozen"); gekozen = kaart.classList.contains("gekozen") ? kaart : null;
      }
    };
    kaart.addEventListener("pointerup", los);
    kaart.addEventListener("pointercancel", () => { s = null; kaart.classList.remove("sleep"); kaart.style.transform = ""; });
    kaart.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); kaart.classList.toggle("gekozen"); gekozen = kaart.classList.contains("gekozen") ? kaart : null; } });
  });
  for (const doel of [...document.querySelectorAll(".zone"), bakje]) {
    doel.addEventListener("pointerup", e => { if (gekozen && !e.target.closest(".dkaart") && !spel.klaar) leg(gekozen, doel); });
    doel.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && gekozen && e.target === doel) { e.preventDefault(); leg(gekozen, doel); } });
  }
}

function controleer() {
  if (spel.klaar) return;
  const { mg, st } = spel.vragen[spel.i], z = ZONES[st.m];
  const fout = [];
  document.querySelectorAll(".zone").forEach(zone => zone.querySelectorAll(".dkaart").forEach(k => {
    if (st.in[k.dataset.d] === +zone.dataset.z) k.classList.add("goed"); else fout.push(k);
  }));
  if (!fout.length) {
    feedback("goed", `<p><b>Goed!</b> ${st.goed}</p>` + plaatsUitleg(mg, st));
    afronden(spel.poging === 1 ? 2 : 1);
    $("s-contr").hidden = true;
    return;
  }
  const hints = fout.map(k => `<li>${HINT[st.m](dNaam(mg, k.dataset.d))}</li>`).join("");
  if (spel.poging === 1) {
    fout.forEach(k => { k.classList.add("fout"); $("s-bakje").appendChild(k); });
    $("s-contr").disabled = true;
    feedback("fout", `<p><b>Nog niet goed.</b> ${fout.length === 1 ? "Eén deeltje staat" : `${fout.length} deeltjes staan`} op de verkeerde plek; ${fout.length === 1 ? "het staat" : "ze staan"} weer in de bak. De groene staan goed.</p><ul>${hints}</ul><p>Probeer het nog een keer.</p>`);
    spel.poging = 2; werkBalk();
  } else {
    fout.forEach(k => { k.classList.remove("fout"); k.classList.add("goed"); document.querySelector(`.zone[data-z="${st.in[k.dataset.d]}"] .z-in`).appendChild(k); });
    feedback("fout", `<p><b>Helaas, ook niet goed.</b> Zo komen de deeltjes terecht bij ${NAAM[st.m].toLowerCase()}:</p>` + plaatsUitleg(mg, st));
    $("s-contr").hidden = true;
    afronden(0);
  }
}

function eindScherm() {
  const tot = spel.punten.reduce((a, b) => a + b, 0), max = spel.vragen.length * 2;
  const sterren = tot >= 9 ? 3 : tot >= 6 ? 2 : tot >= 3 ? 1 : 0;
  $("spel").innerHTML = `<div class="kaart resultaat"><h2>Klaar!</h2>
    <div class="sterren">${"★".repeat(sterren)}${"☆".repeat(3 - sterren)}</div>
    <div class="totaal">${tot} / ${max}</div><p>punten</p>
    <ol>${spel.vragen.map((q, j) => `<li><span class="f">${j + 1}</span><br>${q.mg.naam}<br><i>${NAAM[q.st.m].toLowerCase()}</i><br><span class="pnt ${spel.punten[j] === 2 ? "vol" : spel.punten[j] === 1 ? "half" : "nul"}">${spel.punten[j]} ${spel.punten[j] === 1 ? "punt" : "punten"}</span></li>`).join("")}</ol>
    <div class="rij"><button class="groot-knop" id="s-weer">↺ Opnieuw spelen</button><button class="groot-knop licht" id="s-menu">Spelregels</button></div></div>`;
  $("s-weer").addEventListener("click", nieuwSpel);
  $("s-menu").addEventListener("click", spelStart);
}

/* ===================================================================== NAVIGATIE */
let cat = "methode", deel = mFiltreren, speelt = false;
const rustig = matchMedia("(prefers-reduced-motion: reduce)").matches;

function kies(c, d) {
  cat = c; speelt = false;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.cat === c));
  const ov = c === "overzicht", sp = c === "spel";
  $("app").hidden = ov || sp; $("vergelijk").hidden = !ov; $("spel").hidden = !sp;
  if (ov) { $("delen").innerHTML = ""; bouwOverzicht(); return; }
  if (sp) { $("delen").innerHTML = ""; spelStart(); return; }
  deel = METHODEN.find(x => x.id === d) || deel;
  $("delen").innerHTML = METHODEN.map(x => `<button data-id="${x.id}" aria-pressed="${x === deel}">${x.titel}</button>`).join("");
  $("delen").querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", () => kies("methode", b.dataset.id)));
  toonDeel();
}
function toonDeel() {
  uitlegOud = ""; speelt = false; deel.t = 0;
  $("bed-titel").textContent = deel.titel;
  $("bediening").innerHTML = `<p class="voorbeeld">Voorbeeld: <b>${deel.voorbeeld}</b></p>
    <div class="chips"><span>berust op een verschil in ${deel.verschil}</span></div>
    <div class="knoppen"><button id="v-start" class="hoofd"></button><button id="v-opnieuw">↺ Opnieuw</button></div>
    <div class="legenda">${deel.legenda.map(([s, t]) => `<div>${icoon(s)}${t}</div>`).join("")}</div>`;
  $("v-start").addEventListener("click", () => {
    if (deel.t >= deel.duur) { toonDeel(); speelt = true; knop(); return; }
    speelt = !speelt; knop();
  });
  $("v-opnieuw").addEventListener("click", toonDeel);
  tek.setAttribute("aria-label", `${deel.titel}: ${deel.voorbeeld}`);
  deel.bouw(); deel.stap(0); tekst(); knop();
}
function knop() { $("v-start").textContent = speelt ? "⏸ Pauzeer" : deel.t > 0 && deel.t < deel.duur ? "▶ Verder" : "▶ Start"; }
function tekst() {
  const t = deel.t, p = deel.teksten.filter(([s]) => t >= s && (s > 0 || true)).filter(([s]) => s === 0 || t > 0).map(x => x[1]);
  if (t === 0) p[0] += ` Klik op <b>Start</b>.`;
  zetUitleg(p);
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => kies(b.dataset.cat, deel.id)));

let laatst = performance.now();
function lus(nu) {
  const dt = Math.max(0, Math.min(.05, (nu - laatst) / 1000)); laatst = nu;   // het eerste beeld kan iets vóór 'laatst' liggen
  if (!$("app").hidden) {
    if (speelt) { deel.t = Math.min(deel.duur, deel.t + dt); if (deel.t >= deel.duur) { speelt = false; knop(); } }
    // vóór de start en na afloop bewegen de deeltjes gewoon door (niet bij 'beperk beweging')
    if (speelt || (!rustig && (deel.t === 0 || deel.t >= deel.duur))) deel.stap(dt);
    tekst();
  }
  requestAnimationFrame(lus);
}
const q = new URLSearchParams(location.search);
const qDeel = q.get("deel");
kies(["methode", "overzicht", "spel"].includes(q.get("tab")) ? q.get("tab") : "methode", qDeel);
requestAnimationFrame(lus);
</script>
