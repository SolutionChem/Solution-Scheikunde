<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stofeigenschappen op microniveau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #11264a; --navy2: #163a63; --navy3: #2c5687;
    --licht: #eef4fb; --licht2: #dbe8f5; --rand: #c9d8ea;
    --tekst: #14213a; --zacht: #4a5a72;
    --plus: #3fa55b; --min: #e0574a; --metaal: #f8e39b; --elektron: #e8890c;
    --kop: "Oswald", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Inter, "Helvetica Neue", Arial, sans-serif; color: var(--tekst); background: var(--licht);
         line-height: 1.45; font-size: 15px; -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; background: var(--navy); overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: 0 0 auto; border: 0; background: transparent; color: #cfdcef; padding: 9px 14px 10px; border-radius: 8px 8px 0 0;
                 font-family: var(--kop); letter-spacing: .08em; text-transform: uppercase; font-size: .9rem; }
  .tabs button:hover { color: #fff; background: rgba(255,255,255,.08); }
  .tabs button[aria-selected="true"] { background: var(--licht); color: var(--navy); }

  .delen { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 10px 12px 0; }
  .delen button { border: 1px solid var(--rand); background: #fff; border-radius: 99px; padding: 6px 14px; font-weight: 600; font-size: .9rem; color: var(--navy2); }
  .delen button[aria-pressed="true"] { background: var(--navy2); border-color: var(--navy2); color: #fff; }
  .delen .pauze { margin-left: auto; border-radius: 8px; }

  .scherm { padding: 10px 12px 12px; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
  .kaart { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(11,26,51,.1); padding: 12px 14px; min-width: 0; }
  .kaart h2 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--zacht); font-weight: 600; }
  .paneel { display: flex; flex-direction: column; gap: 10px; }
  .podium { padding: 6px; }
  #tek { width: 100%; height: clamp(300px, calc(100vh - 140px), 600px); display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }

  .knoppen { display: flex; gap: 6px; flex-wrap: wrap; }
  .knoppen + .knoppen { margin-top: 8px; }
  .knoppen button { flex: 1 1 auto; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--rand); background: #fff; font-weight: 600; font-size: .9rem; }
  .knoppen button.hoofd { background: var(--navy2); color: #fff; border-color: var(--navy2); }
  .knoppen button[aria-pressed="true"] { background: var(--navy2); color: #fff; border-color: var(--navy2); }
  .knoppen button:disabled { opacity: .45; cursor: default; }
  select { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--rand); background: #fff; }
  label.schuif { display: block; font-size: .9rem; margin-top: 4px; }
  label.schuif input { width: 100%; accent-color: var(--navy2); }
  label.optie { display: flex; gap: 8px; align-items: center; font-size: .9rem; margin-top: 8px; cursor: pointer; }
  label.optie input { width: 17px; height: 17px; accent-color: var(--navy2); }
  .stoflijst { display: grid; gap: 3px; }
  .stoflijst button { display: flex; justify-content: space-between; gap: 8px; text-align: left; padding: 2px 10px; border-radius: 7px;
                      border: 1px solid var(--rand); background: #fff; font-size: .88rem; }
  .stoflijst button span:last-child { font-weight: 700; color: var(--navy); white-space: nowrap; }
  .stoflijst button[aria-pressed="true"] { border-color: var(--navy2); box-shadow: inset 0 0 0 1px var(--navy2); background: var(--licht); }

  .schakelaar { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; cursor: pointer; font-weight: 600; font-size: .9rem; position: relative; }
  .schakelaar input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .schakelaar .baan { width: 42px; height: 24px; border-radius: 99px; background: #b8c4d4; position: relative; transition: background .15s; flex: 0 0 auto; }
  .schakelaar .baan::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .schakelaar input:checked + .baan { background: #c27c0e; }
  .schakelaar input:checked + .baan::after { left: 21px; }
  .schakelaar input:focus-visible + .baan { outline: 3px solid #9cc3f0; outline-offset: 2px; }
  .uitleg p { margin: 0 0 7px; font-size: .9rem; line-height: 1.4; }
  .uitleg p:last-child { margin-bottom: 0; }
  .uitleg p.nieuw { animation: in .6s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .uitleg b { color: var(--navy); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: -2px 0 10px; }
  .chips span { font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--licht2); color: var(--navy2); }
  .legenda { display: grid; gap: 5px; font-size: .86rem; margin-top: 8px; }
  .legenda div { display: flex; align-items: center; gap: 8px; }
  .legenda i { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; border: 1.5px solid rgba(0,0,0,.3); }
  .legenda i.lijn { border-radius: 0; height: 0; border: 0; border-top: 3px dashed; width: 20px; }

  svg text { font-family: Inter, Arial, sans-serif; }
  .ion-t { font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .lab { font-size: 17px; font-weight: 600; fill: var(--navy2); }
  .lab-z { font-size: 15px; fill: var(--zacht); }
  .groot { font-size: 26px; font-weight: 700; fill: var(--navy); }
  .delta { font-size: 19px; font-weight: 700; font-style: italic; text-anchor: middle; dominant-baseline: central; }

  /* vergelijken */
  .vergelijk { max-width: 1100px; margin: 0 auto; }
  .vergelijk .rij { display: grid; grid-template-columns: 190px repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
  .vergelijk .kop { font-family: var(--kop); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--navy2);
                    border-radius: 8px; padding: 8px 12px; font-size: .95rem; }
  .vergelijk .eig { background: var(--navy2); color: #fff; border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: .92rem; }
  .vergelijk .cel { background: #fff; border-radius: 8px; padding: 9px 12px; font-size: .88rem; box-shadow: 0 1px 2px rgba(11,26,51,.08); }
  .vergelijk .cel b { display: block; color: var(--navy); font-size: .95rem; margin-bottom: 2px; }
  .vergelijk .cel a { color: var(--navy3); font-weight: 600; font-size: .82rem; text-decoration: none; display: inline-block; margin-top: 3px; cursor: pointer; }
  .vergelijk .cel a:hover { text-decoration: underline; }
  .vergelijk .cel .cat { display: none; font-family: var(--kop); letter-spacing: .06em; text-transform: uppercase; font-size: .78rem; color: var(--zacht); }

  /* spel (zelfde opzet als de spellen van Bouw een atoom en Bouw een molecuul) */
  .spel { max-width: 860px; margin: 0 auto; }
  .spelbalk { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: #fff; border-radius: 10px; padding: 8px 14px; margin-bottom: 10px;
              box-shadow: 0 1px 3px rgba(11,26,51,.1); font-size: .92rem; }
  .spelbalk strong { color: var(--navy); }
  .voortgang { display: flex; gap: 5px; }
  .voortgang i { width: 22px; height: 6px; border-radius: 3px; background: var(--licht2); }
  .voortgang i.af { background: var(--navy3); }
  .voortgang i.nu { background: var(--navy); outline: 2px solid #9cc3f0; }
  .pogingslabel { font-size: .8rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--licht2); color: var(--navy2); }
  .pogingslabel.verd { background: #f6e7cc; color: #7a4d06; }
  .spelbalk .stop { margin-left: auto; border: 1px solid var(--rand); background: #fff; color: var(--zacht); border-radius: 8px; padding: 4px 12px; font-size: .85rem; }
  .start-spel { max-width: 640px; margin: 18px auto; padding: 22px 26px; }
  .start-spel h2 { font-family: var(--kop); font-size: 1.4rem; letter-spacing: .04em; color: var(--navy); text-transform: none; margin: 0 0 10px; }
  .start-spel ul { margin: 6px 0 14px; padding-left: 20px; }
  .start-spel .schakelaar { margin: 14px 0 18px; }
  .groot-knop { font-size: 1.05rem; font-weight: 600; padding: 10px 28px; border-radius: 8px; border: 0; background: var(--navy2); color: #fff; }
  .groot-knop.licht { background: #fff; color: var(--navy2); border: 1px solid var(--rand); }
  .vraagvak { padding: 16px 18px; }
  .opdracht { font-size: 1.08rem; font-weight: 600; color: var(--navy); margin: 0 0 12px; }
  .verd-label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: #f6e7cc; color: #7a4d06; padding: 2px 8px; border-radius: 99px; vertical-align: 2px; }
  .kaartplek { display: flex; justify-content: center; margin-bottom: 14px; min-height: 150px; }
  .stofkaart { width: min(100%, 420px); background: #fffdf5; border: 2px solid var(--navy3); border-radius: 12px; padding: 12px 16px; cursor: grab;
               touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 3px 8px rgba(11,26,51,.15); position: relative; z-index: 2; }
  .stofkaart.sleep { cursor: grabbing; box-shadow: 0 10px 24px rgba(11,26,51,.3); transition: none; opacity: .92; }
  .stofkaart:not(.sleep) { transition: transform .25s; }
  .stofkaart.weg { opacity: .55; cursor: default; }
  .stofkaart h3 { margin: 0 0 6px; font-family: var(--kop); letter-spacing: .06em; color: var(--navy); font-size: 1.15rem; }
  .stofkaart ul { margin: 0; padding-left: 18px; }
  .stofkaart li { margin: 3px 0; }
  .bakken { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .bak { border: 2px dashed var(--navy3); border-radius: 12px; padding: 16px 10px; text-align: center; background: var(--licht); cursor: pointer; transition: background .15s; }
  .bak .bak-titel { display: block; font-family: var(--kop); letter-spacing: .06em; text-transform: uppercase; color: var(--navy); font-size: 1.05rem; }
  .bak .bak-sub { display: block; font-size: .8rem; color: var(--zacht); }
  .bak.boven { background: var(--licht2); border-style: solid; }
  .bak.goed { background: #e9f7ef; border: 2px solid #1f8a4c; }
  .bak.fout { background: #fdecea; border: 2px solid #c0392b; }
  .bak.uit { cursor: default; opacity: .7; }
  .opties { display: grid; gap: 8px; margin-bottom: 12px; }
  .opties button { text-align: left; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--rand); background: #fff; font-size: .95rem; }
  .opties button:hover:not(:disabled) { border-color: var(--navy3); }
  .opties button.goed { background: #e9f7ef; border-color: #1f8a4c; font-weight: 600; }
  .opties button.fout { background: #fdecea; border-color: #c0392b; }
  .opties button:disabled { cursor: default; }
  .feedback { padding: 10px 12px; border-radius: 8px; font-size: .93rem; background: var(--licht); margin-bottom: 10px; }
  .feedback.goed { background: #e9f7ef; border-left: 5px solid #1f8a4c; }
  .feedback.fout { background: #fdecea; border-left: 5px solid #c0392b; }
  .feedback p { margin: 0 0 6px; } .feedback p:last-child { margin: 0; }
  .feedback ul { margin: 0; padding-left: 18px; }
  .resultaat { max-width: 720px; margin: 18px auto; padding: 24px 26px; text-align: center; }
  .resultaat h2 { font-family: var(--kop); font-size: 1.4rem; color: var(--navy); text-transform: none; letter-spacing: .04em; }
  .resultaat .totaal { font-size: 3rem; font-weight: 700; color: var(--navy); line-height: 1.1; margin: 8px 0 2px; }
  .resultaat .sterren { font-size: 1.8rem; letter-spacing: .15em; color: #e0a800; }
  .resultaat ol { list-style: none; padding: 0; margin: 18px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .resultaat li { border: 1px solid var(--rand); border-radius: 10px; padding: 8px 14px 6px; min-width: 112px; font-size: .88rem; }
  .resultaat li .f { font-family: var(--kop); font-size: 1.3rem; color: var(--navy); }
  .resultaat li .pnt { font-size: .85rem; font-weight: 600; }
  .resultaat li .pnt.vol { color: #1f8a4c; } .resultaat li .pnt.half { color: #b77b00; } .resultaat li .pnt.nul { color: #c0392b; }
  .resultaat .rij { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  @media (max-width: 760px) {
    .app { display: flex; flex-direction: column; align-items: stretch; }
    .paneel { display: contents; }
    .kaart.bed { order: 1; }
    .podium { order: 2; }
    .kaart.uit { order: 3; }
    #tek { height: auto; aspect-ratio: 900 / 540; }
    .scherm { padding: 8px; }
    .vergelijk .rij { grid-template-columns: 1fr; }
    .vergelijk .rij.koprij { display: none; }
    .vergelijk .cel .cat { display: block; }
    .bakken { gap: 6px; } .bak { padding: 12px 4px; } .bak .bak-titel { font-size: .9rem; } .bak .bak-sub { display: none; }
  }
</style>
</head>
<body>
<nav class="tabs" role="tablist" aria-label="Soort stof">
  <button role="tab" data-cat="zout" aria-selected="true">Zouten</button>
  <button role="tab" data-cat="metaal" aria-selected="false">Metalen</button>
  <button role="tab" data-cat="moleculair" aria-selected="false">Moleculaire stoffen</button>
  <button role="tab" data-cat="vergelijk" aria-selected="false">Vergelijken</button>
  <button role="tab" data-cat="spel" aria-selected="false">Spel</button>
</nav>
<div class="delen" id="delen"></div>

<main class="scherm">
  <section class="app" id="app">
    <div class="kaart podium"><svg id="tek" viewBox="0 0 900 540" role="img"></svg></div>
    <div class="paneel">
      <div class="kaart bed">
        <h2 id="bed-titel">Doe het zelf</h2>
        <div class="chips" id="chips" title="Stofeigenschappen in dit onderdeel"></div>
        <div id="bediening"></div>
      </div>
      <div class="kaart uit">
        <h2>Wat zie je?</h2>
        <div class="uitleg" id="uitleg" aria-live="polite"></div>
      </div>
    </div>
  </section>
  <section class="vergelijk" id="vergelijk" hidden></section>
  <section class="spel" id="spel" hidden></section>
</main>

<script>
"use strict";
/* =====================================================================
   Stofeigenschappen op microniveau (§3.1–§3.2)
   Eén simulatie met drie categorieën (zouten, metalen, moleculaire
   stoffen) en een vergelijking. Elke categorie heeft onderdelen die elk
   zonder scrollen in beeld passen.
   URL: ?tab=zout|metaal|moleculair|vergelijk  &deel=<id van het onderdeel>
   ===================================================================== */
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const tek = $("tek");
const KLEUR = {
  p: ["#3fa55b", "#23733a", "#fff"],        // positief ion: groen
  n: ["#e0574a", "#9b2a20", "#fff"],        // negatief ion: rood
  m: ["#f8e39b", "#a88d2c", "#11264a"],     // metaalion: geel
  a: ["#e2b64f", "#7c5f14", "#11264a"]      // ander metaal (legering)
};
const fmt = t => (t < 0 ? "−" : "") + String(Math.abs(t)).replace(".", ",");
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const tussen = (t, a, b) => ease((t - a) / (b - a));
const rnd = (a, b) => a + Math.random() * (b - a);

function maak(tag, attrs, ouder, tekst) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (tekst != null) el.textContent = tekst;
  if (ouder) ouder.appendChild(el);
  return el;
}
function defs() {
  const d = maak("defs", {}, tek);
  const grad = (id, licht, donker) => {
    const rg = maak("radialGradient", { id, cx: "35%", cy: "32%", r: "70%" }, d);
    maak("stop", { offset: "0", "stop-color": licht }, rg); maak("stop", { offset: "1", "stop-color": donker }, rg);
  };
  grad("gO", "#ff9a8c", "#cf3a2e"); grad("gH", "#ffffff", "#d3dae3"); grad("gC", "#7a828d", "#262a30");
  const pijl = maak("marker", { id: "pijl", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, markerUnits: "userSpaceOnUse", orient: "auto-start-reverse" }, d);
  maak("path", { d: "M0,0 L10,5 L0,10 z", fill: "#c0392b" }, pijl);
  return d;
}
/* een ion of metaalion: bol met lading of symbool */
function maakIon(ouder, soort, r, label) {
  const [vul, rand, tk] = KLEUR[soort];
  const g = maak("g", {}, ouder);
  const c = maak("circle", { r, fill: vul, stroke: rand, "stroke-width": 2 }, g);
  const t = maak("text", { class: "ion-t", fill: tk, "font-size": Math.max(11, r * .72) }, g, label);
  return { g, c, t, r, soort, x: 0, y: 0, vx: 0, vy: 0 };
}
function plaats(o) { o.g.setAttribute("transform", `translate(${o.x.toFixed(1)} ${o.y.toFixed(1)})`); }

/* molecuulmodellen (kalotmodel, plat getekend): [element, x, y, straal] */
const AT = { O: ["url(#gO)", "#9b2a20"], H: ["url(#gH)", "#8a97a8"], C: ["url(#gC)", "#15181c"] };
function alkaan(n, zonderMiddenH) {
  const C = [], H = [];
  for (let i = 0; i < n; i++) {
    const x = (i - (n - 1) / 2) * 20, y = i % 2 ? -5 : 5, uit = i % 2 ? -1 : 1;
    C.push(["C", x, y, 10.5]);
    if (zonderMiddenH && i === 1) continue;
    H.push(["H", x, y + uit * 14, 7]);
    if (i === 0 || i === n - 1) H.push(["H", x + (i === 0 ? -14 : 14), y - uit * 3, 7]);
    if (i > 0 && i < n - 1) H.push(["H", x, y - uit * 14, 7]);
    else H.push(["H", x + (i === 0 ? -6 : 6), y - uit * 13, 7]);
  }
  return [...H, ...C];
}
const MOL = {
  water: [["H", -9.5, 7, 7], ["H", 9.5, 7, 7], ["O", 0, -2, 11]],
  co2: [["C", 0, 0, 10], ["O", -17, 0, 10.5], ["O", 17, 0, 10.5]],
  methaan: [["H", -15, 0, 7], ["H", 15, 0, 7], ["H", 0, -15, 7], ["H", 0, 15, 7], ["C", 0, 0, 11]],
  propaan: alkaan(3), butaan: alkaan(4),
  propanon: [...alkaan(3, true), ["O", 0, -24, 11]],
  ethanol: [["H", -24, -2, 6], ["H", -19, 13, 6], ["H", -13, -9, 6], ["H", -3, -15, 6], ["H", 9, -14, 6], ["H", 26, -3, 5.5],
            ["C", -14, 3, 9.5], ["C", 2, -4, 9.5], ["O", 17, 3, 9.5]]
};
function maakMolecuul(ouder, soort, schaal = 1) {
  const g = maak("g", {}, ouder), binnen = maak("g", { transform: `scale(${schaal})` }, g);
  for (const [el, x, y, r] of MOL[soort]) maak("circle", { cx: x, cy: y, r, fill: AT[el][0], stroke: AT[el][1], "stroke-width": 1 }, binnen);
  return { g, x: 0, y: 0, hoek: 0, soort, schaal };
}
function plaatsMol(m) { m.g.setAttribute("transform", `translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${(m.hoek * 57.3).toFixed(1)})`); }

/* vrije elektronen in een metaal (zoals bij Metaalbinding in hoofdstuk 2):
   een langzaam draaiende "zin", zwakke aantrekking door de ionen, afstoting onderling */
function elektronenStap(E, ionen, grens, dt, opt = {}) {
  const RAND = 60, drift = opt.drift || 0;
  for (const e of E) {
    let ax = 0, ay = 0;
    e.zin += (Math.random() - .5) * 5 * Math.sqrt(dt);
    ax += Math.cos(e.zin) * 45; ay += Math.sin(e.zin) * 45;
    const b = grens(e);
    const duw = d => d < RAND ? 420 * Math.pow(1 - Math.max(d, 0) / RAND, 2) : 0;
    if (!opt.open) { ax += duw(e.x - b.x0) - duw(b.x1 - e.x); }
    ay += duw(e.y - b.y0) - duw(b.y1 - e.y);
    for (const a of ionen) {
      const dx = a.x - e.x, dy = a.y - e.y, d2 = dx * dx + dy * dy;
      if (d2 > 150 * 150) continue;
      const d = Math.sqrt(d2) || 1;
      let f = 200000 / (d2 + 2500);
      if (d < a.r + 12) f -= 900 * (1 - d / (a.r + 12));
      ax += f * dx / d; ay += f * dy / d;
    }
    for (const o of E) {
      if (o === e) continue;
      const dx = e.x - o.x, dy = e.y - o.y, d2 = dx * dx + dy * dy;
      if (d2 > 44 * 44 || d2 === 0) continue;
      const d = Math.sqrt(d2), f = 700 * (1 - d / 44);
      ax += f * dx / d; ay += f * dy / d;
    }
    ax += drift;

    const v = Math.hypot(e.vx, e.vy) || 1, doel = Math.min(MAX, Math.max(MIN, v));
    e.vx *= doel / v; e.vy *= doel / v;
    e.x += e.vx * dt; e.y += e.vy * dt;
    if (opt.open) {                                  // stroomkring: rechts eruit, links er weer in
      if (e.x > b.x1 + 8) { e.x = b.x0 - 4; }
      if (e.x < b.x0 - 8) { e.x = b.x1 + 4; }
    } else e.x = Math.max(b.x0 - 8, Math.min(b.x1 + 8, e.x));
    e.y = Math.max(b.y0 - 8, Math.min(b.y1 + 8, e.y));

}

/* deeltjes in een vloeistof: afstoten, beetje plakken, trillen; optioneel een elektrisch veld */
function vloeistofStap(D, vak, dt, opt = {}) {
  const K = opt.ruis || 2400, zw = opt.zwaarte || 0, veld = opt.veld || 0;
  // in een vloeistof ruilen buren voortdurend van plek: ze schuiven in een boogje langs elkaar heen
  if (opt.wissel) {
    D.wacht = (D.wacht || 0) - dt;
    if (D.wacht <= 0) {
      D.wacht = 1 / opt.wissel;
      const vrij = D.filter(p => !p.vast && !p.wissel);
      const a = vrij[Math.floor(Math.random() * vrij.length)];
      const buren = a ? vrij.filter(b => b !== a && (b.x - a.x) ** 2 + (b.y - a.y) ** 2 < ((a.r + b.r) * 1.5) ** 2) : [];
      if (buren.length) {
        const b = buren[Math.floor(Math.random() * buren.length)], kant = Math.random() < .5 ? 1 : -1;
        a.wissel = { x0: a.x, y0: a.y, x1: b.x, y1: b.y, t: 0, duur: .9, kant, r: a.r + b.r };
        b.wissel = { x0: b.x, y0: b.y, x1: a.x, y1: a.y, t: 0, duur: .9, kant, r: a.r + b.r };
      }
    }
  }
  for (const p of D) {
    if (p.wissel) {
      const w = p.wissel; w.t += dt;
      const f = Math.min(1, w.t / w.duur), e = ease(f), dx = w.x1 - w.x0, dy = w.y1 - w.y0, l = Math.hypot(dx, dy) || 1;
      const boog = Math.sin(Math.PI * f) * w.r * .55 * w.kant;
      p.x = w.x0 + dx * e - dy / l * boog; p.y = w.y0 + dy * e + dx / l * boog; p.vx = p.vy = 0;
      if (f >= 1) p.wissel = null;
      continue;
    }
    if (p.vast) continue;
    p.vx += ((Math.random() - .5) * 2 * K + (p.q ? -p.q * veld : 0)) * dt;
    p.vy += ((Math.random() - .5) * 2 * K + zw) * dt;
    const demp = Math.exp(-4 * dt); p.vx *= demp; p.vy *= demp;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let it = 0; it < 2; it++) {
    for (let i = 0; i < D.length; i++) for (let j = i + 1; j < D.length; j++) {
      const a = D[i], b = D[j];
      const av = a.vast || !!a.wissel, bv = b.vast || !!b.wissel;
      if (av && bv) continue;
      const dmin = (a.r + b.r) * (opt.ruimte || 1.12);
      let dx = b.x - a.x, dy = b.y - a.y; const d2 = dx * dx + dy * dy;
      if (d2 > dmin * dmin * 2.2) continue;
      const d = Math.sqrt(d2) || .01, nx = dx / d, ny = dy / d;
      if (d < dmin) {
        const wa = av ? 0 : 1, wb = bv ? 0 : 1, s = wa + wb, ov = dmin - d;
        a.x -= nx * ov * wa / s; a.y -= ny * ov * wa / s; b.x += nx * ov * wb / s; b.y += ny * ov * wb / s;
      } else if (it === 0 && opt.plak && a.q && b.q && a.q * b.q < 0) {   // tegengestelde ladingen trekken elkaar aan
        const f = opt.plak * dt;
        if (!av) { a.vx += nx * f; a.vy += ny * f; }
        if (!bv) { b.vx -= nx * f; b.vy -= ny * f; }
      }
    }
    for (const p of D) {
      if (p.vast || p.wissel) continue;
      if (p.x < vak.x0 + p.r) { p.x = vak.x0 + p.r; p.vx = Math.abs(p.vx) * .3; }
      if (p.x > vak.x1 - p.r) { p.x = vak.x1 - p.r; p.vx = -Math.abs(p.vx) * .3; }
      if (p.y < vak.y0 + p.r) { p.y = vak.y0 + p.r; p.vy = Math.abs(p.vy) * .3; }
      if (p.y > vak.y1 - p.r) { p.y = vak.y1 - p.r; p.vy = -Math.abs(p.vy) * .3; }
    }
  }
}

const ZOUTEN = {
  nacl: { naam: "natriumchloride", kort: "keukenzout", p: "Na⁺", n: "Cl⁻", rp: 15, rn: 24, smp: 801, kp: 1465 },
  mgo:  { naam: "magnesiumoxide", kort: "", p: "Mg²⁺", n: "O²⁻", rp: 12, rn: 21, smp: 2852, kp: 3600 }
};
function rooster(ouder, Z, cols, rows, sp, x0, yOnder, schaal = 1) {   // ionrooster, onderste rij op yOnder
  const ionen = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const plus = (r + c) % 2 === 0;
    const o = maakIon(ouder, plus ? "p" : "n", (plus ? Z.rp : Z.rn) * schaal, plus ? Z.p : Z.n);
    o.q = plus ? 1 : -1; o.rij = r; o.kol = c;
    o.hx = o.x = x0 + c * sp; o.hy = o.y = yOnder - r * sp;
    o.fx = rnd(0, 6.3); o.fy = rnd(0, 6.3);
    plaats(o); ionen.push(o);
  }
  return ionen;
}
function aantrekLijnen(pad, ionen, max) {
  let d = "";
  for (let i = 0; i < ionen.length; i++) for (let j = i + 1; j < ionen.length; j++) {
    const a = ionen[i], b = ionen[j];
    if (a.q * b.q > 0) continue;
    if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 < max * max) d += `M${a.x.toFixed(0)} ${a.y.toFixed(0)}L${b.x.toFixed(0)} ${b.y.toFixed(0)}`;
  }
  pad.setAttribute("d", d);
}

    maak("path", { d: "M597,78 L602,62 L608,76 L614,62 L619,78", fill: "none", stroke: "#11264a", "stroke-width": 2 }, tek);
    this.lampTekst = maak("text", { x: 608, y: 122, class: "lab-z", "text-anchor": "middle" }, tek);
    this.tLabel = maak("text", { x: 450, y: 528, class: "lab", "text-anchor": "middle" }, tek);
    // water op de achtergrond
    this.water = [];
    const laag = maak("g", { opacity: .5 }, tek);
    if (t === "opgelost") for (let i = 0; i < 40; i++) {
      const m = maakMolecuul(laag, "water", .8);
      m.x = rnd(156, 744); m.y = rnd(226, 484); m.hoek = rnd(0, 6.3); m.vh = rnd(-1, 1);
      m.vx = rnd(-30, 30); m.vy = rnd(-30, 30);
      this.water.push(m); plaatsMol(m);
    }
    // ionen: eerst als rooster op de bodem
    const g = maak("g", {}, tek), sp = 46, opg = t === "opgelost", nk = opg ? 4 : 6, nr = opg ? 3 : 4;   // opgelost: minder ionen, zodat de watermantels passen
    this.ionen = rooster(g, Z, nk, nr, sp, 450 - (nk - 1) / 2 * sp, 494 - Z.rn - 2);
    this.ionen.forEach(o => { o.vast = true; o.mantel = null; });
    if (t === "opgelost") {
      const mid = { x: 450, y: 494 - (nr - 1) / 2 * sp - Z.rn };
      this.ionen.sort((a, b) => Math.hypot(b.x - mid.x, b.y - mid.y) - Math.hypot(a.x - mid.x, a.y - mid.y));
      this.ionen.forEach((o, i) => {
        o.los = .6 + i * .35;
        o.mantel = maak("g", { opacity: 0 }, g);
        g.insertBefore(o.mantel, o.g);
        o.mw = [0, 1, 2, 3, 4].map(() => maakMolecuul(o.mantel, "water", .75));
        o.mh = rnd(0, 6.3); o.rc = o.r; o.r = o.r + 22;   // de watermantel neemt ruimte in
      });
    }
    if (t === "gesmolten") this.ionen.forEach(o => o.vast = false);
    this.tLabel.textContent = t === "vast" ? "vast natriumchloride (20 °C)" : t === "gesmolten" ? "gesmolten natriumchloride (boven 801 °C)" : "natriumchloride opgelost in water: een zoutoplossing";
    this.tekst();
  },
  stap(dt) {
    this.t += dt;
    const t = this.toestand, tijd = performance.now() / 1000;
    if (t === "vast") {
      for (const o of this.ionen) { o.x = o.hx + 1.5 * Math.sin(tijd * 9 + o.fx); o.y = o.hy + 1.5 * Math.sin(tijd * 9.7 + o.fy); }
    } else {
      if (t === "opgelost") for (const o of this.ionen) {
        if (o.vast && this.t >= o.los) o.vast = false;
        if (o.vast) { o.x = o.hx + 2 * Math.sin(tijd * 9 + o.fx); o.y = o.hy + 2 * Math.sin(tijd * 9.7 + o.fy); }
      }
      vloeistofStap(this.ionen, this.vak, dt, { ruis: 2600, veld: t === "opgelost" ? 220 : 420, ruimte: t === "opgelost" ? 1.02 : 1.15, plak: t === "gesmolten" ? 250 : 0, wissel: t === "gesmolten" ? 5 : 0 });
    }
    this.ionen.forEach(o => {
      plaats(o);
      if (o.mantel) {                                   // watermoleculen rond een losgemaakt ion
        o.mantel.setAttribute("opacity", Math.min(1, Math.max(0, (this.t - o.los) * 1.5)).toFixed(2));
        o.mh += dt * .6;
        o.mw.forEach((m, k) => {
          const h = o.mh + k * Math.PI * 2 / 5, a = o.rc + 12;
          m.x = o.x + Math.cos(h) * a; m.y = o.y + Math.sin(h) * a;
          // bij een positief ion wijst de O-kant naar het ion, bij een negatief ion de H-kant
          m.hoek = h + (o.q > 0 ? Math.PI / 2 : -Math.PI / 2);
          plaatsMol(m);
        });
      }
    });
    for (const m of this.water) {
      m.vx += rnd(-1, 1) * 400 * dt; m.vy += rnd(-1, 1) * 400 * dt; m.vx *= .98; m.vy *= .98;
      m.x += m.vx * dt; m.y += m.vy * dt; m.hoek += m.vh * dt;
      if (m.x < 152 || m.x > 748) m.vx *= -1; if (m.y < 224 || m.y > 486) m.vy *= -1;
      m.x = Math.min(748, Math.max(152, m.x)); m.y = Math.min(486, Math.max(224, m.y));
      plaatsMol(m);
    }
    const vrij = this.ionen.filter(o => !o.vast).length;
    const aan = t === "gesmolten" || (t === "opgelost" && vrij > this.ionen.length / 2);
    this.gloed.setAttribute("opacity", aan ? (.55 + .1 * Math.sin(tijd * 6)).toFixed(2) : 0);
    this.lampTekst.textContent = aan ? "het lampje brandt" : "het lampje brandt niet";
    this.draad.setAttribute("stroke", aan ? "#c27c0e" : "#11264a");
  },
  tekst() {
    const t = this.toestand, p = [];
    p.push(`Twee staafjes (elektroden) zitten aan een batterij en een lampje. Stroom is een stroom van <b>bewegende geladen deeltjes</b>.`);
    if (t === "vast") p.push(`In <b>vast</b> zout zitten de ionen vast in het ionrooster. Ze trillen alleen op hun plek en kunnen niet naar de elektroden bewegen. Er loopt geen stroom: <b>vast zout geleidt niet</b>.`);
    if (t === "gesmolten") p.push(`In <b>gesmolten</b> zout zijn de ionen los. De positieve ionen bewegen naar de min-elektrode, de negatieve ionen naar de plus-elektrode. Bewegende geladen deeltjes: er loopt stroom. <b>Een gesmolten zout geleidt.</b>`);
    if (t === "opgelost") p.push(`Zout lost goed op in water: zout is <b>hydrofiel</b>. Watermoleculen trekken de ionen één voor één uit het rooster en omringen ze. Bij een positief ion zit de O-kant van het watermolecuul naar het ion, bij een negatief ion de H-kant.`,
      `De losse ionen kunnen bewegen naar de elektroden: <b>een zoutoplossing geleidt</b> stroom.`);
    zetUitleg(p);
  }
};

    elektronenStap(this.E, this.ionen, e => e.y < this.vlak ? { ...B, y1: O.y1 } : { ...O, y0: B.y0 }, dt);
  },
  tekst(teruggeveerd) {
    const p = [];
    if (this.soort === "zuiver") {
      p.push(`In een zuiver metaal zitten de ionen in nette lagen, met overal vrije elektronen ertussen.`);

        : `Klik op <b>Duw</b> en vergelijk met het zuivere metaal.`);
    }
    zetUitleg(p);
  }
};

/* ---- Moleculair 1: kookpunten (met verdieping: bindingen tussen moleculen) ---- */
const vKrachten = {
  id: "krachten", titel: "Kookpunten", eig: ["smeltpunt", "kookpunt", "elektrische geleiding"],

    maak("text", { x: 280, y: 40, class: "lab", "text-anchor": "middle" }, tek, verdieping ? `${S.naam} (${S.formule}): ${SOORT[S.soort][0]}` : `${S.naam} (${S.formule})`);
    if (verdieping) maak("text", { x: 280, y: 14, class: "lab-z", "text-anchor": "middle", "font-weight": 700, fill: "#c27c0e", "letter-spacing": "2" }, tek, "VERDIEPING");
    this.lijnen = maak("g", {}, tek);
    this.wolken = maak("g", {}, tek);
    const laag = maak("g", {}, tek);
    this.labels = maak("g", {}, tek);
    this.mol = [];
    const sch = S.id === "water" ? 2.6 : S.id === "methaan" ? 2.6 : S.id === "co2" ? 2.4 : 2;
    const plekken = !verdieping ? [[150, 270, 0], [410, 270, 0]] : S.soort === "hbrug" ? this.waterPlekken(sch)
      : S.soort === "dipool" ? [[170, 230, Math.PI / 2], [350, 320, Math.PI / 2]] : [[150, 270, 0], [410, 270, 0]];
    for (const [x, y, h] of plekken) {
      const m = maakMolecuul(laag, S.id, sch); m.bx = m.x = x; m.by = m.y = y; m.hoek = m.bh = h; m.f = rnd(0, 6.3); this.mol.push(m); plaatsMol(m);
    }
    this.sch = sch;
    const br = Math.max(...MOL[S.id].map(a => Math.abs(a[1]) + a[3])) * sch + 14, ho = Math.max(...MOL[S.id].map(a => Math.abs(a[2]) + a[3])) * sch + 14;
    this.br = br;
    if (!verdieping) {                               // basis: alleen dát de moleculen elkaar zwak aantrekken
      this.lijn = maak("line", { x1: 150 + br - 8, x2: 410 - br + 8, y1: 270, y2: 270, stroke: "#8a97a8", "stroke-width": 3, "stroke-dasharray": "6 6" }, this.lijnen);
      maak("text", { x: 280, y: 250, class: "lab-z", "text-anchor": "middle" }, this.lijnen, "zwakke");
      maak("text", { x: 280, y: 300, class: "lab-z", "text-anchor": "middle" }, this.lijnen, "aantrekking");
    } else if (S.soort === "vdw") {
      this.mol.forEach(m => { m.wolk = maak("ellipse", { rx: br, ry: ho, fill: "rgba(47,111,181,.14)", stroke: "#2f6fb5", "stroke-dasharray": "5 5", "stroke-width": 1.5 }, this.wolken); });
      this.dl = this.mol.map(() => [maak("text", { class: "delta", fill: "#c0392b" }, this.labels, "δ−"), maak("text", { class: "delta", fill: "#2f6fb5" }, this.labels, "δ+")]);
      this.lijn = maak("line", { stroke: SOORT.vdw[1], "stroke-width": 4, "stroke-dasharray": "6 6" }, this.lijnen);
    }
    this.grafiek();
    maak("text", { x: 280, y: 486, class: "lab-z", "text-anchor": "middle" }, tek, "Bij koken blijven de moleculen heel:");
    maak("text", { x: 280, y: 506, class: "lab-z", "text-anchor": "middle" }, tek, verdieping ? "alleen de bindingen tússen de moleculen gaan los." : "ze komen alleen los van elkaar.");
    if (verdieping) Object.values(SOORT).forEach(([t, k], i) => {
      maak("line", { x1: 600, x2: 626, y1: 490 + i * 20, y2: 490 + i * 20, stroke: k, "stroke-width": 4, "stroke-dasharray": "5 4" }, tek);
      maak("text", { x: 634, y: 495 + i * 20, class: "lab-z", "font-size": 13 }, tek, t);
    });
    this.tekst();
  },
  /* drie watermoleculen: H van het ene molecuul wijst recht naar O van het volgende (O–H···O op één lijn) */
  waterPlekken(sch) {
    const L = Math.hypot(9.5, 9) * sch + 7 * sch + 11 * sch + 58;     // O–H-binding + afstand H···O
    const hoekOH = Math.atan2(9, 9.5);                                 // richting O→H in het molecuul
    const plek = (ox, oy, h) => [ox - (Math.sin(h) * 2) * sch, oy + (Math.cos(h) * 2) * sch, h];   // middelpunt uit plek van O
    // Een waterstofbrug komt bij het O-atoom binnen aan de kant zónder H-atomen (in het molecuul: "boven" het O).
    // a (linksboven) geeft een H aan b; b (midden, rechtop) geeft een H aan c (rechtsonder).
    const Ob = [295, 280], hb = 0;
    const f1 = 55 * Math.PI / 180;                     // richting van H(a) naar O(b): schuin naar beneden, dus b's O krijgt hem van boven
    const f2 = hb + hoekOH;                            // richting van H(b) naar O(c)
    const ha = f1 - hoekOH, hc = f2 + 1.5 * Math.PI;   // c draait zijn H-vrije kant naar b
    const Oa = [Ob[0] - L * Math.cos(f1), Ob[1] - L * Math.sin(f1)], Oc = [Ob[0] + L * Math.cos(f2), Ob[1] + L * Math.sin(f2)];
    return [plek(...Oa, ha), plek(...Ob, hb), plek(...Oc, hc)];
  },
  grafiek() {
    const x = 640, y0 = 70, y1 = 450, Tmin = -180, Tmax = 120, yT = T => y1 - (T - Tmin) / (Tmax - Tmin) * (y1 - y0);
    maak("text", { x: x - 20, y: 44, class: "lab", "text-anchor": "start" }, tek, "kookpunt (°C)");
    maak("line", { x1: x, x2: x, y1: y0, y2: y1, stroke: "#11264a", "stroke-width": 3 }, tek);
    for (const T of [-150, -100, -50, 0, 50, 100]) {
      maak("line", { x1: x - 6, x2: x, y1: yT(T), y2: yT(T), stroke: "#11264a", "stroke-width": 2 }, tek);
      maak("text", { x: x - 10, y: yT(T) + 5, class: "lab-z", "text-anchor": "end", "font-size": 13 }, tek, fmt(T));
    }
    const yk = yT(20);
    maak("line", { x1: x - 30, x2: 890, y1: yk, y2: yk, stroke: "#c0392b", "stroke-width": 2, "stroke-dasharray": "6 5" }, tek);
    maak("text", { x: 890, y: yk - 6, class: "lab-z", "text-anchor": "end", fill: "#c0392b", "font-size": 13 }, tek, "kamertemperatuur 20 °C");
    for (const s of STOFFEN) {
      const y = yT(s.kp), kies = s.id === this.stof;
      maak("circle", { cx: x, cy: y, r: kies ? 10 : 7, fill: verdieping ? SOORT[s.soort][1] : "#2c5687", stroke: "#fff", "stroke-width": 2 }, tek);
      maak("text", { x: x + 18, y: y + 5, "font-size": kies ? 16 : 14, "font-weight": kies ? 700 : 500, fill: "#11264a" }, tek,
        `${s.naam} ${fmt(s.kp)} °C`);
    }
  },
  stap(dt) {
    this.t += dt; const t = this.t, S = this.S;
    const beweeg = !(verdieping && S.soort === "hbrug");
    this.mol.forEach((m, i) => { m.x = m.bx + (beweeg ? 3 * Math.sin(t * 1.3 + m.f) : 0); m.y = m.by + (beweeg ? 3 * Math.sin(t * 1.1 + m.f * 2) : 0); m.hoek = m.bh + (beweeg ? .05 * Math.sin(t + m.f) : 0); plaatsMol(m); });
    if (!verdieping) return;
    if (S.soort === "vdw") {
      const s = Math.sin(t * 2.1) * 9, sterk = Math.abs(s) / 9;
      this.mol.forEach((m, i) => {
        m.wolk.setAttribute("cx", m.x + s); m.wolk.setAttribute("cy", m.y);
        const [min, plus] = this.dl[i], kant = s >= 0 ? 1 : -1;
        min.setAttribute("x", m.x + kant * (this.br + 16)); min.setAttribute("y", m.y - 34);
        plus.setAttribute("x", m.x - kant * (this.br + 16)); plus.setAttribute("y", m.y - 34);
        min.setAttribute("opacity", sterk.toFixed(2)); plus.setAttribute("opacity", sterk.toFixed(2));
      });
      const a = this.mol[0], b = this.mol[1];
      this.lijn.setAttribute("x1", a.x + this.br + 4); this.lijn.setAttribute("x2", b.x - this.br - 4);
      this.lijn.setAttribute("y1", a.y); this.lijn.setAttribute("y2", b.y);
      this.lijn.setAttribute("opacity", (sterk * .9).toFixed(2));
    } else {
      // vaste ladingen: punten in molecuulcoördinaten omrekenen
      const p = (m, lx, ly) => { const c = Math.cos(m.hoek), s = Math.sin(m.hoek); return [m.x + (lx * c - ly * s) * this.sch, m.y + (lx * s + ly * c) * this.sch]; };
      this.labels.innerHTML = ""; this.lijnen.innerHTML = "";
      const delta = (x, y, t2, kl) => maak("text", { x, y, class: "delta", fill: kl }, this.labels, t2);
      if (S.soort === "dipool") {
        const [a, b] = this.mol;
        for (const m of this.mol) { const o = p(m, 0, -40), c = p(m, 0, 12); delta(...o, "δ−", "#c0392b"); delta(...c, "δ+", "#2f6fb5"); }
        const o = p(a, 0, -36), c = p(b, 0, 18);
        maak("line", { x1: o[0], y1: o[1], x2: c[0], y2: c[1], stroke: SOORT.dipool[1], "stroke-width": 4, "stroke-dasharray": "6 6" }, this.lijnen);
      } else {
        const [a, b, c] = this.mol;
        for (const m of this.mol) { const o = p(m, 0, -2), h1 = p(m, -9.5, 7), h2 = p(m, 9.5, 7);
          delta(o[0], o[1] - 40, "δ−", "#c0392b"); delta(h1[0] - 4, h1[1] + 26, "δ+", "#2f6fb5"); delta(h2[0] + 4, h2[1] + 26, "δ+", "#2f6fb5"); }

          const h = p(m1, 9.5, 7), o = p(m2, 0, -2);

          maak("line", { x1: h[0] + dx / l * rh, y1: h[1] + dy / l * rh, x2: o[0] - dx / l * ro, y2: o[1] - dy / l * ro, stroke: SOORT.hbrug[1], "stroke-width": 4, "stroke-dasharray": "4 5", "stroke-linecap": "round" }, this.lijnen); };
        brug(a, b); brug(b, c);
      }
    }
  },
  tekst() {
    const S = this.S;
    if (!verdieping) {
      const naam = S.naam[0].toUpperCase() + S.naam.slice(1);
      zetUitleg([

const spel = { verdieping: false, vragen: [], i: 0, punten: [], poging: 1, klaar: false };
function spelStart() {
  const html = `<div class="kaart start-spel">
    <h2>Spel: wat voor stof is het?</h2>
    <p>Je krijgt <b>5 vragen</b>. Bij een <b>stofkaart</b> lees je de eigenschappen van een stof. Sleep de kaart naar <b>zout</b>, <b>metaal</b> of <b>moleculaire stof</b> (of tik op een bak). Bij een <b>redeneervraag</b> kies je de goede verklaring.</p>
    <ul><li>Je mag twee keer controleren.</li><li>In één keer goed: <b>2 punten</b>. Goed bij de tweede keer: <b>1 punt</b>.</li>
      <li>Twee keer fout: 0 punten, en je ziet het goede antwoord met uitleg.</li></ul>
    <label class="schakelaar"><input type="checkbox" id="s-verdieping" ${spel.verdieping ? "checked" : ""}><span class="baan"></span>Moleculaire stoffen met verdieping (vanderwaalsbinding, dipool-dipoolbinding, waterstofbruggen)</label>
    <button class="groot-knop" id="s-start">▶ Start</button></div>`;
  $("spel").innerHTML = html;

}

function toonVraag() {
  spel.poging = 1; spel.klaar = false;
  const q = spel.vragen[spel.i];
  let h = `<div id="s-balk">${spelBalk()}</div><div class="kaart vraagvak">`;
  if (q.soort === "kaart") {
    h += `<p class="opdracht">Wat voor stof is dit? Sleep de kaart naar de goede bak.</p>
      <div class="kaartplek"><div class="stofkaart" id="s-kaart"><h3>Stof ?</h3><ul>${q.eig.map(e => `<li>${e.t}</li>`).join("")}</ul></div></div>
      <div class="bakken">${["zout", "metaal", "moleculair"].map(c => `<div class="bak" data-cat="${c}" role="button" tabindex="0"><span class="bak-titel">${c === "moleculair" ? "Moleculaire stof" : c[0].toUpperCase() + c.slice(1)}</span><span class="bak-sub">${c === "zout" ? "ionen" : c === "metaal" ? "metaalionen en vrije elektronen" : "moleculen"}</span></div>`).join("")}</div>`;
  } else {
    h += `<p class="opdracht">${q.verd ? `<span class="verd-label">Verdieping</span> ` : ""}${q.v}</p>
      <div class="opties">${q.o.map((o, j) => `<button data-j="${j}">${o[0]}</button>`).join("")}</div>`;
  }
  h += `<div class="feedback" id="s-fb" hidden></div><div class="knoppen"><button class="hoofd" id="s-verder" hidden>${spel.i < spel.vragen.length - 1 ? "Volgende vraag →" : "Bekijk je score →"}</button></div></div>`;
  $("spel").innerHTML = h;
  koppelBalk();
  $("s-verder").addEventListener("click", () => { spel.i++; spel.i < spel.vragen.length ? toonVraag() : eindScherm(); });
  if (q.soort === "kaart") koppelKaart(q); else koppelKeuze(q);
}
function koppelBalk() { $("s-stop").addEventListener("click", spelStart); }
function werkBalk() { $("s-balk").innerHTML = spelBalk(); koppelBalk(); }
function feedback(soort, html) { const f = $("s-fb"); f.hidden = false; f.className = "feedback " + soort; f.innerHTML = html; }
function afronden(pnt) { spel.punten.push(pnt); spel.klaar = true; $("s-verder").hidden = false; werkBalk(); $("s-verder").focus({ preventScroll: true }); }

function koppelKaart(q) {
  const kaart = $("s-kaart");
  let sleep = null;
  kaart.addEventListener("pointerdown", e => {
    if (spel.klaar) return;
    const kb = kaart.getBoundingClientRect();
    kaart.style.transformOrigin = `${e.clientX - kb.left}px ${e.clientY - kb.top}px`;   // krimpen rond de vinger of muis
    sleep = { x: e.clientX, y: e.clientY, id: e.pointerId }; kaart.setPointerCapture(e.pointerId); kaart.classList.add("sleep");
    kaart.style.transform = "scale(.4)";
  });
  kaart.addEventListener("pointermove", e => {
    if (!sleep) return;
    kaart.style.transform = `translate(${e.clientX - sleep.x}px, ${e.clientY - sleep.y}px) scale(.4) rotate(2deg)`;
    const bak = bakOnder(e.clientX, e.clientY);
    document.querySelectorAll(".bak").forEach(b => b.classList.toggle("boven", b === bak));
  });
  const los = e => {
    if (!sleep) return;
    sleep = null; kaart.classList.remove("sleep");
    const bak = bakOnder(e.clientX, e.clientY);
    document.querySelectorAll(".bak").forEach(b => b.classList.remove("boven"));
    kaart.style.transform = "";
    if (bak) kies(bak);
  };
  kaart.addEventListener("pointerup", los); kaart.addEventListener("pointercancel", () => { sleep = null; kaart.style.transform = ""; kaart.classList.remove("sleep"); });
  function bakOnder(x, y) {
    kaart.style.pointerEvents = "none";
    const el = document.elementFromPoint(x, y); kaart.style.pointerEvents = "";
    const b = el && el.closest(".bak"); return b && !b.classList.contains("uit") ? b : null;
  }
  document.querySelectorAll(".bak").forEach(b => {
    b.addEventListener("pointerup", e => { if (!sleep && e.target.closest(".bak") === b && !b.classList.contains("uit")) kies(b); });
    b.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !b.classList.contains("uit")) { e.preventDefault(); kies(b); } });
  });
  function kies(bak) {
    if (spel.klaar) return;
    const c = bak.dataset.cat, s = q.stof, goed = c === s.cat;
    const verklaring = `<p>Het is <b>${s.naam}</b>, een <b>${CAT_NAAM[s.cat]}</b>:</p><ul>${q.eig.map(e => `<li>${e.t} → ${e.u}.</li>`).join("")}</ul>`;
    if (goed) {
      bak.classList.add("goed"); kaart.classList.add("weg");
      feedback("goed", `<p><b>Goed!</b></p>` + verklaring);
      afronden(spel.poging === 1 ? 2 : 1);
    } else if (spel.poging === 1) {
      bak.classList.add("uit", "fout");
      feedback("fout", `<p><b>Nog niet goed: het is geen ${CAT_NAAM[c]}.</b></p><p>${(s.fout && s.fout[c]) || KAART_FOUT[s.cat + ">" + c]}</p><p>Probeer het nog een keer.</p>`);
      spel.poging = 2; werkBalk();
    } else {
      bak.classList.add("uit", "fout");
      document.querySelector(`.bak[data-cat="${s.cat}"]`).classList.add("goed");
      feedback("fout", `<p><b>Helaas, ook niet goed.</b> ${(s.fout && s.fout[c]) || KAART_FOUT[s.cat + ">" + c]}</p>` + verklaring);
      afronden(0);
    }
  }
}
function koppelKeuze(q) {
  document.querySelectorAll(".opties button").forEach(b => b.addEventListener("click", () => {
    if (spel.klaar || b.disabled) return;
    const [tekst, goed, fb] = q.o[+b.dataset.j];
    if (goed) {
      b.classList.add("goed");
      feedback("goed", `<p><b>Goed!</b> ${q.u}</p>`);
      afronden(spel.poging === 1 ? 2 : 1);
    } else if (spel.poging === 1) {
      b.classList.add("fout"); b.disabled = true;
      feedback("fout", `<p><b>Nog niet goed.</b> ${fb}</p><p>Probeer het nog een keer.</p>`);
      spel.poging = 2; werkBalk();
    } else {
      b.classList.add("fout"); b.disabled = true;
      document.querySelectorAll(".opties button").forEach(x => { if (q.o[+x.dataset.j][1]) x.classList.add("goed"); });
      feedback("fout", `<p><b>Helaas, ook niet goed.</b> ${fb}</p><p>Het goede antwoord: <b>${q.o.find(o => o[1])[0]}</b> ${q.u}</p>`);
      afronden(0);
    }
  }));
}
function eindScherm() {
  const tot = spel.punten.reduce((a, b) => a + b, 0), max = spel.vragen.length * 2;
  const sterren = tot >= 9 ? 3 : tot >= 6 ? 2 : tot >= 3 ? 1 : 0;
  const naam = q => q.soort === "kaart" ? q.stof.naam.split(" (")[0] : "redeneervraag";
  $("spel").innerHTML = `<div class="kaart resultaat"><h2>Klaar!</h2>
    <div class="sterren">${"★".repeat(sterren)}${"☆".repeat(3 - sterren)}</div>
    <div class="totaal">${tot} / ${max}</div><p>punten</p>
    <ol>${spel.vragen.map((q, j) => `<li><span class="f">${j + 1}</span><br>${naam(q)}<br><span class="pnt ${spel.punten[j] === 2 ? "vol" : spel.punten[j] === 1 ? "half" : "nul"}">${spel.punten[j]} ${spel.punten[j] === 1 ? "punt" : "punten"}</span></li>`).join("")}</ol>
    <div class="rij"><button class="groot-knop" id="s-weer">↺ Opnieuw spelen</button><button class="groot-knop licht" id="s-menu">Spelregels</button></div></div>`;
  $("s-weer").addEventListener("click", nieuwSpel);
  $("s-menu").addEventListener("click", spelStart);
}

/* ===================================================================== NAVIGATIE */
const DELEN = { zout: [zRooster, zBros, zGeleiding], metaal: [mGeleiding, mVervorm], moleculair: [vKrachten] };
let cat = "zout", deel = zRooster, pauze = false;

function kies(c, d) {
  cat = c;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.cat === c));
  const verg = c === "vergelijk", sp = c === "spel";
  $("app").hidden = verg || sp; $("vergelijk").hidden = !verg; $("spel").hidden = !sp;
  if (verg) { $("delen").innerHTML = ""; bouwVergelijk(); return; }
  if (sp) { $("delen").innerHTML = ""; spelStart(); return; }
  const lijst = DELEN[c];
  deel = lijst.find(x => x.id === d) || lijst[0];
  $("delen").innerHTML = lijst.map(x => `<button data-id="${x.id}" aria-pressed="${x === deel}">${x.titel}</button>`).join("") +
    `<button class="pauze" id="pauze">${pauze ? "▶ Doorgaan" : "⏸ Pauzeer"}</button>`;
  $("delen").querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", () => kies(cat, b.dataset.id)));
  $("pauze").addEventListener("click", () => { pauze = !pauze; $("pauze").textContent = pauze ? "▶ Doorgaan" : "⏸ Pauzeer"; });
  toonDeel();
}
function toonDeel() {
  uitlegOud = "";
  $("bed-titel").textContent = deel.titel;
  $("bediening").innerHTML = deel.paneel();
  $("chips").innerHTML = deel.eig.map(e => `<span>${e}</span>`).join("");
  tek.setAttribute("aria-label", deel.titel);
  deel.bouw();
  deel.koppel();
  deel.stap(0);
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => kies(b.dataset.cat)));

let laatst = performance.now();
function lus(nu) {
  const dt = Math.min(.05, (nu - laatst) / 1000); laatst = nu;
  if (!pauze && !$("app").hidden) deel.stap(dt);
  requestAnimationFrame(lus);
}
if (matchMedia("(prefers-reduced-motion: reduce)").matches) pauze = true;
const q = new URLSearchParams(location.search);
spel.verdieping = verdieping;
kies(["zout", "metaal", "moleculair", "vergelijk", "spel"].includes(q.get("tab")) ? q.get("tab") : "zout", q.get("deel"));
requestAnimationFrame(lus);
</script>
