<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stofeigenschappen op microniveau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #11264a; --navy2: #163a63; --navy3: #2c5687;
    --licht: #eef4fb; --licht2: #dbe8f5; --rand: #c9d8ea;
    --tekst: #14213a; --zacht: #4a5a72;
    --plus: #3fa55b; --min: #e0574a; --metaal: #f8e39b; --elektron: #e8890c;
    --kop: "Oswald", "Arial Narrow", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Inter, "Helvetica Neue", Arial, sans-serif; color: var(--tekst); background: var(--licht);
         line-height: 1.45; font-size: 15px; -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 4px; padding: 8px 12px 0; background: var(--navy); overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: 0 0 auto; border: 0; background: transparent; color: #cfdcef; padding: 9px 14px 10px; border-radius: 8px 8px 0 0;
                 font-family: var(--kop); letter-spacing: .08em; text-transform: uppercase; font-size: .9rem; }
  .tabs button:hover { color: #fff; background: rgba(255,255,255,.08); }
  .tabs button[aria-selected="true"] { background: var(--licht); color: var(--navy); }

  .delen { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 10px 12px 0; }
  .delen button { border: 1px solid var(--rand); background: #fff; border-radius: 99px; padding: 6px 14px; font-weight: 600; font-size: .9rem; color: var(--navy2); }
  .delen button[aria-pressed="true"] { background: var(--navy2); border-color: var(--navy2); color: #fff; }
  .delen .pauze { margin-left: auto; border-radius: 8px; }

  .scherm { padding: 10px 12px 12px; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
  .kaart { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(11,26,51,.1); padding: 12px 14px; min-width: 0; }
  .kaart h2 { margin: 0 0 8px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--zacht); font-weight: 600; }
  .paneel { display: flex; flex-direction: column; gap: 10px; }
  .podium { padding: 6px; }
  #tek { width: 100%; height: clamp(300px, calc(100vh - 140px), 600px); display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }

  .knoppen { display: flex; gap: 6px; flex-wrap: wrap; }
  .knoppen + .knoppen { margin-top: 8px; }
  .knoppen button { flex: 1 1 auto; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--rand); background: #fff; font-weight: 600; font-size: .9rem; }
  .knoppen button.hoofd { background: var(--navy2); color: #fff; border-color: var(--navy2); }
  .knoppen button[aria-pressed="true"] { background: var(--navy2); color: #fff; border-color: var(--navy2); }
  .knoppen button:disabled { opacity: .45; cursor: default; }
  select { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--rand); background: #fff; }
  label.schuif { display: block; font-size: .9rem; margin-top: 4px; }
  label.schuif input { width: 100%; accent-color: var(--navy2); }
  label.optie { display: flex; gap: 8px; align-items: center; font-size: .9rem; margin-top: 8px; cursor: pointer; }
  label.optie input { width: 17px; height: 17px; accent-color: var(--navy2); }
  .stoflijst { display: grid; gap: 4px; }
  .stoflijst button { display: flex; justify-content: space-between; gap: 8px; text-align: left; padding: 4px 10px; border-radius: 7px;
                      border: 1px solid var(--rand); background: #fff; font-size: .88rem; }
  .stoflijst button span:last-child { font-weight: 700; color: var(--navy); white-space: nowrap; }
  .stoflijst button[aria-pressed="true"] { border-color: var(--navy2); box-shadow: inset 0 0 0 1px var(--navy2); background: var(--licht); }

  .uitleg p { margin: 0 0 7px; font-size: .9rem; line-height: 1.4; }
  .uitleg p:last-child { margin-bottom: 0; }
  .uitleg p.nieuw { animation: in .6s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .uitleg b { color: var(--navy); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: -2px 0 10px; }
  .chips span { font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--licht2); color: var(--navy2); }
  .legenda { display: grid; gap: 5px; font-size: .86rem; margin-top: 8px; }
  .legenda div { display: flex; align-items: center; gap: 8px; }
  .legenda i { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; border: 1.5px solid rgba(0,0,0,.3); }
  .legenda i.lijn { border-radius: 0; height: 0; border: 0; border-top: 3px dashed; width: 20px; }

  svg text { font-family: Inter, Arial, sans-serif; }
  .ion-t { font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .lab { font-size: 17px; font-weight: 600; fill: var(--navy2); }
  .lab-z { font-size: 15px; fill: var(--zacht); }
  .groot { font-size: 26px; font-weight: 700; fill: var(--navy); }
  .delta { font-size: 19px; font-weight: 700; font-style: italic; text-anchor: middle; dominant-baseline: central; }

  /* vergelijken */
  .vergelijk { max-width: 1100px; margin: 0 auto; }
  .vergelijk .rij { display: grid; grid-template-columns: 190px repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
  .vergelijk .kop { font-family: var(--kop); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--navy2);
                    border-radius: 8px; padding: 8px 12px; font-size: .95rem; }
  .vergelijk .eig { background: var(--navy2); color: #fff; border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: .92rem; }
  .vergelijk .cel { background: #fff; border-radius: 8px; padding: 9px 12px; font-size: .88rem; box-shadow: 0 1px 2px rgba(11,26,51,.08); }
  .vergelijk .cel b { display: block; color: var(--navy); font-size: .95rem; margin-bottom: 2px; }
  .vergelijk .cel a { color: var(--navy3); font-weight: 600; font-size: .82rem; text-decoration: none; display: inline-block; margin-top: 3px; cursor: pointer; }
  .vergelijk .cel a:hover { text-decoration: underline; }
  .vergelijk .cel .cat { display: none; font-family: var(--kop); letter-spacing: .06em; text-transform: uppercase; font-size: .78rem; color: var(--zacht); }

  @media (max-width: 760px) {
    .app { display: flex; flex-direction: column; align-items: stretch; }
    .paneel { display: contents; }
    .kaart.bed { order: 1; }
    .podium { order: 2; }
    .kaart.uit { order: 3; }
    #tek { height: auto; aspect-ratio: 900 / 540; }
    .scherm { padding: 8px; }
    .vergelijk .rij { grid-template-columns: 1fr; }
    .vergelijk .rij.koprij { display: none; }
    .vergelijk .cel .cat { display: block; }
  }
</style>
</head>
<body>
<nav class="tabs" role="tablist" aria-label="Soort stof">
  <button role="tab" data-cat="zout" aria-selected="true">Zouten</button>
  <button role="tab" data-cat="metaal" aria-selected="false">Metalen</button>
  <button role="tab" data-cat="moleculair" aria-selected="false">Moleculaire stoffen</button>
  <button role="tab" data-cat="vergelijk" aria-selected="false">Vergelijken</button>
</nav>
<div class="delen" id="delen"></div>

<main class="scherm">
  <section class="app" id="app">
    <div class="kaart podium"><svg id="tek" viewBox="0 0 900 540" role="img"></svg></div>
    <div class="paneel">
      <div class="kaart bed">
        <h2 id="bed-titel">Doe het zelf</h2>
        <div class="chips" id="chips" title="Stofeigenschappen in dit onderdeel"></div>
        <div id="bediening"></div>
      </div>
      <div class="kaart uit">
        <h2>Wat zie je?</h2>
        <div class="uitleg" id="uitleg" aria-live="polite"></div>
      </div>
    </div>
  </section>
  <section class="vergelijk" id="vergelijk" hidden></section>
</main>

<script>
"use strict";
/* =====================================================================
   Stofeigenschappen op microniveau (§3.1–§3.2)
   Eén simulatie met drie categorieën (zouten, metalen, moleculaire
   stoffen) en een vergelijking. Elke categorie heeft onderdelen die elk
   zonder scrollen in beeld passen.
   URL: ?tab=zout|metaal|moleculair|vergelijk  &deel=<id van het onderdeel>
   ===================================================================== */
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const tek = $("tek");
const KLEUR = {
  p: ["#3fa55b", "#23733a", "#fff"],        // positief ion: groen
  n: ["#e0574a", "#9b2a20", "#fff"],        // negatief ion: rood
  m: ["#f8e39b", "#a88d2c", "#11264a"],     // metaalion: geel
  a: ["#e2b64f", "#7c5f14", "#11264a"]      // ander metaal (legering)
};
const fmt = t => (t < 0 ? "−" : "") + String(Math.abs(t)).replace(".", ",");
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const tussen = (t, a, b) => ease((t - a) / (b - a));
const rnd = (a, b) => a + Math.random() * (b - a);

function maak(tag, attrs, ouder, tekst) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (tekst != null) el.textContent = tekst;
  if (ouder) ouder.appendChild(el);
  return el;
}
function defs() {
  const d = maak("defs", {}, tek);
  const grad = (id, licht, donker) => {
    const rg = maak("radialGradient", { id, cx: "35%", cy: "32%", r: "70%" }, d);
    maak("stop", { offset: "0", "stop-color": licht }, rg); maak("stop", { offset: "1", "stop-color": donker }, rg);
  };
  grad("gO", "#ff9a8c", "#cf3a2e"); grad("gH", "#ffffff", "#d3dae3"); grad("gC", "#7a828d", "#262a30");
  const pijl = maak("marker", { id: "pijl", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, markerUnits: "userSpaceOnUse", orient: "auto-start-reverse" }, d);
  maak("path", { d: "M0,0 L10,5 L0,10 z", fill: "#c0392b" }, pijl);
  return d;
}
/* een ion of metaalion: bol met lading of symbool */
function maakIon(ouder, soort, r, label) {
  const [vul, rand, tk] = KLEUR[soort];
  const g = maak("g", {}, ouder);
  const c = maak("circle", { r, fill: vul, stroke: rand, "stroke-width": 2 }, g);
  const t = maak("text", { class: "ion-t", fill: tk, "font-size": Math.max(11, r * .72) }, g, label);
  return { g, c, t, r, soort, x: 0, y: 0, vx: 0, vy: 0 };
}
function plaats(o) { o.g.setAttribute("transform", `translate(${o.x.toFixed(1)} ${o.y.toFixed(1)})`); }

/* molecuulmodellen (kalotmodel, plat getekend): [element, x, y, straal] */
const AT = { O: ["url(#gO)", "#9b2a20"], H: ["url(#gH)", "#8a97a8"], C: ["url(#gC)", "#15181c"] };
function alkaan(n, zonderMiddenH) {
  const C = [], H = [];
  for (let i = 0; i < n; i++) {
    const x = (i - (n - 1) / 2) * 20, y = i % 2 ? -5 : 5, uit = i % 2 ? -1 : 1;
    C.push(["C", x, y, 10.5]);
    if (zonderMiddenH && i === 1) continue;
    H.push(["H", x, y + uit * 14, 7]);
    if (i === 0 || i === n - 1) H.push(["H", x + (i === 0 ? -14 : 14), y - uit * 3, 7]);
    if (i > 0 && i < n - 1) H.push(["H", x, y - uit * 14, 7]);
    else H.push(["H", x + (i === 0 ? -6 : 6), y - uit * 13, 7]);
  }
  return [...H, ...C];
}
const MOL = {
  water: [["H", -9.5, 7, 7], ["H", 9.5, 7, 7], ["O", 0, -2, 11]],
  co2: [["C", 0, 0, 10], ["O", -17, 0, 10.5], ["O", 17, 0, 10.5]],
  methaan: [["H", -15, 0, 7], ["H", 15, 0, 7], ["H", 0, -15, 7], ["H", 0, 15, 7], ["C", 0, 0, 11]],
  propaan: alkaan(3), butaan: alkaan(4), hexaan: alkaan(6),
  propanon: [...alkaan(3, true), ["O", 0, -24, 11]],
  ethanol: [["H", -24, -2, 6], ["H", -19, 13, 6], ["H", -13, -9, 6], ["H", -3, -15, 6], ["H", 9, -14, 6], ["H", 26, -3, 5.5],
            ["C", -14, 3, 9.5], ["C", 2, -4, 9.5], ["O", 17, 3, 9.5]]
};
function maakMolecuul(ouder, soort, schaal = 1) {
  const g = maak("g", {}, ouder), binnen = maak("g", { transform: `scale(${schaal})` }, g);
  for (const [el, x, y, r] of MOL[soort]) maak("circle", { cx: x, cy: y, r, fill: AT[el][0], stroke: AT[el][1], "stroke-width": 1 }, binnen);
  return { g, x: 0, y: 0, hoek: 0, soort, schaal };
}
function plaatsMol(m) { m.g.setAttribute("transform", `translate(${m.x.toFixed(1)} ${m.y.toFixed(1)}) rotate(${(m.hoek * 57.3).toFixed(1)})`); }

/* vrije elektronen in een metaal (zoals bij Metaalbinding in hoofdstuk 2):
   een langzaam draaiende "zin", zwakke aantrekking door de ionen, afstoting onderling */
function elektronenStap(E, ionen, grens, dt, opt = {}) {
  const RAND = 60, drift = opt.drift || 0;
  for (const e of E) {
    let ax = 0, ay = 0;
    e.zin += (Math.random() - .5) * 5 * Math.sqrt(dt);
    ax += Math.cos(e.zin) * 45; ay += Math.sin(e.zin) * 45;
    const b = grens(e);
    const duw = d => d < RAND ? 420 * Math.pow(1 - Math.max(d, 0) / RAND, 2) : 0;
    if (!opt.open) { ax += duw(e.x - b.x0) - duw(b.x1 - e.x); }
    ay += duw(e.y - b.y0) - duw(b.y1 - e.y);
    for (const a of ionen) {
      const dx = a.x - e.x, dy = a.y - e.y, d2 = dx * dx + dy * dy;
      if (d2 > 150 * 150) continue;
      const d = Math.sqrt(d2) || 1;
      let f = 200000 / (d2 + 2500);
      if (d < a.r + 12) f -= 900 * (1 - d / (a.r + 12));
      ax += f * dx / d; ay += f * dy / d;
    }
    for (const o of E) {
      if (o === e) continue;
      const dx = e.x - o.x, dy = e.y - o.y, d2 = dx * dx + dy * dy;
      if (d2 > 44 * 44 || d2 === 0) continue;
      const d = Math.sqrt(d2), f = 700 * (1 - d / 44);
      ax += f * dx / d; ay += f * dy / d;
    }
    ax += drift;
    e.vx += ax * dt; e.vy += ay * dt;
    const schaal = opt.snelheid ? opt.snelheid(e) : 1;
    const MAX = 110 * schaal + Math.abs(drift) * .25, MIN = 45 * schaal;
    const v = Math.hypot(e.vx, e.vy) || 1, doel = Math.min(MAX, Math.max(MIN, v));
    e.vx *= doel / v; e.vy *= doel / v;
    e.x += e.vx * dt; e.y += e.vy * dt;
    if (opt.open) {                                  // stroomkring: rechts eruit, links er weer in
      if (e.x > b.x1 + 8) { e.x = b.x0 - 4; }
      if (e.x < b.x0 - 8) { e.x = b.x1 + 4; }
    } else e.x = Math.max(b.x0 - 8, Math.min(b.x1 + 8, e.x));
    e.y = Math.max(b.y0 - 8, Math.min(b.y1 + 8, e.y));
    e.el.setAttribute("cx", e.x.toFixed(1)); e.el.setAttribute("cy", e.y.toFixed(1));
  }
}
function maakElektron(ouder, x, y) {
  const h = Math.random() * 6.28;
  return { el: maak("circle", { cx: x, cy: y, r: 7, fill: "#e8890c", stroke: "#fff", "stroke-width": 2 }, ouder), x, y, vx: Math.cos(h) * 60, vy: Math.sin(h) * 60, zin: h };
}

/* deeltjes in een vloeistof: afstoten, beetje plakken, trillen; optioneel een elektrisch veld */
function vloeistofStap(D, vak, dt, opt = {}) {
  const K = opt.ruis || 2400, zw = opt.zwaarte || 0, veld = opt.veld || 0;
  for (const p of D) {
    if (p.vast) continue;
    p.vx += ((Math.random() - .5) * 2 * K + (p.q ? -p.q * veld : 0)) * dt;
    p.vy += ((Math.random() - .5) * 2 * K + zw) * dt;
    const demp = Math.exp(-4 * dt); p.vx *= demp; p.vy *= demp;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let it = 0; it < 2; it++) {
    for (let i = 0; i < D.length; i++) for (let j = i + 1; j < D.length; j++) {
      const a = D[i], b = D[j];
      if (a.vast && b.vast) continue;
      const dmin = (a.r + b.r) * (opt.ruimte || 1.12);
      let dx = b.x - a.x, dy = b.y - a.y; const d2 = dx * dx + dy * dy;
      if (d2 > dmin * dmin * 2.2) continue;
      const d = Math.sqrt(d2) || .01, nx = dx / d, ny = dy / d;
      if (d < dmin) {
        const wa = a.vast ? 0 : 1, wb = b.vast ? 0 : 1, s = wa + wb, ov = dmin - d;
        a.x -= nx * ov * wa / s; a.y -= ny * ov * wa / s; b.x += nx * ov * wb / s; b.y += ny * ov * wb / s;
      } else if (it === 0 && opt.plak && a.q && b.q && a.q * b.q < 0) {   // tegengestelde ladingen trekken elkaar aan
        const f = opt.plak * dt;
        if (!a.vast) { a.vx += nx * f; a.vy += ny * f; }
        if (!b.vast) { b.vx -= nx * f; b.vy -= ny * f; }
      }
    }
    for (const p of D) {
      if (p.vast) continue;
      if (p.x < vak.x0 + p.r) { p.x = vak.x0 + p.r; p.vx = Math.abs(p.vx) * .3; }
      if (p.x > vak.x1 - p.r) { p.x = vak.x1 - p.r; p.vx = -Math.abs(p.vx) * .3; }
      if (p.y < vak.y0 + p.r) { p.y = vak.y0 + p.r; p.vy = Math.abs(p.vy) * .3; }
      if (p.y > vak.y1 - p.r) { p.y = vak.y1 - p.r; p.vy = -Math.abs(p.vy) * .3; }
    }
  }
}

/* ---------- uitleg en bediening ---------- */
let uitlegOud = "";
function zetUitleg(paragrafen) {                 // lijst met alinea's; nieuwe alinea's worden aangevuld
  const html = paragrafen.map(p => `<p>${p}</p>`).join("");
  if (html === uitlegOud) return;
  const oud = uitlegOud; uitlegOud = html;
  $("uitleg").innerHTML = html;
  if (oud && html.startsWith(oud.slice(0, -4))) {
    const ps = $("uitleg").querySelectorAll("p"); if (ps.length) ps[ps.length - 1].classList.add("nieuw");
  }
}
function knoppenHtml(lijst) {                   // [[id, tekst, extraKlasse]]
  return `<div class="knoppen">${lijst.map(([id, t, k]) => `<button id="${id}" ${k ? `class="${k}"` : ""}>${t}</button>`).join("")}</div>`;
}
function groep(id, opties, actief) {             // knoppen waarvan er één tegelijk aan staat
  return `<div class="knoppen" id="${id}">${opties.map(([w, t]) => `<button data-w="${w}" aria-pressed="${w === actief}">${t}</button>`).join("")}</div>`;
}
function bijGroep(id, fn) {
  $(id).querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    fn(b.dataset.w);
  }));
}
function legenda(items) {
  return `<div class="legenda">${items.map(([kleur, t, lijn]) =>
    `<div><i ${lijn ? `class="lijn" style="border-top-color:${kleur}"` : `style="background:${kleur}"`}></i>${t}</div>`).join("")}</div>`;
}

/* ===================================================================== ZOUTEN */
const ZOUTEN = {
  nacl: { naam: "natriumchloride", kort: "keukenzout", p: "Na⁺", n: "Cl⁻", rp: 15, rn: 24, smp: 801, kp: 1465 },
  mgo:  { naam: "magnesiumoxide", kort: "", p: "Mg²⁺", n: "O²⁻", rp: 12, rn: 21, smp: 2852, kp: 3600 }
};
function rooster(ouder, Z, cols, rows, sp, x0, yOnder, schaal = 1) {   // ionrooster, onderste rij op yOnder
  const ionen = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const plus = (r + c) % 2 === 0;
    const o = maakIon(ouder, plus ? "p" : "n", (plus ? Z.rp : Z.rn) * schaal, plus ? Z.p : Z.n);
    o.q = plus ? 1 : -1; o.rij = r; o.kol = c;
    o.hx = o.x = x0 + c * sp; o.hy = o.y = yOnder - r * sp;
    o.fx = rnd(0, 6.3); o.fy = rnd(0, 6.3);
    plaats(o); ionen.push(o);
  }
  return ionen;
}
function aantrekLijnen(pad, ionen, max) {
  let d = "";
  for (let i = 0; i < ionen.length; i++) for (let j = i + 1; j < ionen.length; j++) {
    const a = ionen[i], b = ionen[j];
    if (a.q * b.q > 0) continue;
    if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 < max * max) d += `M${a.x.toFixed(0)} ${a.y.toFixed(0)}L${b.x.toFixed(0)} ${b.y.toFixed(0)}`;
  }
  pad.setAttribute("d", d);
}

        `Zouten en moleculaire stoffen hebben geen vrije elektronen: daar gaat warmte veel langzamer.`);

  }
};

    maak("text", { x: 890, y: yk - 6, class: "lab-z", "text-anchor": "end", fill: "#c0392b", "font-size": 13 }, tek, "kamertemperatuur 20 °C");
    for (const s of STOFFEN) {
      const y = yT(s.kp), kies = s.id === this.stof;
      maak("circle", { cx: x, cy: y, r: kies ? 10 : 7, fill: SOORT[s.soort][1], stroke: "#fff", "stroke-width": 2 }, tek);
      maak("text", { x: x + 18, y: y + 5, "font-size": kies ? 16 : 14, "font-weight": kies ? 700 : 500, fill: "#11264a" }, tek,
        `${s.naam} ${fmt(s.kp)} °C`);
    }
  },
  stap(dt) {
    this.t += dt; const t = this.t, S = this.S;
    this.mol.forEach((m, i) => { m.x = m.bx + 3 * Math.sin(t * 1.3 + m.f); m.y = m.by + 3 * Math.sin(t * 1.1 + m.f * 2); m.hoek = m.bh + .05 * Math.sin(t + m.f); plaatsMol(m); });
    let d = "";
    if (S.soort === "vdw") {
      const s = Math.sin(t * 2.1) * 9, sterk = Math.abs(s) / 9;
      this.mol.forEach((m, i) => {
        m.wolk.setAttribute("cx", m.x + s); m.wolk.setAttribute("cy", m.y);
        const [min, plus] = this.dl[i], kant = s >= 0 ? 1 : -1;
        min.setAttribute("x", m.x + kant * (this.br + 16)); min.setAttribute("y", m.y - 34);
        plus.setAttribute("x", m.x - kant * (this.br + 16)); plus.setAttribute("y", m.y - 34);
        min.setAttribute("opacity", sterk.toFixed(2)); plus.setAttribute("opacity", sterk.toFixed(2));
      });
      const a = this.mol[0], b = this.mol[1];
      this.lijn.setAttribute("x1", a.x + this.br + 4); this.lijn.setAttribute("x2", b.x - this.br - 4);
      this.lijn.setAttribute("y1", a.y); this.lijn.setAttribute("y2", b.y);
      this.lijn.setAttribute("opacity", (sterk * .9).toFixed(2));
    } else {
      // vaste ladingen: punten in molecuulcoördinaten omrekenen
      const p = (m, lx, ly) => { const c = Math.cos(m.hoek), s = Math.sin(m.hoek); return [m.x + (lx * c - ly * s) * this.sch, m.y + (lx * s + ly * c) * this.sch]; };
      this.labels.innerHTML = ""; this.lijnen.innerHTML = "";
      const delta = (x, y, t2, kl) => maak("text", { x, y, class: "delta", fill: kl }, this.labels, t2);
      if (S.soort === "dipool") {
        const [a, b] = this.mol;
        for (const m of this.mol) { const o = p(m, 0, -40), c = p(m, 0, 12); delta(...o, "δ−", "#c0392b"); delta(...c, "δ+", "#2f6fb5"); }
        const o = p(a, 0, -36), c = p(b, 0, 18);
        maak("line", { x1: o[0], y1: o[1], x2: c[0], y2: c[1], stroke: SOORT.dipool[1], "stroke-width": 4, "stroke-dasharray": "6 6" }, this.lijnen);
      } else {
        const [a, b, c] = this.mol;
        for (const m of this.mol) { const o = p(m, 0, -2), h1 = p(m, -9.5, 7), h2 = p(m, 9.5, 7);
          delta(o[0], o[1] - 40, "δ−", "#c0392b"); delta(h1[0] - 4, h1[1] + 26, "δ+", "#2f6fb5"); delta(h2[0] + 4, h2[1] + 26, "δ+", "#2f6fb5"); }
        const brug = (m1, hx, m2) => { const h = p(m1, hx, 7), o = p(m2, 0, -2);
          const dx = o[0] - h[0], dy = o[1] - h[1], l = Math.hypot(dx, dy);
          maak("line", { x1: h[0] + dx / l * 18, y1: h[1] + dy / l * 18, x2: o[0] - dx / l * 30, y2: o[1] - dy / l * 30, stroke: SOORT.hbrug[1], "stroke-width": 4, "stroke-dasharray": "4 6" }, this.lijnen); };
        brug(a, 9.5, b); brug(b, 9.5, c);
      }
    }
  },
  tekst() {
    zetUitleg([TEKST_STOF[this.stof],
      `Bindingen tussen moleculen zijn veel zwakker dan ionbinding en metaalbinding: <b>lage smelt- en kookpunten</b>. Moleculen zijn niet geladen en er zijn geen vrije elektronen: <b>geen stroomgeleiding</b>.`]);
  }
};

/* ---- Moleculair 2: oplossen in water (hydrofiel en hydrofoob) ---- */
const vOplossen = {
  id: "oplossen", titel: "Hydrofiel en hydrofoob", eig: ["oplosbaarheid", "hydrofiel", "hydrofoob", "dichtheid"],
  stof: "ethanol", bruggen: true,
  paneel() {
    return groep("o-stof", [["ethanol", "Ethanol (alcohol)"], ["hexaan", "Hexaan (lijkt op olie)"]], this.stof) +
      knoppenHtml([["o-roer", "🥄 Roer", "hoofd"], ["o-opnieuw", "↺ Opnieuw"]]) +
      `<label class="optie"><input type="checkbox" id="o-bruggen" checked> Toon de waterstofbruggen</label>` +
      legenda([["#ff9a8c", "watermolecuul"], ["#7a828d", this.stof === "ethanol" ? "ethanolmolecuul" : "hexaanmolecuul"], ["#c27c0e", "waterstofbrug", true]]);
  },
  koppel() {
    bijGroep("o-stof", w => { this.stof = w; toonDeel(); });
    $("o-roer").addEventListener("click", () => this.roer());
    $("o-opnieuw").addEventListener("click", () => this.bouw());
    $("o-bruggen").checked = this.bruggen;
    $("o-bruggen").addEventListener("change", e => this.bruggen = e.target.checked);
  },
  bouw() {
    tek.innerHTML = ""; defs();
    this.fase = "begin"; this.t = 0;
    const C = 10, R = 6, X0 = 170, Y0 = 150, DX = 62, DY = 54;
    this.slot = (c, r) => ({ x: X0 + DX / 2 + c * DX, y: Y0 + DY / 2 + r * DY });
    this.C = C; this.R = R; this.DX = DX;
    maak("rect", { x: X0 - 6, y: Y0 - 6, width: C * DX + 12, height: R * DY + 12, fill: "#eef5fc" }, tek);
    maak("path", { d: `M${X0 - 10},${Y0 - 50} L${X0 - 10},${Y0 + R * DY + 10} L${X0 + C * DX + 10},${Y0 + R * DY + 10} L${X0 + C * DX + 10},${Y0 - 50}`,
      fill: "none", stroke: "#2c5687", "stroke-width": 4, "stroke-linejoin": "round" }, tek);
    this.pad = maak("path", { fill: "none", stroke: "#c27c0e", "stroke-width": 2.5, "stroke-dasharray": "3 4", opacity: .85 }, tek);
    const laag = maak("g", {}, tek);
    this.D = [];
    const hex = this.stof === "hexaan";
    // begin: de stof drijft als laag op het water (beide hebben een kleinere dichtheid dan water)
    const plekken = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) plekken.push([c, r]);
    if (hex) {
      for (let i = 0; i < 8; i++) { const r = Math.floor(i / 4), c = (i % 4) * 2 + (r ? 1 : 0); this.voeg(laag, "hexaan", [[c, r], [c + 1, r]]); }
      plekken.filter(([c, r]) => r >= 2).slice(0, 40).forEach(p => this.voeg(laag, "water", [p]));
    } else {
      plekken.filter(([c, r]) => r === 0).forEach(p => this.voeg(laag, "ethanol", [p]));
      plekken.filter(([c, r]) => r >= 1).slice(0, 40).forEach(p => this.voeg(laag, "water", [p]));
    }
    this.D.forEach(d => { const h = this.thuis(d); d.x = h.x; d.y = h.y; plaatsMol(d); });
    this.tLabel = maak("text", { x: 480, y: 120, class: "lab", "text-anchor": "middle" }, tek);
    this.tekst();
  },
  voeg(laag, soort, slots) {
    const m = maakMolecuul(laag, soort, soort === "hexaan" ? .9 : soort === "ethanol" ? 1 : 1.05);
    m.slots = slots; m.f = rnd(0, 6.3); m.ox = rnd(-9, 9); m.oy = rnd(-8, 8); m.hoek = soort === "hexaan" ? 0 : rnd(-1, 1); m.wissel = null;
    this.D.push(m); return m;
  },
  thuis(m) { const s = m.slots.map(([c, r]) => this.slot(c, r)); return { x: s.reduce((a, p) => a + p.x, 0) / s.length, y: s.reduce((a, p) => a + p.y, 0) / s.length }; },
  verdeel(gemengd) {                             // nieuwe plekken: gemengd of in lagen
    const vrij = new Set(); for (let r = 0; r < this.R; r++) for (let c = 0; c < this.C; c++) vrij.add(`${c},${r}`);
    const neem = (c, r) => vrij.delete(`${c},${r}`);
    const hex = this.D.filter(m => m.soort === "hexaan"), rest = this.D.filter(m => m.soort !== "hexaan");
    if (hex.length) {
      const paren = [];
      for (let r = 0; r < this.R; r++) for (let c = 0; c < this.C - 1; c += 2) paren.push([c + (r % 2), r]);
      const kies = gemengd ? paren.filter(([c]) => c + 1 < this.C).sort(() => Math.random() - .5) : paren.filter(([c, r]) => r < 2 && c + 1 < this.C);
      hex.forEach((m, i) => { const [c, r] = kies[i]; m.slots = [[c, r], [c + 1, r]]; neem(c, r); neem(c + 1, r); });
      const over = [...vrij].map(s => s.split(",").map(Number)).filter(([c, r]) => gemengd || r >= 2).sort(() => Math.random() - .5);
      rest.forEach((m, i) => { m.slots = [over[i]]; });
    } else {
      const over = [...vrij].map(s => s.split(",").map(Number)).sort(() => Math.random() - .5);
      rest.forEach((m, i) => { m.slots = [over[i]]; });
    }
    this.D.forEach(m => { m.van = { x: m.x, y: m.y }; m.reis = 0; m.reisDuur = rnd(.9, 1.6) + (gemengd ? 0 : rnd(0, 2.5)); m.wissel = null; });
  },
  roer() { this.verdeel(true); this.fase = "roeren"; this.t = 0; this.tekst(); },
  stap(dt) {
    this.t += dt;
    const tijd = performance.now() / 1000;
    if (this.fase === "roeren" && this.t > 2.2) {
      if (this.stof === "hexaan") { this.verdeel(false); this.fase = "ontmengen"; }
      else this.fase = "gemengd";
      this.t = 0; this.tekst();
    }
    if (this.fase === "ontmengen" && this.t > 5) { this.fase = "lagen"; this.tekst(); }
    // in een vloeistof wisselen buren steeds van plek (niet de grote hexaanmoleculen)
    if (this.fase !== "roeren" && Math.random() < dt * 5) {
      const l = this.D.filter(m => m.slots.length === 1 && !m.wissel && !(m.reis < m.reisDuur));
      const a = l[Math.floor(Math.random() * l.length)];
      const b = a && l.find(o => o !== a && Math.abs(o.slots[0][0] - a.slots[0][0]) + Math.abs(o.slots[0][1] - a.slots[0][1]) === 1 &&
        (this.stof !== "hexaan" || true));
      if (b) { const s = a.slots; a.slots = b.slots; b.slots = s; [a, b].forEach(m => { m.van = { x: m.x, y: m.y }; m.reis = 0; m.reisDuur = 1; }); }
    }
    for (const m of this.D) {
      const h = this.thuis(m);
      let x = h.x, y = h.y;
      if (m.reis !== undefined && m.reis < m.reisDuur) {
        m.reis += dt; const f = ease(m.reis / m.reisDuur);
        const boog = this.fase === "roeren" ? Math.sin(Math.PI * f) * 60 : Math.sin(Math.PI * f) * 14;
        x = m.van.x + (h.x - m.van.x) * f + boog * Math.cos(m.f); y = m.van.y + (h.y - m.van.y) * f + boog * Math.sin(m.f);
      }
      m.x = x + m.ox + 4 * Math.sin(tijd * 3 + m.f); m.y = y + m.oy + 4 * Math.sin(tijd * 2.6 + m.f * 2);
      if (m.soort !== "hexaan") m.hoek += Math.sin(tijd * .8 + m.f) * dt * .8;
      plaatsMol(m);
    }
    let d = "";
    if (this.bruggen) {
      const P = this.D.filter(m => m.soort !== "hexaan");
      for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
        const a = P[i], b = P[j], dd = (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
        if (dd < 64 * 64 && (i + j) % 2 === 0) d += `M${a.x.toFixed(0)} ${a.y.toFixed(0)}L${b.x.toFixed(0)} ${b.y.toFixed(0)}`;
      }
    }
    this.pad.setAttribute("d", d);
  },
  tekst() {
    const hex = this.stof === "hexaan", f = this.fase, p = [];
    this.tLabel.textContent = f === "begin" ? (hex ? "hexaan drijft op water" : "ethanol drijft op water") : f === "roeren" ? "roeren…" :
      hex ? (f === "lagen" ? "twee lagen: hexaan lost niet op" : "de lagen scheiden weer") : "één vloeistof: ethanol is opgelost";
    p.push(`Watermoleculen trekken elkaar sterk aan via <b>waterstofbruggen</b> (oranje stippellijnen).`);
    if (!hex) {
      p.push(f === "begin" ? `Ethanol heeft een kleinere dichtheid dan water en ligt er eerst bovenop. Klik op <b>Roer</b>.`
        : `Een ethanolmolecuul heeft een OH-groep. Daarmee vormt het waterstofbruggen met watermoleculen. De moleculen blijven door elkaar: <b>ethanol lost op in water</b>. Ethanol is <b>hydrofiel</b> (waterlievend).`);
    } else {
      p.push(f === "begin" ? `Hexaan lijkt op olie. Het heeft een kleinere dichtheid dan water (0,66 g/cm³ tegen 1,00 g/cm³) en drijft erop. Klik op <b>Roer</b>.`
        : `Hexaan kan geen waterstofbruggen vormen. De watermoleculen houden elkaar vast en drukken de hexaanmoleculen eruit. Na het roeren ontstaan weer <b>twee lagen</b>: hexaan lost niet op in water. Hexaan is <b>hydrofoob</b> (waterafstotend).`);
      if (f === "lagen") p.push(`De hexaanlaag ligt bovenop, omdat de <b>dichtheid</b> van hexaan kleiner is dan die van water.`);
    }
    zetUitleg(p);
  }
};

function bouwVergelijk() {
  const cats = ["Zouten", "Metalen", "Moleculaire stoffen"];
  let h = `<div class="rij koprij"><div></div>${cats.map(c => `<div class="kop">${c}</div>`).join("")}</div>`;
  for (const [eig, ...cellen] of VERGELIJK) {

/* ===================================================================== NAVIGATIE */
const DELEN = { zout: [zRooster, zBros, zGeleiding], metaal: [mGeleiding, mVervorm], moleculair: [vKrachten, vOplossen] };
let cat = "zout", deel = zRooster, pauze = false;

function kies(c, d) {
  cat = c;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.cat === c));
  const verg = c === "vergelijk";
  $("app").hidden = verg; $("vergelijk").hidden = !verg;
  if (verg) { $("delen").innerHTML = ""; bouwVergelijk(); return; }
  const lijst = DELEN[c];
  deel = lijst.find(x => x.id === d) || lijst[0];
  $("delen").innerHTML = lijst.map(x => `<button data-id="${x.id}" aria-pressed="${x === deel}">${x.titel}</button>`).join("") +
    `<button class="pauze" id="pauze">${pauze ? "▶ Doorgaan" : "⏸ Pauzeer"}</button>`;
  $("delen").querySelectorAll("button[data-id]").forEach(b => b.addEventListener("click", () => kies(cat, b.dataset.id)));
  $("pauze").addEventListener("click", () => { pauze = !pauze; $("pauze").textContent = pauze ? "▶ Doorgaan" : "⏸ Pauzeer"; });
  toonDeel();
}
function toonDeel() {
  uitlegOud = "";
  $("bed-titel").textContent = deel.titel;
  $("bediening").innerHTML = deel.paneel();
  $("chips").innerHTML = deel.eig.map(e => `<span>${e}</span>`).join("");
  tek.setAttribute("aria-label", deel.titel);
  deel.bouw();
  deel.koppel();
  deel.stap(0);
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => kies(b.dataset.cat)));

let laatst = performance.now();
function lus(nu) {
  const dt = Math.min(.05, (nu - laatst) / 1000); laatst = nu;
  if (!pauze && !$("app").hidden) deel.stap(dt);
  requestAnimationFrame(lus);
}
if (matchMedia("(prefers-reduced-motion: reduce)").matches) pauze = true;
const q = new URLSearchParams(location.search);
kies(["zout", "metaal", "moleculair", "vergelijk"].includes(q.get("tab")) ? q.get("tab") : "zout", q.get("deel"));
requestAnimationFrame(lus);
</script>
